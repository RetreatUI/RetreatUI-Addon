name: Resolve Wago spell IDs

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/wago-resolve-spells-trigger'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: temp/wago-fetch
          fetch-depth: 0

      - name: Resolve spell names from AscensionDB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ids = @(
            574360,801128,803887,801126,524643,802985,572318,806812,804386,802797,801793,814291,
            800031,803343,803881,804764,804758,707513,704360,524947,807424,560645,705142,705143,
            802075,500028,520853,804220,578345,807942,804052,523483,523495,680308,800212,804216
          ) | Sort-Object -Unique
          $rows = @()
          foreach ($id in $ids) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri "https://db.ascension.gg/?spell=$id" -TimeoutSec 30
              $html = $response.Content
              $name = ''
              if ($html -match '<h1[^>]*>\s*([^<]+?)\s*</h1>') { $name = [System.Net.WebUtility]::HtmlDecode($Matches[1]).Trim() }
              $cooldown = ''
              if ($html -match 'Cooldown\s*</[^>]+>\s*<[^>]+>\s*([^<]+)') { $cooldown = [System.Net.WebUtility]::HtmlDecode($Matches[1]).Trim() }
              $rows += "$id`t$name`t$cooldown`t$($response.StatusCode)"
            } catch {
              $rows += "$id`t`t`tERROR:$($_.Exception.Message)"
            }
          }
          New-Item -ItemType Directory -Force -Path 'Research/Wago' | Out-Null
          [IO.File]::WriteAllLines((Join-Path $PWD 'Research/Wago/spell-id-names.tsv'), $rows)

      - name: Commit spell map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Research/Wago/spell-id-names.tsv
          git commit -m 'Resolve Wago spell IDs against AscensionDB' || exit 0
          git push origin HEAD:temp/wago-fetch
