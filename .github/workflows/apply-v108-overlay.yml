name: Apply RetreatUI v1.0.8 overlay

on:
  push:
    branches:
      - release/v1.0.8
    paths:
      - ".github/workflows/apply-v108-overlay.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.8
          fetch-depth: 0

      - name: Restore v1.0.8 source
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re
          import shutil
          import tarfile
          import tempfile
          import zipfile

          repo = Path.cwd()
          parts = sorted((repo / ".release-upload").glob("overlay.b64.*"))
          if not parts:
              raise SystemExit("No upload chunks found")

          raw = "".join(p.read_text(encoding="utf-8", errors="ignore") for p in parts)
          cleaned = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
          cleaned = cleaned.rstrip("=")
          cleaned += "=" * ((4 - len(cleaned) % 4) % 4)
          print(f"Base64 characters: {len(cleaned)} from {len(parts)} chunks")

          archive_bytes = base64.b64decode(cleaned, validate=False)
          archive = Path("/tmp/retreatui-upload.tar.gz")
          archive.write_bytes(archive_bytes)
          print(f"Decoded bytes: {archive.stat().st_size}")

          outer = Path(tempfile.mkdtemp(prefix="retreatui-outer-"))
          with tarfile.open(archive, "r:gz") as tf:
              tf.extractall(outer)
          print("Outer archive files:")
          for p in sorted(outer.rglob("*")):
              if p.is_file():
                  print(p.relative_to(outer))

          roots = [outer]
          nested_zips = sorted(outer.rglob("*.zip"))
          for nested in nested_zips:
              nested_root = Path(tempfile.mkdtemp(prefix="retreatui-zip-"))
              with zipfile.ZipFile(nested) as zf:
                  zf.extractall(nested_root)
              roots.append(nested_root)
              print(f"Extracted nested ZIP: {nested}")

          def find_addon(name):
              toc = f"{name}.toc"
              matches = []
              for root in roots:
                  for p in root.rglob(name):
                      if p.is_dir() and (p / toc).is_file():
                          matches.append(p)
              if len(matches) != 1:
                  raise SystemExit(f"Expected one {name} folder, found {matches}")
              return matches[0]

          for name in ("RetreatUI", "RetreatUI_Classes"):
              source = find_addon(name)
              target = repo / name
              if target.exists():
                  shutil.rmtree(target)
              shutil.copytree(source, target)
              print(f"Copied {source} -> {target}")

          shutil.rmtree(repo / ".release-upload")
          PY

          grep -F '## Version: 1.0.8' RetreatUI/RetreatUI.toc
          grep -F '## Version: 1.0.8' RetreatUI_Classes/RetreatUI_Classes.toc
          test -f RetreatUI_Classes/Bloodmage/HUD.lua
          test -f RetreatUI_Classes/Venomancer/HUD.lua
          test -f RetreatUI_Classes/Cultist/HUD.lua

      - name: Commit RetreatUI v1.0.8
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release RetreatUI v1.0.8"
          git push origin HEAD:release/v1.0.8
