name: Apply RetreatUI v1.0.8 overlay

on:
  push:
    branches:
      - release/v1.0.8
    paths:
      - ".github/workflows/apply-v108-overlay.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.8
          fetch-depth: 0

      - name: Rebuild v1.0.8 source
        shell: bash
        run: |
          set -euxo pipefail

          test -d .release-upload
          ls -lah .release-upload
          find .release-upload -maxdepth 1 -type f -name 'overlay.b64.*' -print | sort

          cat .release-upload/overlay.b64.* | tr -d '[:space:]' | base64 --decode > /tmp/retreatui-v108.tar.gz
          file /tmp/retreatui-v108.tar.gz
          gzip -t /tmp/retreatui-v108.tar.gz
          tar -tzf /tmp/retreatui-v108.tar.gz | head -100

          rm -rf /tmp/retreatui-v108
          mkdir -p /tmp/retreatui-v108
          tar -xzf /tmp/retreatui-v108.tar.gz -C /tmp/retreatui-v108

          CORE_DIR="$(find /tmp/retreatui-v108 -type f -path '*/RetreatUI/RetreatUI.toc' -printf '%h\n' | head -1)"
          CLASSES_DIR="$(find /tmp/retreatui-v108 -type f -path '*/RetreatUI_Classes/RetreatUI_Classes.toc' -printf '%h\n' | head -1)"

          test -n "$CORE_DIR"
          test -n "$CLASSES_DIR"
          echo "Core source: $CORE_DIR"
          echo "Classes source: $CLASSES_DIR"

          grep -F '## Version: 1.0.8' "$CORE_DIR/RetreatUI.toc"
          grep -F '## Version: 1.0.8' "$CLASSES_DIR/RetreatUI_Classes.toc"
          test -f "$CLASSES_DIR/Bloodmage/HUD.lua"
          test -f "$CLASSES_DIR/Venomancer/HUD.lua"
          test -f "$CLASSES_DIR/Cultist/HUD.lua"

          rm -rf RetreatUI RetreatUI_Classes
          cp -a "$CORE_DIR" RetreatUI
          cp -a "$CLASSES_DIR" RetreatUI_Classes
          rm -rf .release-upload

          grep -F '## Version: 1.0.8' RetreatUI/RetreatUI.toc
          grep -F '## Version: 1.0.8' RetreatUI_Classes/RetreatUI_Classes.toc

      - name: Commit RetreatUI v1.0.8
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Release RetreatUI v1.0.8"
          git push origin HEAD:release/v1.0.8
