name: Apply RetreatUI v1.0.8 overlay

on:
  push:
    branches:
      - release/v1.0.8
    paths:
      - ".github/workflows/apply-v108-overlay.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.8
          fetch-depth: 0

      - name: Restore v1.0.8 source
        shell: bash
        run: |
          set -euxo pipefail

          cat .release-upload/overlay.b64.* | tr -d '\r\n\t ' > /tmp/overlay.b64
          base64 --decode /tmp/overlay.b64 > /tmp/overlay.tar.gz
          gzip -t /tmp/overlay.tar.gz

          rm -rf /tmp/retreatui-upload
          mkdir -p /tmp/retreatui-upload
          tar -xzf /tmp/overlay.tar.gz -C /tmp/retreatui-upload
          find /tmp/retreatui-upload -maxdepth 4 -type f -print

          nested_zip="$(find /tmp/retreatui-upload -type f -name 'RetreatUI_v1.0.8.zip' -print -quit)"
          if [ -n "$nested_zip" ]; then
            rm -rf /tmp/retreatui-source
            mkdir -p /tmp/retreatui-source
            unzip -q "$nested_zip" -d /tmp/retreatui-source
          else
            rm -rf /tmp/retreatui-source
            mv /tmp/retreatui-upload /tmp/retreatui-source
          fi

          core_dir="$(find /tmp/retreatui-source -type f -path '*/RetreatUI/RetreatUI.toc' -printf '%h\n' | head -n 1)"
          classes_dir="$(find /tmp/retreatui-source -type f -path '*/RetreatUI_Classes/RetreatUI_Classes.toc' -printf '%h\n' | head -n 1)"

          test -n "$core_dir"
          test -n "$classes_dir"
          grep -F '## Version: 1.0.8' "$core_dir/RetreatUI.toc"
          grep -F '## Version: 1.0.8' "$classes_dir/RetreatUI_Classes.toc"

          rm -rf RetreatUI RetreatUI_Classes .release-upload
          cp -a "$core_dir" RetreatUI
          cp -a "$classes_dir" RetreatUI_Classes

          test -f RetreatUI_Classes/Bloodmage/HUD.lua
          test -f RetreatUI_Classes/Venomancer/HUD.lua
          test -f RetreatUI_Classes/Cultist/HUD.lua

      - name: Commit RetreatUI v1.0.8
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release RetreatUI v1.0.8"
          git push origin HEAD:release/v1.0.8
