name: Validate CoA WeakAura HUD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/beta20-coa-layout]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate beta.20 static WeakAuras and source package
        shell: bash
        run: |
          set -euo pipefail
          find RetreatUI RetreatUI_Classes RetreatUI_BuffManager -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          python3 tools/validate_beta20_weakauras.py
          python3 tools/validate_beta20_reference_payloads.py
          grep -Fq 'Data\WeakAurasBeta20Payloads.lua' RetreatUI/RetreatUI.toc
          grep -Fq 'Integrations\WeakAurasBeta20.lua' RetreatUI/RetreatUI.toc
          test ! -d RetreatUI/Data/WeakAurasBeta20
          test ! -e RetreatUI/Data/WeakAurasBeta20Finalize.lua
          test ! -e RetreatUI/Data/WeakAurasBeta20ShardBridge.lua
          grep -Fq 'classPayloadCount = 21' RetreatUI/Data/WeakAurasBeta20Payloads.lua
          ! grep -Rni --include='*.lua' --include='*.toc' --include='*.py' 'Naowh' RetreatUI RetreatUI_Classes tools
