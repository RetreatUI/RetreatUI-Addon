name: Validate CoA WeakAura HUD

on:
  pull_request:
    branches: [main]
    paths:
      - "RetreatUI/Core/WeakAuraHUDRuntime.lua"
      - "RetreatUI/Core/WeakAuraStateSafety.lua"
      - "RetreatUI/Core/WeakAuraHUDPackage.lua"
      - "RetreatUI/Core/WeakAuraIconStaticCompat.lua"
      - "RetreatUI/Core/WeakAuraHUDPulse.lua"
      - "RetreatUI/Integrations/WeakAuraHUDMigration.lua"
      - "RetreatUI/RetreatUI.toc"
      - "RetreatUI_Classes/**"
      - ".github/workflows/validate-coa-weakaura-hud.yml"
  push:
    branches: [main]
    paths:
      - "RetreatUI/Core/WeakAuraHUDRuntime.lua"
      - "RetreatUI/Core/WeakAuraStateSafety.lua"
      - "RetreatUI/Core/WeakAuraHUDPackage.lua"
      - "RetreatUI/Core/WeakAuraIconStaticCompat.lua"
      - "RetreatUI/Core/WeakAuraHUDPulse.lua"
      - "RetreatUI/Integrations/WeakAuraHUDMigration.lua"
      - "RetreatUI/RetreatUI.toc"
      - "RetreatUI_Classes/**"
      - ".github/workflows/validate-coa-weakaura-hud.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate WeakAura HUD migration
        shell: bash
        run: |
          set -euo pipefail

          luac5.1 -p RetreatUI/Core/WeakAuraHUDRuntime.lua
          luac5.1 -p RetreatUI/Core/WeakAuraStateSafety.lua
          luac5.1 -p RetreatUI/Core/WeakAuraHUDPackage.lua
          luac5.1 -p RetreatUI/Core/WeakAuraIconStaticCompat.lua
          luac5.1 -p RetreatUI/Core/WeakAuraHUDPulse.lua
          luac5.1 -p RetreatUI/Integrations/WeakAuraHUDMigration.lua

          grep -Fq 'Core\WeakAuraHUDRuntime.lua' RetreatUI/RetreatUI.toc
          grep -Fq 'Core\WeakAuraStateSafety.lua' RetreatUI/RetreatUI.toc
          grep -Fq 'Core\WeakAuraHUDPackage.lua' RetreatUI/RetreatUI.toc
          grep -Fq 'Core\WeakAuraIconStaticCompat.lua' RetreatUI/RetreatUI.toc
          grep -Fq 'Core\WeakAuraHUDPulse.lua' RetreatUI/RetreatUI.toc
          grep -Fq 'Integrations\WeakAuraHUDMigration.lua' RetreatUI/RetreatUI.toc

          # Every genuinely timed state must have both duration and expirationTime.
          grep -Fq 'progressType == "timed" and duration and duration > 0 and expirationTime and expirationTime > 0' RetreatUI/Core/WeakAuraStateSafety.lua
          grep -Fq 'state.progressType = "static"' RetreatUI/Core/WeakAuraStateSafety.lua
          grep -Fq 'state.expirationTime = nil' RetreatUI/Core/WeakAuraStateSafety.lua
          grep -Fq 'GetWeakAuraProcStates' RetreatUI/Core/WeakAuraStateSafety.lua
          grep -Fq 'GetWeakAuraTargetStates' RetreatUI/Core/WeakAuraStateSafety.lua
          grep -Fq 'GetWeakAuraClassStates' RetreatUI/Core/WeakAuraStateSafety.lua
          grep -Fq 'GetWeakAuraRowStates' RetreatUI/Core/WeakAuraStateSafety.lua

          # WeakAuras 5.21.2 on Ascension can crash in Icon:PreShow when a static
          # icon leaves an internal cooldown duration without expirationTime.
          # All cooldown-enabled generated icons therefore receive the zero-time
          # compatibility encoding at the final trigger boundary.
          grep -Fq 'display.regionType ~= "icon" or display.cooldown ~= true' RetreatUI/Core/WeakAuraIconStaticCompat.lua
          grep -Fq 'state.progressType = "timed"' RetreatUI/Core/WeakAuraIconStaticCompat.lua
          grep -Fq 'state.duration = 0' RetreatUI/Core/WeakAuraIconStaticCompat.lua
          grep -Fq 'state.expirationTime = 0' RetreatUI/Core/WeakAuraIconStaticCompat.lua
          grep -Fq 'WeakAura icon compatibility patch could not be applied' RetreatUI/Core/WeakAuraIconStaticCompat.lua
          grep -Fq '_weakAuraIconStaticCompatLoaded = true' RetreatUI/Core/WeakAuraIconStaticCompat.lua

          # Fixed RetreatUI geometry must remain identical to the native CoA HUD.
          grep -Fq 'local RESOURCE_X, RESOURCE_Y = 0, -152' RetreatUI/Core/WeakAuraHUDPackage.lua
          grep -Fq 'local SECONDARY_X, SECONDARY_Y = 0, -118' RetreatUI/Core/WeakAuraHUDPackage.lua
          grep -Fq 'local MAIN_X, MAIN_Y = 0, -183' RetreatUI/Core/WeakAuraHUDPackage.lua
          grep -Fq 'local UTILITY_X, UTILITY_Y = 0, -224' RetreatUI/Core/WeakAuraHUDPackage.lua
          grep -Fq 'local PROC_X, PROC_Y = 0, -83' RetreatUI/Core/WeakAuraHUDPackage.lua
          grep -Fq 'local TARGET_X, TARGET_Y = 310, -59' RetreatUI/Core/WeakAuraHUDPackage.lua
          grep -Fq 'local RESOURCE_WIDTH, RESOURCE_HEIGHT = 360, 16' RetreatUI/Core/WeakAuraHUDPackage.lua
          grep -Fq 'local MAIN_ICON, UTILITY_ICON = 38, 32' RetreatUI/Core/WeakAuraHUDPackage.lua
          grep -Fq 'local TRINKET_X, TRINKET_Y = -17, 1' RetreatUI/Core/WeakAuraHUDPackage.lua
          grep -Fq 'local TRINKET_FRAME = "ElvUF_Player"' RetreatUI/Core/WeakAuraHUDPackage.lua

          # The package is data-driven from the existing CoA class database.
          grep -Fq 'GetHUDSpellDefinitions(className, row)' RetreatUI/Core/WeakAuraHUDRuntime.lua
          grep -Fq 'GetAuraTrackerDefinitions(className)' RetreatUI/Core/WeakAuraHUDRuntime.lua
          grep -Fq 'GetClassSpellRecords(className)' RetreatUI/Core/WeakAuraHUDRuntime.lua
          grep -Fq 'GetClassResourceRecords(className)' RetreatUI/Core/WeakAuraHUDPackage.lua
          grep -Fq 'ReadAscensionResourceSnapshot' RetreatUI/Core/WeakAuraHUDRuntime.lua
          grep -Fq 'GetWeakAuraTargetStates' RetreatUI/Core/WeakAuraHUDRuntime.lua
          grep -Fq 'GetWeakAuraClassStates' RetreatUI/Core/WeakAuraHUDRuntime.lua

          # Custom Ascension resources keep the old 0.12s mirror cadence.
          grep -Fq 'RUI:After(0.12, Pulse)' RetreatUI/Core/WeakAuraHUDPulse.lua
          grep -Fq 'WeakAuras.ScanEvents, "UNIT_POWER_FREQUENT", "player"' RetreatUI/Core/WeakAuraHUDPulse.lua
          grep -Fq 'StartWeakAuraHUDPulse' RetreatUI/Integrations/WeakAuraHUDMigration.lua

          # Required hierarchy: General + per-class Resource/Main/Utility/State/Target.
          grep -Fq 'local GENERAL_ROOT = "RetreatUI - General"' RetreatUI/Core/WeakAuraHUDPackage.lua
          grep -Fq 'GENERAL_ROOT .. " — Trinkets"' RetreatUI/Core/WeakAuraHUDPackage.lua
          grep -Fq 'GENERAL_ROOT .. " — Buffs & Procs"' RetreatUI/Core/WeakAuraHUDPackage.lua
          for group in Resource Main Utility State Target; do
            grep -Fq 'rootID .. " — '"$group"'"' RetreatUI/Core/WeakAuraHUDPackage.lua
          done

          # Native visible HUD activation and native trinket rendering are bypassed.
          grep -Fq 'RUI.weakAuraHUDMode = true' RetreatUI/Integrations/WeakAuraHUDMigration.lua
          grep -Fq 'function RUI:ActivateClassHUD(force)' RetreatUI/Integrations/WeakAuraHUDMigration.lua
          grep -Fq 'function RUI:InitializeTrinketTracker()' RetreatUI/Integrations/WeakAuraHUDMigration.lua
          grep -Fq 'Class WeakAuras HUD' RetreatUI/Integrations/WeakAuraHUDMigration.lua
          grep -Fq 'names = {"WeakAuras"}, required = true' RetreatUI/Integrations/WeakAuraHUDMigration.lua

          # All 21 CoA class data packages remain present as the authoritative source.
          classes=(Necromancer Pyromancer Cultist Starcaller SunCleric Tinker Runemaster Primalist Reaper Venomancer Chronomancer Bloodmage Guardian Stormbringer Felsworn Barbarian WitchDoctor WitchHunter KnightOfXoroth Templar Ranger)
          for class in "${classes[@]}"; do
            test -f "RetreatUI_Classes/$class/Data.lua"
            grep -Fq 'RegisterClassSpellDatabase' "RetreatUI_Classes/$class/Data.lua"
          done

          # Core and Classes always ship with the same version.
          core_version="$(sed -n 's/^## Version:[[:space:]]*//p' RetreatUI/RetreatUI.toc | head -1 | tr -d '\r')"
          classes_version="$(sed -n 's/^## Version:[[:space:]]*//p' RetreatUI_Classes/RetreatUI_Classes.toc | head -1 | tr -d '\r')"
          test "$core_version" = "$classes_version"
