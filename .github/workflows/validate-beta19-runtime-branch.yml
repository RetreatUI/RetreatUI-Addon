name: Validate beta19 Runtime Branch

on:
  push:
    branches: [agent/coa-runtime-performance-beta19]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 zip
      - name: Validate Lua and package contract
        shell: bash
        run: |
          set -euo pipefail
          find RetreatUI RetreatUI_Classes RetreatUI_BuffManager -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

          core_version="$(sed -n 's/^## Version:[[:space:]]*//p' RetreatUI/RetreatUI.toc | head -1 | tr -d '\r')"
          classes_version="$(sed -n 's/^## Version:[[:space:]]*//p' RetreatUI_Classes/RetreatUI_Classes.toc | head -1 | tr -d '\r')"
          buff_version="$(sed -n 's/^## Version:[[:space:]]*//p' RetreatUI_BuffManager/RetreatUI_BuffManager.toc | head -1 | tr -d '\r')"
          manifest_version="$(jq -r '.version' .github/release-manifest.json)"
          test "$core_version" = "1.1.7-beta.19"
          test "$core_version" = "$classes_version"
          test "$core_version" = "$buff_version"
          test "$core_version" = "$manifest_version"

          grep -Fq 'Core\WeakAuraPerformanceBeta19.lua' RetreatUI/RetreatUI.toc
          grep -Fq 'RETREATUI_RESOURCE_PULSE' RetreatUI/Core/WeakAuraPerformanceBeta19.lua
          grep -Fq 'RETREATUI_ROW_REFRESH' RetreatUI/Core/WeakAuraPerformanceBeta19.lua
          grep -Fq 'RETREATUI_PLAYER_AURA_REFRESH' RetreatUI/Core/WeakAuraPerformanceBeta19.lua
          grep -Fq 'RETREATUI_TARGET_AURA_REFRESH' RetreatUI/Core/WeakAuraPerformanceBeta19.lua
          grep -Fq 'UnregisterEvent, imp, "COMBAT_LOG_EVENT_UNFILTERED"' RetreatUI/Core/WeakAuraPerformanceBeta19.lua
          ! grep -Fq 'WeakAuras.ScanEvents, "UNIT_POWER_FREQUENT"' RetreatUI/Core/WeakAuraHUDPulse.lua
          ! grep -Fq 'WeakAuras.ScanEvents, "UNIT_POWER_FREQUENT"' RetreatUI/Core/WeakAuraPerformanceBeta19.lua
          ! grep -Fq 'ACTIONBAR_UPDATE_COOLDOWN' RetreatUI_Classes/AdvancedHUD.lua
          ! grep -Fq 'UNIT_POWER_FREQUENT' RetreatUI_Classes/AdvancedHUD.lua

          # beta.18 chat ownership must remain untouched.
          ! grep -Fq 'FCF_UnDockFrame' RetreatUI/Integrations/ElvUI.lua
          ! grep -Fq 'FCF_Close' RetreatUI/Integrations/ElvUI.lua
          grep -Fq 'FCF_DockUpdate' RetreatUI/Integrations/ChatOwnershipSafety.lua
          ! grep -Fq 'PLAYER_TARGET_CHANGED' RetreatUI/Integrations/PyromancerAuraAndDetailsChat.lua

          rm -rf dist
          mkdir -p dist/package
          cp -a RetreatUI RetreatUI_Classes RetreatUI_BuffManager dist/package/
          (cd dist/package && zip -qr ../RetreatUI_beta19_test.zip RetreatUI RetreatUI_Classes RetreatUI_BuffManager)
          test -s dist/RetreatUI_beta19_test.zip
          zipinfo -1 dist/RetreatUI_beta19_test.zip | grep -Fq 'RetreatUI/Core/WeakAuraPerformanceBeta19.lua'
          zipinfo -1 dist/RetreatUI_beta19_test.zip | grep -Fq 'RetreatUI_Classes/RetreatUI_Classes.toc'
          zipinfo -1 dist/RetreatUI_beta19_test.zip | grep -Fq 'RetreatUI_BuffManager/RetreatUI_BuffManager.toc'
