name: Build RetreatUI dev21 overlay

on:
  push:
    branches:
      - build/dev21-venomancer-cleanup
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate overlay contents
        shell: bash
        run: |
          set -euo pipefail
          test -f dev21_overlay/Interface/AddOns/RetreatUI_Classes/Registry.lua
          grep -F 'local DEV21_VERSION = "1.0.2-dev.21"' dev21_overlay/Interface/AddOns/RetreatUI_Classes/Registry.lua
          grep -F '["Chitin Rush"] = true' dev21_overlay/Interface/AddOns/RetreatUI_Classes/Registry.lua
          grep -F '["Nullifying Toxin"] = true' dev21_overlay/Interface/AddOns/RetreatUI_Classes/Registry.lua
          ! grep -F '["Venomtip Poison"] = true' dev21_overlay/Interface/AddOns/RetreatUI_Classes/Registry.lua
          ! grep -F '["Hivebreak"] = true' dev21_overlay/Interface/AddOns/RetreatUI_Classes/Registry.lua
          ! grep -F '["Carapace Crash"] = true' dev21_overlay/Interface/AddOns/RetreatUI_Classes/Registry.lua
          ! grep -F '["Claw Strike"] = true' dev21_overlay/Interface/AddOns/RetreatUI_Classes/Registry.lua

      - name: Lua syntax validation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p dev21_overlay/Interface/AddOns/RetreatUI_Classes/Registry.lua

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI_v1.0.2-dev.21
          path: dev21_overlay
          if-no-files-found: error
          retention-days: 7
