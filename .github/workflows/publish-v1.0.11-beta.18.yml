name: Publish RetreatUI v1.0.11-beta.18

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-v1.0.11-beta.18/trigger-pr"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-v1.0.11-beta.18
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download beta.17 package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/base build/source
          gh release download v1.0.11-beta.17 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.17.zip' \
            --dir build/base
          unzip -q build/base/RetreatUI_v1.0.11-beta.17.zip -d build/source
          test -f build/source/RetreatUI/Integrations/TurboPlates.lua

      - name: Apply beta.18 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release-v1.0.11-beta.18/beta18.patch.gz.b64 > beta18.patch.gz
          echo '23366a8a43921c2a917af90b961c9bb50932db2b19b64de0119e712a7c89de26  beta18.patch.gz' | sha256sum -c -
          gzip -dc beta18.patch.gz > beta18.patch
          git apply --check -p2 --directory=build/source beta18.patch
          git apply -p2 --directory=build/source beta18.patch

      - name: Validate source and Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('build/source')
          turbo = (root / 'RetreatUI/Integrations/TurboPlates.lua').read_text(encoding='utf-8')
          core_toc = (root / 'RetreatUI/RetreatUI.toc').read_text(encoding='utf-8')
          classes_toc = (root / 'RetreatUI_Classes/RetreatUI_Classes.toc').read_text(encoding='utf-8')
          expected = '1.0.11-beta.18'
          checks = {
              'core version': f'## Version: {expected}' in core_toc,
              'classes version': f'## Version: {expected}' in classes_toc,
              'diagnostic function removed': 'ReportTargetManaDiagnostic' not in turbo,
              'diagnostic chat text removed': 'TurboPlates mana:' not in turbo,
              'diagnostic GUID removed': 'diagnosticGUID' not in turbo,
              'diagnostic flag removed': 'manaNPCDiagnostic' not in turbo,
              'strict mana evidence retained': 'UnitManaEvidence' in turbo,
              'synthetic pool rejection retained': 'synthetic_100_pool' in turbo,
              'non-mana class rejection retained': 'non_mana_class' in turbo,
              'direct TurboPlates route retained': 'PaintTurboPlate(myPlate, seenObjects)' in turbo,
          }
          for name, passed in checks.items():
              print(('PASS' if passed else 'FAIL') + ': ' + name)
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise RuntimeError('Validation failed: ' + ', '.join(failed))
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find build/source/RetreatUI build/source/RetreatUI_Classes \
            -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Package and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd build/source
          zip -qr ../RetreatUI_v1.0.11-beta.18.zip RetreatUI RetreatUI_Classes
          cd ..
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path('build/RetreatUI_v1.0.11-beta.18.zip')
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              roots = sorted({name.split('/', 1)[0] for name in names if name})
              assert roots == ['RetreatUI', 'RetreatUI_Classes'], roots
              turbo = z.read('RetreatUI/Integrations/TurboPlates.lua').decode('utf-8')
              assert 'ReportTargetManaDiagnostic' not in turbo
              assert 'TurboPlates mana:' not in turbo
              assert 'synthetic_100_pool' in turbo
              assert '## Version: 1.0.11-beta.18' in z.read('RetreatUI/RetreatUI.toc').decode('utf-8')
              assert '## Version: 1.0.11-beta.18' in z.read('RetreatUI_Classes/RetreatUI_Classes.toc').decode('utf-8')
          print('PASS: ZIP structure and silent TurboPlates build')
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.18
          path: build/RetreatUI_v1.0.11-beta.18.zip
          if-no-files-found: error

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.0.11-beta.18'
          ASSET='build/RetreatUI_v1.0.11-beta.18.zip'
          NOTES=$(cat <<'EOF'
          - Removed the TurboPlates mana diagnostic chat line for testers.
          - Preserved beta.17 mana detection and nameplate coloring unchanged.
          - Retained Bloodmage Offering-family and Buff Manager fixes.
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title 'RetreatUI v1.0.11-beta.18' --notes "$NOTES" --prerelease
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --title 'RetreatUI v1.0.11-beta.18' --notes "$NOTES" --prerelease
          fi
