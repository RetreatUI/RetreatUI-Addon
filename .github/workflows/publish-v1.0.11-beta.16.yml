name: Publish RetreatUI v1.0.11-beta.16

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-v1.0.11-beta.16/trigger-pr"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-v1.0.11-beta.16
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download beta.15 package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/base build/source
          gh release download v1.0.11-beta.15 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.15.zip' \
            --dir build/base
          unzip -q build/base/RetreatUI_v1.0.11-beta.15.zip -d build/source
          test -f build/source/RetreatUI/Core/BuffManager.lua
          test -f build/source/RetreatUI/Integrations/TurboPlates.lua

      - name: Apply beta.16 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release-v1.0.11-beta.16/beta16.patch.gz.b64 > beta16.patch.gz
          echo 'f97bab0fba41c72b370e525311cdba13f42c7518e8d73c47f7b7314f293ad473  beta16.patch.gz' | sha256sum -c -
          gzip -dc beta16.patch.gz > beta16.patch
          git apply --check --directory=build/source beta16.patch
          git apply --directory=build/source beta16.patch

      - name: Validate beta.16 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('build/source')
          expected = '1.0.11-beta.16'
          buff = (root / 'RetreatUI/Core/BuffManager.lua').read_text(encoding='utf-8')
          turbo = (root / 'RetreatUI/Integrations/TurboPlates.lua').read_text(encoding='utf-8')
          core_toc = (root / 'RetreatUI/RetreatUI.toc').read_text(encoding='utf-8')
          classes_toc = (root / 'RetreatUI_Classes/RetreatUI_Classes.toc').read_text(encoding='utf-8')
          refresh = turbo[turbo.index('local function RefreshAllManaPlates'):turbo.index('function RUI:InitializeTurboManaColoring')]
          known = turbo[turbo.index('local function UnitKnownMana'):turbo.index('local function RefreshManaCache')]
          checks = {
              'core version': f'## Version: {expected}' in core_toc,
              'classes version': f'## Version: {expected}' in classes_toc,
              'single offering family': buff.count('{key="offering", label="Offering"') == 1,
              'no standalone slaughterhouse family': '{key="slaughterhouse_offering"' not in buff,
              'three offering choices': all(x in buff for x in ('BuffPair("slaughterhouse"', 'BuffPair("sanguinary"', 'BuffPair("bloodsoaked"')),
              'assignment migration': 'slaughterhouseOfferingFamilyMigration' in buff and 'bloodmage.slaughterhouse_offering = nil' in buff,
              'strict live mana evidence': 'displayed power type must be mana' in turbo and 'return maximum > 0' in turbo,
              'no cached mana fallback': 'manaGuidCache[guid]' not in known and 'manaNameCache[name]' not in known,
              'no heuristic painting': 'VisitFrame(' not in refresh and 'CollectScanRoots(' not in refresh,
              'stale overlay cleanup': 'if not seenObjects[value] then RestoreColor(value) end' in refresh,
          }
          for name, passed in checks.items():
              print(('PASS' if passed else 'FAIL') + ': ' + name)
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise RuntimeError('Validation failed: ' + ', '.join(failed))
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find build/source/RetreatUI build/source/RetreatUI_Classes \
            -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Test unified Bloodmage Offering family
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('build/source/RetreatUI/Core/BuffManager.lua').read_text(encoding='utf-8')
          marker = 'local function SpellTexture(spell)'
          export = '''_G.__RUI_BM16_TEST = {
            BUFF_CATALOG=BUFF_CATALOG,
            AuraStatus=AuraStatus,
            AssignedChoiceKeyForMember=AssignedChoiceKeyForMember,
          }

          '''
          if marker not in source:
              raise RuntimeError('Buff Manager export marker missing')
          Path('/tmp/BuffManager16_test.lua').write_text(source.replace(marker, export + marker, 1), encoding='utf-8')
          PY

          cat > /tmp/test_buff_manager16.lua <<'LUA'
          local db = {buffManager={assignments={}, seenSpecs={}}}
          RetreatUI = {
            EnsureDB=function() return db end,
            GetTheme=function() return {muted={1,1,1},accent={1,1,1},dim={.2,.2,.2}} end,
          }
          SlashCmdList = {}
          function CreateFrame()
            local frame = {scripts={}}
            function frame:RegisterEvent() end
            function frame:SetScript(name, fn) self.scripts[name]=fn end
            return setmetatable(frame, {__index=function() return function() end end})
          end
          function GetTime() return 100 end
          local auras = {}
          function UnitExists(unit) return auras[unit] ~= false end
          function UnitBuff(unit, index)
            local aura = auras[unit] and auras[unit][index]
            if not aura then return nil end
            return aura.name, nil, nil, nil, nil, aura.duration, aura.expiration, nil, nil, nil, aura.id
          end
          function UnitIsConnected() return true end
          function UnitIsDeadOrGhost() return false end
          function GetSpellInfo(value) return tostring(value), nil, 'icon' end
          function GetSpellLink() return nil end
          function UnitName(unit) return unit end
          function UnitClass() return 'Bloodmage', 'BLOODMAGE' end
          function UnitPowerType() return 0, 'MANA' end
          function UnitIsGroupLeader() return false end
          function UnitIsGroupAssistant() return false end
          function InCombatLockdown() return false end
          UIParent = {}

          assert(loadfile('/tmp/BuffManager16_test.lua'))()
          local T = assert(__RUI_BM16_TEST)
          local families = assert(T.BUFF_CATALOG.Bloodmage)
          assert(#families == 2, 'Bloodmage must expose only Bloodthorns and Offering')
          assert(families[1].key == 'bloodthorns' and families[2].key == 'offering', 'unexpected Bloodmage columns')
          assert(#families[2].choices == 3, 'Offering must contain three choices')
          assert(families[2].choices[1].key == 'slaughterhouse', 'Slaughterhouse must be inside Offering')

          local runtime = {definition=families[2], choices={}}
          for _, choice in ipairs(families[2].choices) do
            runtime.choices[#runtime.choices+1] = {choice=choice, spell={id=choice.normalID, name=choice.normalName}}
          end
          local bucket = {key='bloodmage|other', isTank=false, resource='MANA'}
          local member = {unit='p1'}
          local function aura(name,id) return {name=name,id=id,duration=3600,expiration=3700} end

          auras.p1 = {aura('Slaughterhouse Offering',1108493)}
          for _, entry in ipairs(runtime.choices) do
            local present = T.AuraStatus('p1', entry, runtime)
            assert(present == true, 'any active Offering must cover every Offering row')
          end

          auras.p1 = {aura('Foul Mandate',573298), aura("Chromie's Wisdom",802829)}
          local selected = T.AssignedChoiceKeyForMember('Bloodmage', runtime, bucket, member)
          assert(selected == 'slaughterhouse', 'Auto must select Slaughterhouse when stamina and spirit are already covered')
          print('PASS: unified Bloodmage Offering family')
          LUA
          lua5.1 /tmp/test_buff_manager16.lua

      - name: Test strict TurboPlates mana filter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('build/source/RetreatUI/Integrations/TurboPlates.lua').read_text(encoding='utf-8')
          marker = 'local UNIT_CANDIDATES'
          export = '''_G.__RUI_TP16_TEST = { UnitUsesMana=UnitUsesMana }

          '''
          if marker not in source:
              raise RuntimeError('TurboPlates export marker missing')
          Path('/tmp/TurboPlates16_test.lua').write_text(source.replace(marker, export + marker, 1), encoding='utf-8')
          PY

          cat > /tmp/test_turboplates16.lua <<'LUA'
          RetreatUI = {}
          UIParent = {}
          WorldFrame = {}
          local units = {
            mana={exists=true, friendly=false, powerType=0, token='MANA', max=100},
            energy={exists=true, friendly=false, powerType=3, token='ENERGY', max=100},
            empty={exists=true, friendly=false, powerType=0, token='MANA', max=0},
          }
          function UnitExists(unit) return units[unit] and units[unit].exists or false end
          function UnitIsFriend(_,unit) return units[unit].friendly end
          function UnitPowerType(unit) return units[unit].powerType, units[unit].token end
          function UnitPowerMax(unit) return units[unit].max end
          function UnitManaMax(unit) return units[unit].max end
          function CreateFrame() return {RegisterEvent=function() end,SetScript=function() end} end
          assert(loadfile('/tmp/TurboPlates16_test.lua'))()
          local T = assert(__RUI_TP16_TEST)
          assert(T.UnitUsesMana('mana') == true, 'real mana unit must be blue')
          assert(T.UnitUsesMana('energy') == false, 'energy unit must not be blue')
          assert(T.UnitUsesMana('empty') == false, 'MANA token without a pool must not be blue')
          print('PASS: strict live-unit mana filter')
          LUA
          lua5.1 /tmp/test_turboplates16.lua

      - name: Package and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('build/source')
          output = Path('RetreatUI_v1.0.11-beta.16.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for root_name in ('RetreatUI', 'RetreatUI_Classes'):
                  for path in sorted((root / root_name).rglob('*')):
                      if path.is_file():
                          archive.write(path, path.relative_to(root).as_posix())
          with zipfile.ZipFile(output) as archive:
              names = set(archive.namelist())
              roots = {name.split('/', 1)[0] for name in names if '/' in name}
              if roots != {'RetreatUI', 'RetreatUI_Classes'}:
                  raise RuntimeError(f'Unexpected ZIP roots: {sorted(roots)}')
              required = {
                  'RetreatUI/RetreatUI.toc',
                  'RetreatUI/Core/BuffManager.lua',
                  'RetreatUI/Integrations/TurboPlates.lua',
                  'RetreatUI_Classes/RetreatUI_Classes.toc',
              }
              missing = required - names
              if missing:
                  raise RuntimeError(f'Missing ZIP entries: {sorted(missing)}')
          PY
          sha256sum RetreatUI_v1.0.11-beta.16.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.16
          path: RetreatUI_v1.0.11-beta.16.zip

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # RetreatUI v1.0.11-beta.16 — Offering Family & TurboPlates Filter Fix

          ## Bloodmage Buff Manager
          - Slaughterhouse Offering is now a choice inside the single Offering family
          - Bloodmage assignment columns are now only Bloodthorns and Offering
          - Slaughterhouse, Sanguinary and Bloodsoaked Offerings are mutually exclusive
          - beta.15 standalone Slaughterhouse assignments migrate automatically

          ## TurboPlates
          - Mana-blue coloring now requires a live unit with mana power type and a real mana pool
          - Removed broad frame heuristics that could make every nameplate blue
          - Stale beta.15 blue overlays are restored automatically on non-mana units
          EOF

          tag='v1.0.11-beta.16'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.16 — Offering Family & TurboPlates Filter Fix' \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$tag" RetreatUI_v1.0.11-beta.16.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" RetreatUI_v1.0.11-beta.16.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.16 — Offering Family & TurboPlates Filter Fix' \
              --notes-file release-notes.md \
              --prerelease
          fi
