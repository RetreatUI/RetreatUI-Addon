name: Emergency RetreatUI beta.22 recovery

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/emergency-recovery-beta22.yml'

permissions:
  contents: write

concurrency:
  group: retreatui-emergency-recovery-beta22
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout confirmed stable baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build minimal recovery source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION = '1.1.2-beta.22'

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, content):
              Path(path).write_text(content, encoding='utf-8', newline='\n')

          def replace_once(content, old, new, label):
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              return content.replace(old, new, 1)

          core_toc_path = 'RetreatUI/RetreatUI.toc'
          core_toc = read(core_toc_path)
          core_toc = replace_once(core_toc, '## Version: 1.1.2-beta.13', f'## Version: {VERSION}', 'core TOC version')
          core_toc = replace_once(core_toc, 'Core\\PartyUtility.lua\n', '', 'legacy party utility load')
          core_toc = replace_once(core_toc, 'Core\\PartyUtilityV4.lua\n', '', 'party utility v4 load')
          write(core_toc_path, core_toc)

          classes_toc_path = 'RetreatUI_Classes/RetreatUI_Classes.toc'
          classes_toc = read(classes_toc_path)
          classes_toc = replace_once(classes_toc, '## Version: 1.1.2-beta.13', f'## Version: {VERSION}', 'classes TOC version')
          write(classes_toc_path, classes_toc)

          loader_path = 'RetreatUI/Loader.lua'
          loader = read(loader_path)
          loader = replace_once(loader, 'or "1.1.0-beta.14"', f'or "{VERSION}"', 'loader fallback version')
          loader = replace_once(loader, '    {"Party Utility", "RefreshPartyUtility"},\n', '', 'repair utility action')
          utility_block = '''\n  if command == "utility" or command == "partyutility" then
    if not RequireSupportedClass() then return end
    if type(RUI.OpenPartyUtilitySettings) == "function" then
      local ok, opened = pcall(RUI.OpenPartyUtilitySettings, RUI)
      if not ok or opened == false then Chat("The Party Utility settings could not open.") end
    else
      Chat("Party Utility did not finish loading. Reload the UI and try again.")
    end
    return
  end

  if command == "utility test" or command == "partyutility test" then
    if type(RUI.TogglePartyUtilityPreview) == "function" then
      local ok, shown = pcall(RUI.TogglePartyUtilityPreview, RUI)
      if ok then Chat("Party Utility preview: " .. tostring(shown and "shown" or "hidden"))
      else Chat("Party Utility preview could not be changed.") end
    end
    return
  end

'''
          loader = replace_once(loader, utility_block, '\n', 'utility slash commands')
          loader = replace_once(
              loader,
              'Chat("Commands: /rui | /rui hud | /rui build | /rui utility | /rui buffs | /rui keybinds | /rui automation | /rui status | /rui changelog | /rui repair | /rui reset")',
              'Chat("Commands: /rui | /rui hud | /rui build | /rui buffs | /rui keybinds | /rui automation | /rui status | /rui changelog | /rui repair | /rui reset")',
              'command help'
          )
          write(loader_path, loader)

          modules_path = 'RetreatUI/Core/ModularModules.lua'
          modules = read(modules_path)
          modules = replace_once(modules, '  "partyTrackers",\n', '', 'party tracker installer order')
          modules, count = re.subn(
              r'\nRegister\("partyTrackers",\{.*?\n\}\)\n\n(?=Register\("trinketHUD")',
              '\n',
              modules,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError(f'party tracker installer definition: expected 1 match, found {count}')
          write(modules_path, modules)

          events_path = 'RetreatUI/Core/Events.lua'
          events = read(events_path)
          events = replace_once(
              events,
              '''  if ModuleEnabled("partyTrackers") and type(RUI.InitializePartyUtilityTracker) == "function" then
    RUI:After(0.72, function() RUI:InitializePartyUtilityTracker() end)
  end
''',
              '',
              'party tracker runtime initialization'
          )
          write(events_path, events)

          init_path = 'RetreatUI/Core/Init.lua'
          init = read(init_path)
          init = replace_once(init, '  if db.features.partyUtility == nil then db.features.partyUtility = true end\n', '  db.features.partyUtility = false\n', 'party utility feature default')
          init = replace_once(init, '  if db.features.partyInterrupts == nil then db.features.partyInterrupts = true end\n', '  db.features.partyInterrupts = false\n', 'party interrupt feature default')
          init = replace_once(init, '  if db.partyUtility.enabled == nil then db.partyUtility.enabled = true end\n', '  db.partyUtility.enabled = false\n', 'party utility saved state')
          init = replace_once(init, '  if db.partyInterrupts.enabled == nil then db.partyInterrupts.enabled = true end\n', '  db.partyInterrupts.enabled = false\n', 'party interrupt saved state')
          write(init_path, init)

          changelog = '''local RUI = RetreatUI
if not RUI then return end

RUI.changelog = {
  version = RUI.version,
  title = "RetreatUI v1.1.2-beta.22",
  summary = "Emergency full-code recovery to the last user-confirmed stable baseline.",
  changes = {
    "Reset the complete active addon source to the beta.13 codebase that was confirmed stable in live Ascension testing.",
    "Removed Party Utility and interrupt tracking from the TOC, modular installer, runtime initialization, repair actions and slash commands.",
    "Disabled all saved party utility and interrupt feature flags on login.",
    "Removed the PartyUtility and PartyUtilityV4 source files from the recovery package.",
    "Rolled back all beta.14 through beta.21 runtime changes; those builds remain preserved in Git tags for later isolated review.",
  },
}
'''
          write('RetreatUI/Core/ReleaseChangelog112.lua', changelog)

          for path in (
              'RetreatUI/Core/PartyUtility.lua',
              'RetreatUI/Core/PartyUtilityV4.lua',
          ):
              Path(path).unlink(missing_ok=True)

          checks = {
              'core version': f'## Version: {VERSION}' in read(core_toc_path),
              'classes version': f'## Version: {VERSION}' in read(classes_toc_path),
              'no utility TOC': 'PartyUtility' not in read(core_toc_path),
              'no tracker installer': 'partyTrackers' not in read(modules_path),
              'no tracker runtime': 'InitializePartyUtilityTracker' not in read(events_path),
              'no utility commands': 'partyutility' not in read(loader_path).lower(),
              'utility feature disabled': 'db.features.partyUtility = false' in read(init_path),
              'interrupt feature disabled': 'db.features.partyInterrupts = false' in read(init_path),
              'utility file removed': not Path('RetreatUI/Core/PartyUtility.lua').exists(),
              'v4 file removed': not Path('RetreatUI/Core/PartyUtilityV4.lua').exists(),
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise RuntimeError('Recovery validation failed: ' + ', '.join(failed))
          PY

      - name: Validate Lua 5.1 syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find RetreatUI RetreatUI_Classes -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Commit recovery source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A RetreatUI RetreatUI_Classes
          git rm '.github/workflows/emergency-recovery-beta22.yml'
          git commit -m 'Emergency recovery to confirmed stable beta.13 baseline'
          git push origin HEAD:main

      - name: Package recovery build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          zip -qr build/RetreatUI_v1.1.2-beta.22.zip RetreatUI RetreatUI_Classes
          python - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path('build/RetreatUI_v1.1.2-beta.22.zip')
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              core = z.read('RetreatUI/RetreatUI.toc').decode('utf-8')
              classes = z.read('RetreatUI_Classes/RetreatUI_Classes.toc').decode('utf-8')
              assert '## Version: 1.1.2-beta.22' in core
              assert '## Version: 1.1.2-beta.22' in classes
              assert 'PartyUtility' not in core
              assert 'RetreatUI/Core/PartyUtility.lua' not in names
              assert 'RetreatUI/Core/PartyUtilityV4.lua' not in names
          print('PASS: beta.22 recovery ZIP')
          PY

      - name: Publish beta.22 recovery pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.2-beta.22'
          ASSET='build/RetreatUI_v1.1.2-beta.22.zip'
          NOTES=$(cat <<'EOF'
          Emergency recovery release.

          - Complete source reset to the user-confirmed stable beta.13 baseline.
          - Party Utility and interrupt tracking are fully removed from loading, installer, runtime and source package.
          - All beta.14-beta.21 runtime changes are rolled back for isolation and review.
          - Existing profiles and SavedVariables are preserved, while retired party tracker flags are forced off.
          EOF
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target HEAD \
            --title 'RetreatUI v1.1.2-beta.22 — Emergency Recovery' \
            --notes "$NOTES" \
            --prerelease
