name: Validate RetreatUI Addon

on:
  pull_request:
    paths:
      - 'RetreatUI/**'
      - 'RetreatUI_Classes/**'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/validate-addon.yml'
  push:
    branches:
      - main
    paths:
      - 'RetreatUI/**'
      - 'RetreatUI_Classes/**'
      - '.github/workflows/validate-addon.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Lua 5.1 and package validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 zip

      - name: Validate Lua 5.1 syntax
        shell: bash
        run: |
          set -euo pipefail
          find RetreatUI RetreatUI_Classes -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Validate versions and TOC references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def toc_version(path: Path) -> str:
              for line in path.read_text(encoding='utf-8').splitlines():
                  if line.startswith('## Version:'):
                      return line.split(':', 1)[1].strip()
              raise AssertionError(f'Missing version in {path}')

          def validate_toc(path: Path) -> None:
              root = path.parent
              for raw in path.read_text(encoding='utf-8').splitlines():
                  line = raw.strip()
                  if not line or line.startswith('##') or line.startswith('#'):
                      continue
                  target = root / line.replace('\\', '/')
                  assert target.is_file(), f'Missing TOC file: {target}'

          core = Path('RetreatUI/RetreatUI.toc')
          classes = Path('RetreatUI_Classes/RetreatUI_Classes.toc')
          core_version = toc_version(core)
          class_version = toc_version(classes)
          assert core_version == class_version, (core_version, class_version)
          validate_toc(core)
          validate_toc(classes)

          core_text = core.read_text(encoding='utf-8')
          class_text = classes.read_text(encoding='utf-8')
          assert 'Core\\SpellbookScanThrottle.lua' in core_text
          assert 'Core\\PerformanceRefreshCoordinator.lua' in core_text
          assert 'Integrations\\CharacterAdvancementCrashGuard.lua' in core_text
          assert 'Core\\PartyUtility.lua' not in core_text
          assert 'Core\\PartyUtilityV4.lua' not in core_text
          assert 'Core\\RetreatCD.lua' not in core_text
          assert 'PerformanceHotfixBeta17.lua' in class_text
          print(f'Validated RetreatUI {core_version}')
          PY

      - name: Validate secure-frame and class-driver safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cleanup = Path('RetreatUI/Integrations/Cleanup.lua').read_text(encoding='utf-8')
          class_cleanup = Path('RetreatUI/Integrations/ClassResourceCleanup.lua').read_text(encoding='utf-8')
          performance = Path('RetreatUI_Classes/PerformanceHotfixBeta17.lua').read_text(encoding='utf-8')

          # Blizzard unit frames must never return to the generic cleanup allow-list.
          for forbidden in ('"playerFrame"', '"PlayerFrame"', '"TargetFrame"',
                            '"PartyMemberFrame1"', '"PartyMemberFrame2"',
                            '"PartyMemberFrame3"', '"PartyMemberFrame4"'):
              assert forbidden not in cleanup, f'Protected Blizzard frame returned to Cleanup.lua: {forbidden}'

          # Both cleanup paths must reject protected frames before visual/mouse mutations.
          assert 'if IsProtectedFrame(frame) then return false end' in cleanup
          assert 'if Protected(frame) then return false end' in class_cleanup
          assert 'secureFrameSafety = true' in cleanup
          assert 'secureFrameSafety = true' in class_cleanup

          # Idle class helpers are gated, including Guardian's high-frequency combat log.
          assert 'RetreatUIGuardianBannerTrackerDriver' in performance
          assert 'COMBAT_LOG_EVENT_UNFILTERED' in performance
          assert 'UnregisterAllEvents' in performance
          assert 'RetreatUICultistWagoMechanicsDriver' in performance
          assert 'RetreatUITinkerHealerPetDriver' in performance
          assert 'RetreatUIGuardianReminderDriver' in performance
          print('Validated beta.17 secure-frame and class-driver safety')
          PY

      - name: Validate package roots
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/retreatui-package
          mkdir -p /tmp/retreatui-package
          zip -qr /tmp/retreatui-package/RetreatUI.zip RetreatUI RetreatUI_Classes
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/retreatui-package/RetreatUI.zip') as archive:
              roots = sorted({name.split('/', 1)[0] for name in archive.namelist() if name})
              assert roots == ['RetreatUI', 'RetreatUI_Classes'], roots
          print('Validated package roots')
          PY
