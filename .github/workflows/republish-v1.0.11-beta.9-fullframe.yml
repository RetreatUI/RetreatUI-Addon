name: Republish RetreatUI v1.0.11-beta.9 Full Frame

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-v1.0.11-beta.9-fullframe/trigger-pr"

permissions:
  contents: write

concurrency:
  group: republish-retreatui-v1.0.11-beta.9-fullframe
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current beta.9 package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/base build/source
          gh release download v1.0.11-beta.9 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.9.zip' \
            --dir build/base
          unzip -q build/base/RetreatUI_v1.0.11-beta.9.zip -d build/source
          test -f build/source/RetreatUI/RetreatUI.toc
          test -f build/source/RetreatUI/Core/TotemBarMover.lua
          test -f build/source/RetreatUI/Integrations/TurboPlates.lua
          test -f build/source/RetreatUI_Classes/RetreatUI_Classes.toc

      - name: Apply full-frame mana nameplate patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release-v1.0.11-beta.9-fullframe/fullframe.patch.gz.b64 | gzip -dc > fullframe.patch
          git apply --check --directory=build/source fullframe.patch
          git apply --directory=build/source fullframe.patch

      - name: Validate beta.9 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('build/source')
          expected = '1.0.11-beta.9'
          core_toc = (root / 'RetreatUI/RetreatUI.toc').read_text(encoding='utf-8')
          classes_toc = (root / 'RetreatUI_Classes/RetreatUI_Classes.toc').read_text(encoding='utf-8')
          totem = (root / 'RetreatUI/Core/TotemBarMover.lua').read_text(encoding='utf-8')
          turbo = (root / 'RetreatUI/Integrations/TurboPlates.lua').read_text(encoding='utf-8')

          checks = {
              'core version': f'## Version: {expected}' in core_toc,
              'classes version': f'## Version: {expected}' in classes_toc,
              'visible Totem Bar linked to mover': 'LinkBarToMover' in totem and 'bar.SetPoint, bar, "CENTER", mover, "CENTER", 0, 0' in totem,
              'Totem Bar relink loop': 'relinkElapsed' in totem and 'ResolveTotemBar' in totem,
              'mana discovery retained': 'RefreshAllManaPlates' in turbo and 'CollectFramesFromTable' in turbo,
              'full-frame blue palette': 'MANA_BLUE_DARK' in turbo and 'MANA_BLUE_BORDER' in turbo,
              'whole nameplate visual scan': 'CollectPlateVisuals' in turbo and 'AddPlateVisual' in turbo,
              'power and cast exclusions': 'IsCastOrPowerObject' in turbo,
              'full-frame integration flag': 'manaNPCFullFrameBlue = true' in turbo,
              'legacy health-only flag removed': 'manaNPCBlue = true' not in turbo,
          }
          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(('PASS' if passed else 'FAIL') + ': ' + name)
          if failed:
              raise RuntimeError('Validation failed: ' + ', '.join(failed))
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find build/source/RetreatUI build/source/RetreatUI_Classes \
            -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Package and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('build/source')
          output = Path('RetreatUI_v1.0.11-beta.9.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for root_name in ('RetreatUI', 'RetreatUI_Classes'):
                  for path in sorted((root / root_name).rglob('*')):
                      if path.is_file():
                          archive.write(path, path.relative_to(root).as_posix())

          with zipfile.ZipFile(output) as archive:
              names = set(archive.namelist())
              roots = {name.split('/', 1)[0] for name in names if '/' in name}
              if roots != {'RetreatUI', 'RetreatUI_Classes'}:
                  raise RuntimeError(f'Unexpected ZIP roots: {sorted(roots)}')
              required = {
                  'RetreatUI/RetreatUI.toc',
                  'RetreatUI/Core/TotemBarMover.lua',
                  'RetreatUI/Integrations/TurboPlates.lua',
                  'RetreatUI_Classes/RetreatUI_Classes.toc',
              }
              missing = required - names
              if missing:
                  raise RuntimeError(f'Missing ZIP entries: {sorted(missing)}')
          PY
          sha256sum RetreatUI_v1.0.11-beta.9.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.9-fullframe
          path: RetreatUI_v1.0.11-beta.9.zip

      - name: Replace GitHub beta.9 pre-release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # RetreatUI v1.0.11-beta.9 — Totem Bar & Full-Frame Mana Nameplates

          ## Test focus

          - The visible Totem Bar is attached to the actual movable frame
          - Moving the Totem Bar moves the real icons, not a detached handle
          - The Totem Bar is re-linked when Ascension or ElvUI rebuilds it
          - Enemy nameplates are detected as mana users through Ascension's legacy nameplate system
          - The entire mana-enemy nameplate surface becomes blue: health fill, background and border
          - Cast bars, text and icons keep their normal appearance for readability
          - All beta.8 Witch Doctor, Buff Manager and class-text changes remain included
          EOF

          gh release edit v1.0.11-beta.9 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title 'RetreatUI v1.0.11-beta.9 — Totem Bar & Full-Frame Mana Nameplates' \
            --notes-file release-notes.md \
            --prerelease
          gh release upload v1.0.11-beta.9 RetreatUI_v1.0.11-beta.9.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
