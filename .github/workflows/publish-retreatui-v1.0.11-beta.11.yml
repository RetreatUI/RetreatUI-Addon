name: Publish RetreatUI v1.0.11-beta.11

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-v1.0.11-beta.11/trigger"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-v1.0.11-beta.11
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download beta.10 package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/source build/base
          gh release download v1.0.11-beta.10 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.10.zip' \
            --dir build/base
          unzip -q build/base/RetreatUI_v1.0.11-beta.10.zip -d build/source
          test -f build/source/RetreatUI/RetreatUI.toc
          test -f build/source/RetreatUI_Classes/RetreatUI_Classes.toc

      - name: Apply beta.11 Wago curation patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release-v1.0.11-beta.11/beta11.patch.gz.b64 > beta11.patch.gz
          echo '5b2a404204d43f05d55c5eaa1982703eb7c2a261f18cb1d92e06c9c3de848397  beta11.patch.gz' | sha256sum -c -
          gzip -dc beta11.patch.gz > beta11.patch
          git apply --check --directory=build/source beta11.patch
          git apply --directory=build/source beta11.patch

      - name: Validate beta.11 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('build/source')
          expected = '1.0.11-beta.11'
          core_toc = (root / 'RetreatUI/RetreatUI.toc').read_text(encoding='utf-8')
          classes_toc = (root / 'RetreatUI_Classes/RetreatUI_Classes.toc').read_text(encoding='utf-8')
          curated = (root / 'RetreatUI_Classes/WagoCurated.lua').read_text(encoding='utf-8')

          checks = {
              'core version': f'## Version: {expected}' in core_toc,
              'classes version': f'## Version: {expected}' in classes_toc,
              'curated file loaded': 'WagoCurated.lua' in classes_toc,
              'all supplied Wago packs': all(pack in curated for pack in (
                  'zBApoum1h', 'wQdFYTpm6', 'Y5UDib4zq', 'TqH72U66p', 'hZsQ_ZVIL')),
              'native three-bucket curation': all(token in curated for token in (
                  'AddBucket("main"', 'AddBucket("utility"', 'AddBucket("proc"')),
              'target debuff curation': 'AddBucket("debuff"' in curated,
              'live cooldown safety net disabled': 'database.disableLiveClassCooldowns = true' in curated,
              'correct Felsworn Chaos Rush': 'name="Chaos Rush", id=500028' in curated,
              'correct Primalist Quake': 'name="Quake", id=505157' in curated,
              'correct Primalist Rylak': 'name="Rylak\'s Bite", id=706491' in curated,
              'old incorrect IDs removed': all(value not in curated for value in (
                  'id=280350', 'id=803974', 'id=706342', 'id=800178')),
          }
          for name, passed in checks.items():
              print(('PASS' if passed else 'FAIL') + ': ' + name)
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise RuntimeError('Validation failed: ' + ', '.join(failed))
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find build/source/RetreatUI build/source/RetreatUI_Classes \
            -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

          cat > validate-curation.lua <<'LUA'
          RetreatUI = {spellDatabase={}}
          function RetreatUI:RegisterClassSpellDatabase(name, database)
            self.spellDatabase[name] = database
          end
          function RetreatUI:GetClassSpellDatabase(name)
            return self.spellDatabase[name]
          end

          local root = 'build/source/RetreatUI_Classes/'
          local classes = {'Felsworn', 'Starcaller', 'Venomancer', 'Reaper', 'Primalist'}
          for _, className in ipairs(classes) do
            dofile(root .. className .. '/Data.lua')
          end
          dofile(root .. 'WagoCurated.lua')

          local expectedPacks = {
            Felsworn='TqH72U66p', Starcaller='Y5UDib4zq', Venomancer='zBApoum1h',
            Reaper='wQdFYTpm6', Primalist='hZsQ_ZVIL',
          }
          for _, className in ipairs(classes) do
            local database = RetreatUI.spellDatabase[className]
            assert(database and database.wagoPackID == expectedPacks[className], className .. ': pack missing')
            assert(database.disableLiveClassCooldowns == true, className .. ': live cooldowns enabled')
            local main, utility, proc = 0, 0, 0
            for _, record in ipairs(database.spells or {}) do
              if record.hudRow == 'core' then main = main + 1 end
              if record.hudRow == 'utility' then utility = utility + 1 end
              if record.auraTracker == true then proc = proc + 1 end
            end
            assert(main > 0, className .. ': no main rotation')
            assert(utility > 0, className .. ': no utility')
            assert(proc > 0, className .. ': no procs')
            print(className, #database.spells, main, utility, proc)
          end
          LUA
          lua5.1 validate-curation.lua

      - name: Package and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          root = Path('build/source')
          output = Path('RetreatUI_v1.0.11-beta.11.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for root_name in ('RetreatUI', 'RetreatUI_Classes'):
                  for path in sorted((root / root_name).rglob('*')):
                      if path.is_file():
                          archive.write(path, path.relative_to(root).as_posix())

          with zipfile.ZipFile(output) as archive:
              names = set(archive.namelist())
              roots = {name.split('/', 1)[0] for name in names if '/' in name}
              if roots != {'RetreatUI', 'RetreatUI_Classes'}:
                  raise RuntimeError(f'Unexpected ZIP roots: {sorted(roots)}')
              required = {
                  'RetreatUI/RetreatUI.toc',
                  'RetreatUI_Classes/RetreatUI_Classes.toc',
                  'RetreatUI_Classes/WagoCurated.lua',
              }
              missing = required - names
              if missing:
                  raise RuntimeError(f'Missing ZIP entries: {sorted(missing)}')
          print('sha256:', hashlib.sha256(output.read_bytes()).hexdigest())
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.11
          path: RetreatUI_v1.0.11-beta.11.zip

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # RetreatUI v1.0.11-beta.11 — Wago-Curated Class Tracking

          ## Test focus

          - Native RetreatUI tracking added from the supplied Venomancer, Reaper, Starcaller, Felsworn and Primalist WeakAura packs
          - Class spells sorted into Main Rotation, Utility and active-only Procs/Buffs
          - Target debuffs remain above the target frame
          - Corrected Wago-sourced spell IDs, including Felsworn Chaos Rush and multiple Primalist abilities
          - No WeakAuras dependency or imported WA groups
          - Retains every beta.10 Totem Bar and mana-nameplate fix
          EOF

          tag='v1.0.11-beta.11'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.11 — Wago-Curated Class Tracking' \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$tag" RetreatUI_v1.0.11-beta.11.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" RetreatUI_v1.0.11-beta.11.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.11 — Wago-Curated Class Tracking' \
              --notes-file release-notes.md \
              --prerelease
          fi
