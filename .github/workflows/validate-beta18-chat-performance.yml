name: Validate beta18 Chat and Performance

on:
  pull_request:
    branches: [main]
    paths:
      - "RetreatUI/Integrations/ElvUI.lua"
      - "RetreatUI/Integrations/PyromancerAuraAndDetailsChat.lua"
      - "RetreatUI/Integrations/ChatOwnershipSafety.lua"
      - "RetreatUI/Loader.lua"
      - "RetreatUI/RetreatUI.toc"
      - "RetreatUI_Classes/AdvancedHUD.lua"
      - "RetreatUI_Classes/RetreatUI_Classes.toc"
      - "RetreatUI_BuffManager/RetreatUI_BuffManager.toc"
      - ".github/workflows/validate-beta18-chat-performance.yml"
  push:
    branches: [main]
    paths:
      - "RetreatUI/Integrations/ElvUI.lua"
      - "RetreatUI/Integrations/PyromancerAuraAndDetailsChat.lua"
      - "RetreatUI/Integrations/ChatOwnershipSafety.lua"
      - "RetreatUI/Loader.lua"
      - "RetreatUI/RetreatUI.toc"
      - "RetreatUI_Classes/AdvancedHUD.lua"
      - "RetreatUI_Classes/RetreatUI_Classes.toc"
      - "RetreatUI_BuffManager/RetreatUI_BuffManager.toc"
      - ".github/workflows/validate-beta18-chat-performance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate chat ownership and high-frequency event safety
        shell: bash
        run: |
          set -euo pipefail

          luac5.1 -p RetreatUI/Integrations/ElvUI.lua
          luac5.1 -p RetreatUI/Integrations/PyromancerAuraAndDetailsChat.lua
          luac5.1 -p RetreatUI/Integrations/ChatOwnershipSafety.lua
          luac5.1 -p RetreatUI/Loader.lua
          luac5.1 -p RetreatUI_Classes/AdvancedHUD.lua

          python - <<'PY'
          from pathlib import Path
          import re

          def code_without_line_comments(path):
              lines = []
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  lines.append(re.sub(r'--.*$', '', line))
              return '\n'.join(lines)

          pyro = code_without_line_comments('RetreatUI/Integrations/PyromancerAuraAndDetailsChat.lua')
          chat = code_without_line_comments('RetreatUI/Integrations/ChatOwnershipSafety.lua')
          elv = code_without_line_comments('RetreatUI/Integrations/ElvUI.lua')
          loader = code_without_line_comments('RetreatUI/Loader.lua')
          hud = code_without_line_comments('RetreatUI_Classes/AdvancedHUD.lua')
          toc = Path('RetreatUI/RetreatUI.toc').read_text(encoding='utf-8')

          # Chat frames are never forced visible/hidden by the Pyromancer/Details helper.
          assert 'events:RegisterEvent("PLAYER_TARGET_CHANGED")' not in pyro
          assert 'events:RegisterEvent("PLAYER_ENTERING_WORLD")' not in pyro
          assert 'Update_AllFrames' not in pyro
          assert 'E.UpdateAll' not in pyro
          assert '_G.ChatFrame' not in pyro
          assert 'RestoreRegion' not in pyro

          # The historical generic ElvUI chat mutation implementation is physically gone.
          for forbidden in ('FCF_UnDockFrame', 'FCF_Close', 'IsChatFrameInRightPanel', 'TouchesRightChatPanel'):
              assert forbidden not in elv, forbidden
          assert 'Loot/Trade chat cleanup' not in loader

          # Only Blizzard may recompute existing dock visibility; no membership mutation is allowed.
          assert 'function RUI:RemoveRightLootTradeChat()' in chat
          assert 'FCF_DockUpdate' in chat
          for forbidden in ('FCF_UnDockFrame', 'FCF_Close', 'FCF_DockFrame'):
              assert forbidden not in chat, forbidden

          # Shared AdvancedHUD may not subscribe to the two event storms removed in beta.18.
          assert 'ACTIONBAR_UPDATE_COOLDOWN' not in hud
          assert 'UNIT_POWER_FREQUENT' not in hud
          assert 'UpdateCooldownTimersOnly()' in hud
          assert 'if type(ResourceConfig()) == "table" then' in hud

          assert 'Integrations\\ChatOwnershipSafety.lua' in toc

          def toc_version(path):
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.startswith('## Version:'):
                      return line.split(':', 1)[1].strip()
              raise AssertionError(path)

          versions = {
              toc_version('RetreatUI/RetreatUI.toc'),
              toc_version('RetreatUI_Classes/RetreatUI_Classes.toc'),
              toc_version('RetreatUI_BuffManager/RetreatUI_BuffManager.toc'),
          }
          assert versions == {'1.1.7-beta.18'}, versions
          print('Validated beta.18 chat ownership and shared HUD event safety')
          PY
