name: Publish RetreatUI v1.1.0-beta.6

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'release/v1.1.0-beta.6'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.1.0-beta.6
      ZIP_NAME: RetreatUI_v1.1.0-beta.6.zip
      MANIFEST_NAME: RetreatUI_manifest.json
      DELTA_SHA256: d13f7aa87ba7e9250c480b0efc52d00b621572a75721c71e0f2557cc7cda4338
      TREE_SHA256: cae82581ca00fa73e461ce4f5bdc0dc4b562c60d2034ffd18561ca11ef7bc3da

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 unzip zip

      - name: Download beta.5 base and official release
        run: |
          mkdir -p base work official
          gh release download v1.1.0-beta.5 --repo "$GITHUB_REPOSITORY" --pattern 'RetreatUI_v1.1.0-beta.5.zip' --dir base
          gh release download v1.0.11 --repo "$GITHUB_REPOSITORY" --pattern 'RetreatUI_v1.0.11.zip' --dir official
          test -f base/RetreatUI_v1.1.0-beta.5.zip
          test -f official/RetreatUI_v1.0.11.zip
          unzip -q base/RetreatUI_v1.1.0-beta.5.zip -d work

      - name: Decode and apply beta.6 delta
        run: |
          cat .release-v1.1.0-beta.6/payload.part* | tr -d '\r\n ' | base64 -d > /tmp/beta6-delta.tar.gz
          echo "$DELTA_SHA256  /tmp/beta6-delta.tar.gz" | sha256sum -c -
          mkdir -p /tmp/beta6-delta
          tar -xzf /tmp/beta6-delta.tar.gz -C /tmp/beta6-delta
          test "$(wc -l < /tmp/beta6-delta/changed-files.txt)" -eq 13
          while IFS= read -r path; do
            test -f "/tmp/beta6-delta/$path"
            install -D -m 0644 "/tmp/beta6-delta/$path" "work/$path"
          done < /tmp/beta6-delta/changed-files.txt

      - name: Validate beta.6 content
        run: |
          grep -Fq '## Version: 1.1.0-beta.6' work/RetreatUI/RetreatUI.toc
          grep -Fq '## Version: 1.1.0-beta.6' work/RetreatUI_Classes/RetreatUI_Classes.toc
          grep -Fq 'RUI.version = (GetAddOnMetadata and GetAddOnMetadata("RetreatUI", "Version")) or "1.1.0-beta.6"' work/RetreatUI/Loader.lua
          grep -Fq 'title = "RetreatUI v1.1.0-beta.6"' work/RetreatUI/Core/Version.lua
          grep -Fq 'local MIN_SCALE, MAX_SCALE, SCALE_STEP = 0.60, 1.60, 0.05' work/RetreatUI/Core/HUDEditor.lua
          grep -Fq 'handle:SetScript("OnMouseWheel"' work/RetreatUI/Core/HUDEditor.lua
          grep -Fq 'editor.scaleAllDown = Button(editor, "All -5%"' work/RetreatUI/Core/HUDEditor.lua
          grep -Fq 'editor.scaleAllUp = Button(editor, "All +5%"' work/RetreatUI/Core/HUDEditor.lua
          grep -Fq 'local activeSlot = self.GetActiveAdvancementSlot and self:GetActiveAdvancementSlot() or 1' work/RetreatUI/Core/BuildProfiles.lua
          grep -Fq 'local spellbookSignature = self.spellbook and self.spellbook.signature or ""' work/RetreatUI/Core/BuildProfiles.lua
          grep -Fq 'self:RefreshBuildProfile(reason, delay == 1.80)' work/RetreatUI/Core/BuildProfiles.lua
          ACTUAL_TREE_SHA=$(cd work && find RetreatUI RetreatUI_Classes -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          test "$ACTUAL_TREE_SHA" = "$TREE_SHA256"

      - name: Validate Lua 5.1 syntax
        run: |
          find work/RetreatUI work/RetreatUI_Classes -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Package addon
        run: |
          rm -f "$ZIP_NAME"
          (cd work && zip -qr "../$ZIP_NAME" RetreatUI RetreatUI_Classes)
          unzip -tq "$ZIP_NAME"
          python3 - <<'PY'
          import zipfile
          path = 'RetreatUI_v1.1.0-beta.6.zip'
          with zipfile.ZipFile(path) as archive:
              roots = {
                  name.split('/', 1)[0]
                  for name in archive.namelist()
                  if name and not name.startswith('__MACOSX/')
              }
              assert roots == {'RetreatUI', 'RetreatUI_Classes'}, roots
              assert all('/.git/' not in name and not name.endswith('.pyc') for name in archive.namelist())
          PY

      - name: Create launcher release manifest
        run: |
          BETA_SHA=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          RELEASE_SHA=$(sha256sum official/RetreatUI_v1.0.11.zip | awk '{print $1}')
          cat > "$MANIFEST_NAME" <<JSON
          {
            "schema": 1,
            "generated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "channels": {
              "release": {"version":"1.0.11","tag":"v1.0.11","asset":"RetreatUI_v1.0.11.zip","sha256":"$RELEASE_SHA","prerelease":false},
              "beta": {"version":"1.1.0-beta.6","tag":"v1.1.0-beta.6","asset":"RetreatUI_v1.1.0-beta.6.zip","sha256":"$BETA_SHA","prerelease":true}
            }
          }
          JSON
          python3 -m json.tool "$MANIFEST_NAME" >/dev/null

      - name: Publish GitHub pre-release
        run: |
          cat > /tmp/release-notes.md <<'MD'
          ## RetreatUI v1.1.0-beta.6

          ### HUD Editor scaling
          - Added individual scaling for Main Rotation, Utility, Procs/Buffs, Class Resource, Primary Power and Target Debuffs.
          - HUD sections can be scaled from 60% to 160% with `-5%`, `100%` and `+5%` controls.
          - Added `All -5%` and `All +5%` controls plus mouse-wheel scaling directly on HUD anchors.
          - Positions and scale are saved per detected build while existing beta.5 layouts are preserved during migration.

          ### Automatic build and talent detection
          - Detects the active Character Advancement slot, selected talent/advancement records and learned class spells.
          - Refreshes build fingerprints after build changes while Ascension finishes updating the spellbook.
          - Automatically swaps the relevant HUD profile and avoids carrying stale trackers into a different build.
          - Updated shared and class-specific HUD handling for Bloodmage, Knight of Xoroth and Necromancer.

          ### Installation
          Select the **Beta** channel in RetreatUI Launcher and install/update RetreatUI.
          MD
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" "$MANIFEST_NAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title 'RetreatUI v1.1.0-beta.6' --notes-file /tmp/release-notes.md --prerelease --latest=false
          else
            gh release create "$TAG" "$ZIP_NAME" "$MANIFEST_NAME" --repo "$GITHUB_REPOSITORY" --title 'RetreatUI v1.1.0-beta.6' --notes-file /tmp/release-notes.md --prerelease --latest=false
          fi

      - name: Verify published pre-release
        run: |
          mkdir -p verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ZIP_NAME" --pattern "$MANIFEST_NAME" --dir verify
          test -f "verify/$ZIP_NAME"
          test -f "verify/$MANIFEST_NAME"
          test "$(sha256sum "$ZIP_NAME" | awk '{print $1}')" = "$(sha256sum "verify/$ZIP_NAME" | awk '{print $1}')"
          unzip -tq "verify/$ZIP_NAME"
          python3 - <<'PY'
          import json
          with open('verify/RetreatUI_manifest.json', encoding='utf-8') as handle:
              manifest = json.load(handle)
          beta = manifest['channels']['beta']
          assert beta['version'] == '1.1.0-beta.6'
          assert beta['tag'] == 'v1.1.0-beta.6'
          assert beta['asset'] == 'RetreatUI_v1.1.0-beta.6.zip'
          assert beta['prerelease'] is True
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.1.0-beta.6
          path: |
            RetreatUI_v1.1.0-beta.6.zip
            RetreatUI_manifest.json
          if-no-files-found: error
