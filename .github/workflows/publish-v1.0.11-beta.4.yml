name: Publish RetreatUI v1.0.11-beta.4

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.0.11-beta.4.yml"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-v1.0.11-beta.4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Witch Doctor Voodoo beta source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          old_version = '1.0.11-beta.3'
          new_version = '1.0.11-beta.4'

          def insert_after_line(text, needle, insertion):
              lines = text.splitlines(keepends=True)
              for index, line in enumerate(lines):
                  if needle in line:
                      lines.insert(index + 1, insertion if insertion.endswith('\n') else insertion + '\n')
                      return ''.join(lines)
              raise RuntimeError(f'Anchor missing: {needle}')

          def insert_before_line(text, needle, insertion):
              lines = text.splitlines(keepends=True)
              for index, line in enumerate(lines):
                  if needle in line:
                      lines.insert(index, insertion if insertion.endswith('\n') else insertion + '\n')
                      return ''.join(lines)
              raise RuntimeError(f'Anchor missing: {needle}')

          data_path = root / 'RetreatUI_Classes/WitchDoctor/Data.lua'
          data = data_path.read_text(encoding='utf-8')
          data = data.replace('  version = 3,', '  version = 4,', 1)
          data = data.replace(
              '  source = "RetreatUI Data Collector 1.0.0 — complete class/spec tree, resolved spell catalogue and tooltip relationships",',
              '  source = "RetreatUI Data Collector 1.0.0 plus Witch Doctor Voodoo live-test coverage",',
              1,
          )
          data = insert_after_line(data, '{name="Hexfire", id=807042,', '''    {name="Hex of Malice", category="rotation", hudRow="core", order=21, trackCooldown=true, targetDebuff=true, auraBar=true, talent=true, aliases={"Zalazane's Malice","Zalazane’s Malice","Hex of Malice"}, fallbackIcon="Interface\\\\Icons\\\\Spell_Shadow_CurseOfSargeras", sourceTab="Voodoo"},
              {name="Shadowflare", id=501148, category="rotation", hudRow="core", order=22, trackCooldown=true, targetDebuff=true, auraBar=true, glowWhenAura={"Dambala's Lethality"}, fallbackIcon="Interface\\\\Icons\\\\Spell_Shadow_Shadowfury", sourceTab="Voodoo"},
              {name="Voodoo Strings", category="rotation", hudRow="core", order=23, trackCooldown=true, targetDebuff=true, auraBar=true, talent=true, aliases={"Voodoo String","Voodoo Strings"}, fallbackIcon="Interface\\\\Icons\\\\trade_archaeology_troll_voodoodoll", sourceTab="Voodoo"},''')
          data = insert_after_line(data, '{name="Shadow Puppets", id=500015,', '    {name="Voodoo Idol", category="offensive", hudRow="core", order=140, trackCooldown=true, talent=true, fallbackIcon="Interface\\\\Icons\\\\INV_Misc_Idol_05", sourceTab="Voodoo"},')
          data = insert_before_line(data, '{name="Soul Marionette", id=704497,', '    {name="Drakkari Barrier", id=501124, category="defensive", hudRow="utility", order=210, trackCooldown=true, buff="Drakkari Barrier", auraTracker=true, trackDuration=true, partyCooldown=true, cooldownCategory="defensive", fallbackIcon="Interface\\\\Icons\\\\Spell_Shadow_AntiShadow", sourceTab="Class", cooldownHint=120},')
          data = insert_before_line(data, '{name="Mimic Ward", id=707162,', '''    {name="Healing Ward", id=500957, category="healing", hudRow="utility", order=240, trackCooldown=true, fallbackIcon="Interface\\\\Icons\\\\Spell_Nature_HealingWay", sourceTab="Class"},
              {name="Cleansing Idol", id=804051, category="utility", hudRow="utility", order=250, trackCooldown=true, fallbackIcon="Interface\\\\Icons\\\\INV_Misc_Idol_03", sourceTab="Class"},''')

          lines = data.splitlines(keepends=True)
          for index, line in enumerate(lines):
              if '{name="Puppeteer\'s Threads", id=92084,' in line:
                  newline = '\n' if line.endswith('\n') else ''
                  lines[index] = '    {name="Puppeteer\'s Threads", id=92084, category="debuff", order=10, targetDebuff=true, auraBar=true, trackDuration=true, trackHUD=false, aliases={"Puppeteer’s Threads"}, fallbackIcon="Interface\\\\Icons\\\\trade_archaeology_troll_voodoodoll", sourceTab="Voodoo", collectorEntryID=4004},' + newline
                  break
          else:
              raise RuntimeError('Puppeteer Threads anchor missing')
          data = ''.join(lines)

          data = insert_before_line(data, '{name="Voodoo Spirits", id=704511,', '    {name="Loa Spirits", category="proc", order=215, buff="Loa Spirits", trackDuration=true, auraTracker=true, trackHUD=false, maxStacks=5, talent=true, aliases={"Loa Spirit"}, fallbackIcon="Interface\\\\Icons\\\\achievement_boss_zuldazar_loacouncil", sourceTab="Voodoo"},')
          data = insert_before_line(data, '{name="Dark Loa\'s Incantation", id=525377,', '''    {name="Zalazane's Malice", category="debuff", order=5, targetDebuff=true, auraBar=true, trackHUD=false, aliases={"Zalazane’s Malice","Hex of Malice"}, fallbackIcon="Interface\\\\Icons\\\\Spell_Shadow_CurseOfSargeras", sourceTab="Voodoo"},
              {name="Voodoo Strings", category="debuff", order=15, targetDebuff=true, auraBar=true, trackHUD=false, aliases={"Voodoo String"}, fallbackIcon="Interface\\\\Icons\\\\trade_archaeology_troll_voodoodoll", sourceTab="Voodoo"},''')
          data_path.write_text(data, encoding='utf-8', newline='\n')

          state_path = root / 'RetreatUI_Classes/StateTracker.lua'
          state = state_path.read_text(encoding='utf-8')
          old_state = '  ["Witch Doctor"] = {},'
          new_state = '''  ["Witch Doctor"] = {
              {
                key="LOA",
                prefixes={"Loa: ", "Presence of the Loa: "},
                labelFromName=true,
                members={
                  Member("Loa Spirits", "LOA", nil, {"Loa Spirit"}, "Interface\\\\Icons\\\\achievement_boss_zuldazar_loacouncil"),
                  Member("Voodoo Spirits", "LOA", 704511, nil, "Interface\\\\Icons\\\\achievement_jadeserpent_2"),
                  Member("Presence of the Loa", "LOA", 572871, nil, "Interface\\\\icons\\\\nhi_earthmask_Border"),
                },
              },
            },'''
          if old_state not in state:
              raise RuntimeError('Witch Doctor state anchor missing')
          state_path.write_text(state.replace(old_state, new_state, 1), encoding='utf-8', newline='\n')

          hud_path = root / 'RetreatUI_Classes/WitchDoctor/HUD.lua'
          hud = hud_path.read_text(encoding='utf-8')
          hud_anchor = '  supportedLoadouts = {BREWING=true,SHADOWHUNTING=true,VOODOO=true},\n'
          if hud_anchor not in hud:
              raise RuntimeError('Witch Doctor HUD anchor missing')
          hud = hud.replace(hud_anchor, hud_anchor + '  maxStates = 1,\n  stanceTracker = {x=-195, y=-118, size=38, width=90, height=58, nameSize=8},\n', 1)
          hud_path.write_text(hud, encoding='utf-8', newline='\n')

          version_files = (
              'RetreatUI/RetreatUI.toc',
              'RetreatUI_Classes/RetreatUI_Classes.toc',
              'RetreatUI/Loader.lua',
              'RetreatUI_Classes/Loader.lua',
              'RetreatUI/README.txt',
              'RetreatUI_Classes/README.txt',
          )
          for relative in version_files:
              path = root / relative
              text = path.read_text(encoding='utf-8')
              if old_version not in text:
                  raise RuntimeError(f'Version anchor missing in {relative}')
              path.write_text(text.replace(old_version, new_version), encoding='utf-8', newline='\n')

          version_path = root / 'RetreatUI/Core/Version.lua'
          version_text = version_path.read_text(encoding='utf-8')
          start = version_text.index('RUI.changelog = {')
          end = version_text.index('\n}\nlocal updateFrame', start) + 3
          changelog_block = '''RUI.changelog = {
            version = RUI.version,
            title = "RetreatUI v1.0.11-beta.4",
            summary = "Witch Doctor Voodoo tracking test: Malice, Threads, Loa stacks, key wards and missing Voodoo abilities.",
            changes = {
              "Added high-priority Hex of Malice and Zalazane's Malice target tracking with expiry warnings.",
              "Moved Puppeteer's Threads from the player-proc row to the target-debuff tracker.",
              "Added a dedicated active Loa/Loa Spirits state tracker with live stack display.",
              "Added Drakkari Barrier cooldown and active-duration tracking.",
              "Added learned-only Voodoo Strings, Shadowflare and Voodoo Idol coverage.",
              "Added learned-only Healing Ward and Cleansing Idol utility tracking.",
              "Kept all new candidate effects active-only or learned-only for safe live testing.",
            },
          }
          '''
          version_path.write_text(version_text[:start] + changelog_block + version_text[end:], encoding='utf-8', newline='\n')

          changelog_path = root / 'RetreatUI/CHANGELOG.txt'
          existing_changelog = changelog_path.read_text(encoding='utf-8')
          section = '''RetreatUI v1.0.11-beta.4
          ============================

          WITCH DOCTOR — VOODOO TRACKING TEST
          - Added high-priority Hex of Malice and Zalazane's Malice target-debuff tracking.
          - Corrected Puppeteer's Threads to track on the target rather than as a player proc.
          - Added a dedicated Loa/Loa Spirits state icon with live stack count.
          - Added Drakkari Barrier cooldown and active-duration tracking.
          - Added learned-only Voodoo Strings, Shadowflare and Voodoo Idol coverage.
          - Added learned-only Healing Ward and Cleansing Idol utility coverage.
          - New uncertain live aura names use safe aliases and only appear when the client reports the matching spell or aura.

          '''
          changelog_path.write_text(section + existing_changelog, encoding='utf-8', newline='\n')
          PY

      - name: Validate beta source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '## Version: 1.0.11-beta.4' RetreatUI/RetreatUI.toc
          grep -Fq '## Version: 1.0.11-beta.4' RetreatUI_Classes/RetreatUI_Classes.toc
          for token in 'Hex of Malice' "Zalazane's Malice" "Puppeteer's Threads" 'Drakkari Barrier' 'Voodoo Strings' 'Shadowflare' 'Voodoo Idol' 'Healing Ward' 'Cleansing Idol' 'Loa Spirits'; do
            grep -Fq "$token" RetreatUI_Classes/WitchDoctor/Data.lua
          done
          python - <<'PY'
          from pathlib import Path
          for path in Path('RetreatUI').rglob('*.lua'):
              path.read_text(encoding='utf-8')
          for path in Path('RetreatUI_Classes').rglob('*.lua'):
              path.read_text(encoding='utf-8')
          PY

      - name: Commit beta source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .release-v1.0.11-beta.4/witchdoctor-beta4.patch
          git rm .github/workflows/publish-v1.0.11-beta.4.yml
          git add RetreatUI RetreatUI_Classes
          git commit -m 'Release RetreatUI v1.0.11-beta.4'
          git push origin HEAD:main

      - name: Package and verify release ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          output = Path('RetreatUI_v1.0.11-beta.4.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for root_name in ('RetreatUI', 'RetreatUI_Classes'):
                  for path in sorted(Path(root_name).rglob('*')):
                      if path.is_file():
                          archive.write(path, path.as_posix())

          with zipfile.ZipFile(output) as archive:
              names = set(archive.namelist())
              roots = {name.split('/', 1)[0] for name in names if '/' in name}
              if roots != {'RetreatUI', 'RetreatUI_Classes'}:
                  raise RuntimeError(f'Unexpected ZIP roots: {sorted(roots)}')
              for required in ('RetreatUI/RetreatUI.toc', 'RetreatUI_Classes/RetreatUI_Classes.toc', 'RetreatUI_Classes/WitchDoctor/Data.lua'):
                  if required not in names:
                      raise RuntimeError(f'Missing {required}')
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.4
          path: RetreatUI_v1.0.11-beta.4.zip

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## Witch Doctor — Voodoo tracking test

          This prerelease is intended for live Witch Doctor Voodoo testing.

          Please verify:
          - Hex of Malice / Zalazane's Malice target tracking and expiry warning
          - Puppeteer's Threads target timer
          - Active Loa / Loa Spirits state and stack display
          - Drakkari Barrier cooldown and active duration
          - Voodoo Strings, Shadowflare and Voodoo Idol visibility
          - Healing Ward and Cleansing Idol utility visibility

          Some Ascension aura names can differ from their spellbook names. Please report missing icons, duplicated entries, incorrect names, effects shown on the wrong unit, or trackers that never activate.
          EOF

          gh release create 'v1.0.11-beta.4' \
            RetreatUI_v1.0.11-beta.4.zip \
            --target "$(git rev-parse HEAD)" \
            --title 'RetreatUI v1.0.11-beta.4 — Witch Doctor Voodoo Tracking Test' \
            --notes-file release-notes.md \
            --prerelease
