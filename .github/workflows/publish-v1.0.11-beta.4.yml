name: Publish RetreatUI v1.0.11-beta.4

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-v1.0.11-beta.4/trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-retreatui-v1.0.11-beta.4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download beta.3 source package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/base build/source
          gh release download v1.0.11-beta.3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.3.zip' \
            --dir build/base
          unzip -q build/base/RetreatUI_v1.0.11-beta.3.zip -d build/source
          test -f build/source/RetreatUI/RetreatUI.toc
          test -f build/source/RetreatUI_Classes/RetreatUI_Classes.toc

      - name: Apply Witch Doctor Voodoo beta.4 patch
        shell: bash
        run: |
          set -euo pipefail
          cd build/source
          git apply --check ../../.release-v1.0.11-beta.4/witchdoctor-beta4.patch
          git apply ../../.release-v1.0.11-beta.4/witchdoctor-beta4.patch

      - name: Validate beta source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          expected_version = '1.0.11-beta.4'
          core_toc = Path('build/source/RetreatUI/RetreatUI.toc').read_text(encoding='utf-8')
          classes_toc = Path('build/source/RetreatUI_Classes/RetreatUI_Classes.toc').read_text(encoding='utf-8')
          data = Path('build/source/RetreatUI_Classes/WitchDoctor/Data.lua').read_text(encoding='utf-8')
          states = Path('build/source/RetreatUI_Classes/StateTracker.lua').read_text(encoding='utf-8')
          hud = Path('build/source/RetreatUI_Classes/WitchDoctor/HUD.lua').read_text(encoding='utf-8')

          checks = {
              'core version': f'## Version: {expected_version}' in core_toc,
              'classes version': f'## Version: {expected_version}' in classes_toc,
              'Witch Doctor state group': '["Witch Doctor"] = {' in states,
              'single state display': 'maxStates = 1' in hud,
          }
          for token in (
              'Hex of Malice',
              "Zalazane's Malice",
              "Puppeteer's Threads",
              'Drakkari Barrier',
              'Voodoo Strings',
              'Shadowflare',
              'Voodoo Idol',
              'Healing Ward',
              'Cleansing Idol',
              'Loa Spirits',
          ):
              checks[f'Witch Doctor token: {token}'] = token in data

          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(('PASS' if passed else 'FAIL') + ': ' + name)
          if failed:
              raise RuntimeError('Validation failed: ' + ', '.join(failed))
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find build/source/RetreatUI build/source/RetreatUI_Classes \
            -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Package release ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('build/source')
          output = Path('RetreatUI_v1.0.11-beta.4.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for root_name in ('RetreatUI', 'RetreatUI_Classes'):
                  for path in sorted((root / root_name).rglob('*')):
                      if path.is_file():
                          archive.write(path, path.relative_to(root).as_posix())

          with zipfile.ZipFile(output) as archive:
              names = set(archive.namelist())
              roots = {name.split('/', 1)[0] for name in names if '/' in name}
              if roots != {'RetreatUI', 'RetreatUI_Classes'}:
                  raise RuntimeError(f'Unexpected ZIP roots: {sorted(roots)}')
              required = {
                  'RetreatUI/RetreatUI.toc',
                  'RetreatUI_Classes/RetreatUI_Classes.toc',
                  'RetreatUI_Classes/WitchDoctor/Data.lua',
                  'RetreatUI_Classes/WitchDoctor/HUD.lua',
                  'RetreatUI_Classes/StateTracker.lua',
              }
              missing = required - names
              if missing:
                  raise RuntimeError(f'Missing ZIP entries: {sorted(missing)}')
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.4
          path: RetreatUI_v1.0.11-beta.4.zip

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # RetreatUI v1.0.11-beta.4 — Witch Doctor Voodoo Tracking Test

          This pre-release is intended for live Witch Doctor Voodoo testing.

          ## Test focus

          - Hex of Malice / Zalazane's Malice target tracking and expiry warning
          - Puppeteer's Threads target timer
          - Active Loa / Voodoo Spirits state and stack display
          - Drakkari Barrier cooldown and active duration
          - Voodoo Strings, Shadowflare and Voodoo Idol visibility
          - Healing Ward and Cleansing Idol utility visibility

          Some Ascension aura names can differ from their spellbook names. Please report missing icons, duplicate entries, incorrect names, effects shown on the wrong unit, or trackers that never activate.
          EOF

          tag='v1.0.11-beta.4'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.4 — Witch Doctor Voodoo Tracking Test' \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$tag" RetreatUI_v1.0.11-beta.4.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" RetreatUI_v1.0.11-beta.4.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.4 — Witch Doctor Voodoo Tracking Test' \
              --notes-file release-notes.md \
              --prerelease
          fi
