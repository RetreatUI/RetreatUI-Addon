name: Apply beta18 Runemaster hotfix

on:
  push:
    branches:
      - hotfix/beta18-runemaster
    paths:
      - ".github/beta18-patch/ready"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/beta18-runemaster
          fetch-depth: 0
      - name: Apply Runemaster hotfix
        shell: bash
        run: |
          set -euo pipefail
          cat .github/beta18-patch/part-* | tr -d '\n' | base64 -d > /tmp/beta18.patch
          git apply --check /tmp/beta18.patch
          git apply /tmp/beta18.patch
          rm -rf .github/beta18-patch
          rm -f .github/workflows/beta18-source.yml
          git config user.name "RetreatUI"
          git config user.email "retreatui@users.noreply.github.com"
          git add -A
          git commit -m "Fix Runemaster localization and rune tracker"
          git push origin HEAD:hotfix/beta18-runemaster
