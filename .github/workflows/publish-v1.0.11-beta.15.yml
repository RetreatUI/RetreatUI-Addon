name: Publish RetreatUI v1.0.11-beta.15

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-v1.0.11-beta.15/trigger-pr"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-v1.0.11-beta.15
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download beta.14 package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/base build/source
          gh release download v1.0.11-beta.14 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.14.zip' \
            --dir build/base
          unzip -q build/base/RetreatUI_v1.0.11-beta.14.zip -d build/source
          test -f build/source/RetreatUI/Core/BuffManager.lua
          test -f build/source/RetreatUI/Integrations/TurboPlates.lua

      - name: Apply beta.15 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .release-v1.0.11-beta.15/beta15.patch.gz.b64.part* > beta15.patch.gz.b64
          base64 -d beta15.patch.gz.b64 > beta15.patch.gz
          echo 'cc7c237d74acf98febe7219eedfefced11201e425d07de4df7932e41bf76f2b4  beta15.patch.gz' | sha256sum -c -
          gzip -dc beta15.patch.gz > beta15.patch
          git apply --check --directory=build/source beta15.patch
          git apply --directory=build/source beta15.patch

      - name: Validate beta.15 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('build/source')
          expected = '1.0.11-beta.15'
          buff = (root / 'RetreatUI/Core/BuffManager.lua').read_text(encoding='utf-8')
          turbo = (root / 'RetreatUI/Integrations/TurboPlates.lua').read_text(encoding='utf-8')
          core_toc = (root / 'RetreatUI/RetreatUI.toc').read_text(encoding='utf-8')
          classes_toc = (root / 'RetreatUI_Classes/RetreatUI_Classes.toc').read_text(encoding='utf-8')
          checks = {
              'core version': f'## Version: {expected}' in core_toc,
              'classes version': f'## Version: {expected}' in classes_toc,
              'generic coverage cache': 'ScanUnitCoverage' in buff and 'unitCoverageCache' in buff,
              'all-class equivalent lookup': 'RegisterEquivalentChoice' in buff and 'EQUIVALENT_ID_LOOKUPS' in buff,
              'dynamic per-member choice': 'AssignedChoiceKeyForMember' in buff and 'fills the largest number' in buff,
              'exclusive active-family guard': 'FamilyExactAuraStatus' in buff and 'endlessly asking' in buff,
              'slaughterhouse bloodmage': 'Slaughterhouse Offering' in buff and '1108493' in buff,
              'visible healthbar scan': 'CollectLiveHealthBars' in turbo and 'StatusBarMatchesUnitHealth' in turbo,
              'health range matching': 'UnitHealthMax' in turbo and 'liveBars=%d' in turbo,
              'no hidden restore': 'if not seenObjects[value] then RestoreColor(value) end' in turbo,
          }
          for name, passed in checks.items():
              print(('PASS' if passed else 'FAIL') + ': ' + name)
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise RuntimeError('Validation failed: ' + ', '.join(failed))
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find build/source/RetreatUI build/source/RetreatUI_Classes \
            -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Test Buff Manager coverage planner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('build/source/RetreatUI/Core/BuffManager.lua').read_text(encoding='utf-8')
          marker = 'local function SpellTexture(spell)'
          export = '''_G.__RUI_BM_TEST = {
            BUFF_CATALOG=BUFF_CATALOG,
            ScanUnitCoverage=ScanUnitCoverage,
            AuraStatus=AuraStatus,
            AssignedChoiceKeyForMember=AssignedChoiceKeyForMember,
          }

          '''
          if marker not in source:
              raise RuntimeError('Buff Manager export marker missing')
          Path('/tmp/BuffManager_test.lua').write_text(source.replace(marker, export + marker, 1), encoding='utf-8')
          PY

          cat > /tmp/test_buff_manager.lua <<'LUA'
          local db = {buffManager={assignments={}, seenSpecs={}}}
          RetreatUI = {
            EnsureDB=function() return db end,
            GetTheme=function() return {muted={1,1,1},accent={1,1,1},dim={.2,.2,.2}} end,
          }
          SlashCmdList = {}
          function CreateFrame()
            local frame = {scripts={}}
            function frame:RegisterEvent() end
            function frame:SetScript(name, fn) self.scripts[name]=fn end
            return setmetatable(frame, {__index=function() return function() end end})
          end
          function GetTime() return 100 end
          local auras = {}
          function UnitExists(unit) return auras[unit] ~= false end
          function UnitBuff(unit, index)
            local aura = auras[unit] and auras[unit][index]
            if not aura then return nil end
            return aura.name, nil, nil, nil, nil, aura.duration, aura.expiration, nil, nil, nil, aura.id
          end
          function UnitIsConnected() return true end
          function UnitIsDeadOrGhost() return false end
          function GetSpellInfo(value) return tostring(value), nil, 'icon' end
          function GetSpellLink() return nil end
          function UnitName(unit) return unit end
          function UnitClass() return 'Bloodmage', 'BLOODMAGE' end
          function UnitPowerType() return 0, 'MANA' end
          function UnitIsGroupLeader() return false end
          function UnitIsGroupAssistant() return false end
          function InCombatLockdown() return false end
          UIParent = {}

          assert(loadfile('/tmp/BuffManager_test.lua'))()
          local T = assert(__RUI_BM_TEST)

          local function runtime(className, familyIndex)
            local family = assert(T.BUFF_CATALOG[className][familyIndex])
            local entries = {}
            for _, choice in ipairs(family.choices or {}) do
              entries[#entries + 1] = {
                choice=choice,
                spell={id=choice.normalID or choice.greaterID, name=choice.normalName or choice.greaterName or choice.name, isGreater=false},
              }
            end
            return {definition=family, choices=entries}
          end
          local function aura(name, id, remaining)
            return {name=name, id=id, duration=remaining or 3600, expiration=100 + (remaining or 3600)}
          end
          local function check(actual, expected, label)
            if actual ~= expected then error(label .. ': expected ' .. tostring(expected) .. ', got ' .. tostring(actual)) end
            print('PASS: ' .. label .. ' -> ' .. tostring(actual))
          end

          local offering = runtime('Bloodmage', 3)
          local manaBucket = {key='bloodmage|other', isTank=false, resource='MANA'}

          auras.p1 = {}
          check(T.AssignedChoiceKeyForMember('Bloodmage', offering, manaBucket, {unit='p1'}), 'bloodsoaked', 'default mana target offering')

          auras.p2 = {aura("Chromie's Wisdom", 802829)}
          check(T.AssignedChoiceKeyForMember('Bloodmage', offering, manaBucket, {unit='p2'}), 'sanguinary', 'spirit duplicate selects stamina offering')

          auras.p3 = {aura('Foul Mandate', 573298)}
          check(T.AssignedChoiceKeyForMember('Bloodmage', offering, manaBucket, {unit='p3'}), 'bloodsoaked', 'stamina duplicate selects spirit offering')

          auras.p4 = {aura('Sanguinary Offering', 707337)}
          check(T.AssignedChoiceKeyForMember('Bloodmage', offering, manaBucket, {unit='p4'}), 'sanguinary', 'active exclusive offering is retained')
          local covered = T.AuraStatus('p4', offering.choices[2], offering)
          check(covered, true, 'active exclusive family covers alternate row')

          auras.p5 = {aura('Foul Mandate', 573298), aura("Chromie's Wisdom", 802829)}
          local choice5 = T.AssignedChoiceKeyForMember('Bloodmage', offering, manaBucket, {unit='p5'})
          local entry5 = choice5 == 'sanguinary' and offering.choices[1] or offering.choices[2]
          check(T.AuraStatus('p5', entry5, offering), true, 'all offering effects supplied by other classes')

          local chromie = runtime('Chronomancer', 1)
          auras.p6 = {aura('Bloodsoaked Offering', 572401)}
          check(T.AuraStatus('p6', chromie.choices[1], chromie), true, 'generic single-choice equivalent coverage')

          local marks = runtime('Knight of Xoroth', 1)
          local physicalBucket = {key='guardian|vanguard', isTank=true, resource='ENERGY'}
          auras.p7 = {aura('Mark of Zeliek', 803671)}
          check(T.AssignedChoiceKeyForMember('Knight of Xoroth', marks, physicalBucket, {unit='p7'}), 'zeliek', 'active mark family member is retained')

          auras.p8 = {aura('Battle Trance', 999999)}
          check(T.AuraStatus('p8', chromie.choices[1], chromie), false, 'unrelated proc does not satisfy class buff')

          db.buffManager.assignments.bloodmage = {offering={[manaBucket.key]='sanguinary'}}
          auras.p9 = {aura("Chromie's Wisdom", 802829)}
          local manual, isManual = T.AssignedChoiceKeyForMember('Bloodmage', offering, manaBucket, {unit='p9'})
          check(manual, 'sanguinary', 'manual assignment remains respected')
          check(isManual, true, 'manual assignment flag')

          local slaughterhouseFound = false
          for _, family in ipairs(T.BUFF_CATALOG.Bloodmage) do
            for _, choice in ipairs(family.choices or {}) do
              if choice.normalID == 1108493 and choice.normalName == 'Slaughterhouse Offering' then slaughterhouseFound = true end
            end
          end
          check(slaughterhouseFound, true, 'Slaughterhouse Offering belongs to Bloodmage')
          LUA
          lua5.1 /tmp/test_buff_manager.lua

      - name: Test TurboPlates visible healthbar matcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('build/source/RetreatUI/Integrations/TurboPlates.lua').read_text(encoding='utf-8')
          marker = 'function RUI:InitializeTurboManaColoring()'
          export = '''_G.__RUI_TP_TEST = {
            StatusBarMatchesUnitHealth=StatusBarMatchesUnitHealth,
            CollectLiveHealthBars=CollectLiveHealthBars,
          }

          '''
          if marker not in source:
              raise RuntimeError('TurboPlates export marker missing')
          Path('/tmp/TurboPlates_test.lua').write_text(source.replace(marker, export + marker, 1), encoding='utf-8')
          PY

          cat > /tmp/test_turboplates.lua <<'LUA'
          RetreatUI = {}
          function UnitHealthMax(unit) return unit == 'target' and 1000 or 0 end
          function UnitHealth(unit) return unit == 'target' and 650 or 0 end
          local function bar(maximum, value, shown, name)
            local b = {}
            function b:GetObjectType() return 'StatusBar' end
            function b:SetStatusBarColor() end
            function b:GetMinMaxValues() return 0, maximum end
            function b:GetValue() return value end
            function b:GetWidth() return 160 end
            function b:GetHeight() return 14 end
            function b:IsShown() return shown ~= false end
            function b:GetName() return name end
            return b
          end
          local live = bar(1000, 650, true, nil)
          local cast = bar(2, 2, true, 'AnonymousCastBar')
          local hidden = bar(1000, 650, false, nil)
          local root = {children={live, cast, hidden}}
          function root:GetObjectType() return 'Frame' end
          function root:IsShown() return true end
          function root:GetChildren() return unpack(self.children) end
          function root:GetName() return 'NamePlateRoot' end

          assert(loadfile('/tmp/TurboPlates_test.lua'))()
          local T = assert(__RUI_TP_TEST)
          assert(T.StatusBarMatchesUnitHealth(live, 'target') == true, 'live healthbar must match')
          assert(T.StatusBarMatchesUnitHealth(cast, 'target') == false, 'castbar must not match')
          assert(T.StatusBarMatchesUnitHealth(hidden, 'target') == false, 'hidden reserve bar must not match')
          local found = {}
          T.CollectLiveHealthBars(root, 'target', found, {}, 0)
          assert(#found == 1 and found[1] == live, 'exactly the visible live healthbar must be collected')
          print('PASS: TurboPlates visible healthbar matcher')
          LUA
          lua5.1 /tmp/test_turboplates.lua

      - name: Package and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('build/source')
          output = Path('RetreatUI_v1.0.11-beta.15.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for root_name in ('RetreatUI', 'RetreatUI_Classes'):
                  for path in sorted((root / root_name).rglob('*')):
                      if path.is_file():
                          archive.write(path, path.relative_to(root).as_posix())
          with zipfile.ZipFile(output) as archive:
              names = set(archive.namelist())
              roots = {name.split('/', 1)[0] for name in names if '/' in name}
              if roots != {'RetreatUI', 'RetreatUI_Classes'}:
                  raise RuntimeError(f'Unexpected ZIP roots: {sorted(roots)}')
              required = {
                  'RetreatUI/RetreatUI.toc',
                  'RetreatUI/Core/BuffManager.lua',
                  'RetreatUI/Integrations/TurboPlates.lua',
                  'RetreatUI_Classes/RetreatUI_Classes.toc',
              }
              missing = required - names
              if missing:
                  raise RuntimeError(f'Missing ZIP entries: {sorted(missing)}')
          PY
          sha256sum RetreatUI_v1.0.11-beta.15.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.15
          path: RetreatUI_v1.0.11-beta.15.zip

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # RetreatUI v1.0.11-beta.15 — Generic Buff Coverage + Visible Mana Healthbar

          ## Buff Manager
          - Every class buff now uses one generic coverage planner
          - Active buffs are matched by exact aura, spell ID and equivalent effect family
          - Equivalent buffs from other classes prevent duplicate recommendations
          - Exclusive families keep an already active Offering, Mark or future family choice
          - When no exclusive choice is active, AUTO selects the learned buff that fills the most uncovered effects
          - Manual assignments remain respected
          - Slaughterhouse Offering (1108493) remains in the Bloodmage Buff Manager

          ## TurboPlates
          - Scans the visible nameplate tree instead of only the hidden reserve hp frame
          - Matches the visible StatusBar against the unit's live health range and percentage
          - Applies the blue overlay to the actual rendered healthbar
          - Diagnostic now reports liveBars and liveOverlay
          EOF

          tag='v1.0.11-beta.15'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.15 — Generic Buff Coverage + Visible Mana Healthbar' \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$tag" RetreatUI_v1.0.11-beta.15.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" RetreatUI_v1.0.11-beta.15.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.15 — Generic Buff Coverage + Visible Mana Healthbar' \
              --notes-file release-notes.md \
              --prerelease
          fi
