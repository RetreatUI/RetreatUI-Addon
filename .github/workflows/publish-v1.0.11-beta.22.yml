name: Publish RetreatUI v1.0.11-beta.22

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'release/v1.0.11-beta.22'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.11-beta.22
      ZIP_NAME: RetreatUI_v1.0.11-beta.22.zip
      PATCH_SHA256: 54a6df613b754ec76071d302299c47c35dd71b5166d2ce28a3b392657578baa9

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 unzip zip patch

      - name: Download beta.21 base
        run: |
          mkdir -p base work
          gh release download v1.0.11-beta.21 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.21.zip' \
            --dir base
          test -f base/RetreatUI_v1.0.11-beta.21.zip
          unzip -q base/RetreatUI_v1.0.11-beta.21.zip -d work

      - name: Verify and apply beta.22 patch
        run: |
          echo "$PATCH_SHA256  .release-v1.0.11-beta.22/beta22.patch" | sha256sum -c -
          patch --batch --forward -p1 -d work < .release-v1.0.11-beta.22/beta22.patch

      - name: Validate Bloodmage proc tracking
        run: |
          grep -Fq '## Version: 1.0.11-beta.22' work/RetreatUI/RetreatUI.toc
          grep -Fq '## Version: 1.0.11-beta.22' work/RetreatUI_Classes/RetreatUI_Classes.toc
          grep -Fq 'name="Trail of Blood", id=804859' work/RetreatUI_Classes/Bloodmage/Data.lua
          grep -Fq '["Trail of Blood"]=true' work/RetreatUI_Classes/Bloodmage/HUD.lua
          grep -Fq '"Enraging Howl", "Trail of Blood", "Call of the Darkwing"' work/RetreatUI_Classes/Bloodmage/Definition.lua
          grep -Fq 'name="Enraging Howl", id=504157' work/RetreatUI_Classes/Bloodmage/Data.lua
          test "$(grep -Fo 'id=804859' work/RetreatUI_Classes/Bloodmage/Data.lua | wc -l)" -eq 1
          test "$(grep -Fo '["Trail of Blood"]=true' work/RetreatUI_Classes/Bloodmage/HUD.lua | wc -l)" -eq 1

      - name: Validate Lua 5.1 syntax
        run: |
          find work/RetreatUI work/RetreatUI_Classes -type f -name '*.lua' -print0 \
            | xargs -0 -n1 luac5.1 -p

      - name: Package addon
        run: |
          cd work
          zip -qr "../$ZIP_NAME" RetreatUI RetreatUI_Classes
          cd ..
          test -f "$ZIP_NAME"

      - name: Validate ZIP structure
        run: |
          python3 - <<'PY'
          import zipfile
          name = 'RetreatUI_v1.0.11-beta.22.zip'
          with zipfile.ZipFile(name) as archive:
              roots = sorted({entry.split('/', 1)[0] for entry in archive.namelist() if entry})
              if roots != ['RetreatUI', 'RetreatUI_Classes']:
                  raise SystemExit(f'Unexpected ZIP roots: {roots}')
              core = archive.read('RetreatUI/RetreatUI.toc').decode('utf-8')
              classes = archive.read('RetreatUI_Classes/RetreatUI_Classes.toc').decode('utf-8')
              data = archive.read('RetreatUI_Classes/Bloodmage/Data.lua').decode('utf-8')
              hud = archive.read('RetreatUI_Classes/Bloodmage/HUD.lua').decode('utf-8')
              assert '## Version: 1.0.11-beta.22' in core
              assert '## Version: 1.0.11-beta.22' in classes
              assert 'name="Trail of Blood", id=804859' in data
              assert data.count('id=804859') == 1
              assert hud.count('["Trail of Blood"]=true') == 1
              assert 'name="Enraging Howl", id=504157' in data
          PY
          sha256sum "$ZIP_NAME"

      - name: Publish GitHub pre-release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its asset."
            gh release upload "$TAG" "$ZIP_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ZIP_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'RetreatUI v1.0.11-beta.22' \
              --prerelease \
              --notes $'Bloodmage proc-tracking update.\n\n- Adds Trail of Blood using verified spell ID 804859.\n- Tracks the five-second Trail of Blood buff in the Bloodmage Procs/Buffs row.\n- Preserves Enraging Howl and all beta.21 behavior without duplicate trackers.'
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.22-artifact
          path: RetreatUI_v1.0.11-beta.22.zip
          if-no-files-found: error
