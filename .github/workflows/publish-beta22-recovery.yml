name: Publish RetreatUI beta.22 recovery

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-beta22-recovery.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate recovery delta
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '## Version: 1.1.2-beta.22' RetreatUI/RetreatUI.toc
          grep -Fq '## Version: 1.1.2-beta.22' RetreatUI_Classes/RetreatUI_Classes.toc
          grep -Fq 'Core\RecoverySafety.lua' RetreatUI/RetreatUI.toc
          ! grep -Fq 'PartyUtility' RetreatUI/RetreatUI.toc
          test ! -e RetreatUI/Core/PartyUtility.lua
          test ! -e RetreatUI/Core/PartyUtilityV4.lua
          grep -Fq 'db.features.partyUtility = false' RetreatUI/Core/RecoverySafety.lua
          grep -Fq 'db.features.partyInterrupts = false' RetreatUI/Core/RecoverySafety.lua

      - name: Validate Lua 5.1 syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find RetreatUI RetreatUI_Classes -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Package recovery ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          zip -qr build/RetreatUI_v1.1.2-beta.22.zip RetreatUI RetreatUI_Classes
          python - <<'PY'
          from pathlib import Path
          import zipfile

          archive = Path('build/RetreatUI_v1.1.2-beta.22.zip')
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              core = z.read('RetreatUI/RetreatUI.toc').decode('utf-8')
              classes = z.read('RetreatUI_Classes/RetreatUI_Classes.toc').decode('utf-8')
              assert '## Version: 1.1.2-beta.22' in core
              assert '## Version: 1.1.2-beta.22' in classes
              assert 'PartyUtility' not in core
              assert 'RetreatUI/Core/PartyUtility.lua' not in names
              assert 'RetreatUI/Core/PartyUtilityV4.lua' not in names
              assert 'RetreatUI/Core/RecoverySafety.lua' in names
          print('PASS: beta.22 recovery package')
          PY

      - name: Remove one-shot publisher from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/publish-beta22-recovery.yml'
          git commit -m 'Remove beta.22 recovery publisher'
          git push origin HEAD:main

      - name: Publish recovery pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.2-beta.22'
          ASSET='build/RetreatUI_v1.1.2-beta.22.zip'
          NOTES=$(cat <<'EOF'
          Emergency recovery release.

          - Restored the complete user-confirmed stable beta.13 codebase.
          - Removed Party Utility and interrupt tracking from load order and package.
          - Added a small recovery gate that disables old tracker SavedVariables and installer selection.
          - Rolled back beta.14 through beta.21 runtime changes for isolated review.
          EOF
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target HEAD \
            --title 'RetreatUI v1.1.2-beta.22 — Emergency Recovery' \
            --notes "$NOTES" \
            --prerelease
