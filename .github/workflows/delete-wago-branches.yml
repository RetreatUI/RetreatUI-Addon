name: Delete temporary Wago branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/delete-wago-branches-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete temporary branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            temp/wago-pux5f9apr \
            temp/wago-fetch \
            temp/wago-audit-run \
            feature/wago-hud-integration
          do
            git push origin --delete "$branch" || true
          done

      - name: Remove one-shot cleanup files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/delete-wago-branches-trigger .github/workflows/delete-wago-branches.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary Wago branch cleanup files'
          git push origin HEAD:main
