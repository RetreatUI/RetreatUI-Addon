name: Promote RetreatUI v1.1.3 release

on:
  push:
    branches:
      - feature/class-hud-cooldown-rows
    paths:
      - ".github/workflows/promote-v1.1.3-release.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: feature/class-hud-cooldown-rows
          fetch-depth: 0

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zip

      - name: Promote source version to 1.1.3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for path in (Path('RetreatUI/RetreatUI.toc'), Path('RetreatUI_Classes/RetreatUI_Classes.toc')):
              text = path.read_text(encoding='utf-8')
              text = text.replace('## Version: 1.1.3-beta.2', '## Version: 1.1.3')
              path.write_text(text, encoding='utf-8')

          version = Path('RetreatUI/Core/Version.lua')
          text = version.read_text(encoding='utf-8')
          text = text.replace('RetreatUI v1.1.3-beta.2', 'RetreatUI v1.1.3')
          text = text.replace('HUD classification, wrapping and Ascension crash-safety test build.', 'Class HUD organization, improved wrapping and Ascension-focused stability updates.')
          version.write_text(text, encoding='utf-8')

          old = Path('RetreatUI/Core/ReleaseChangelog113Beta2.lua')
          new = Path('RetreatUI/Core/ReleaseChangelog113.lua')
          text = old.read_text(encoding='utf-8')
          text = text.replace('RetreatUI v1.1.3-beta.2', 'RetreatUI v1.1.3')
          text = text.replace('HUD classification, wrapping and Ascension crash-safety test build.', 'Class HUD organization, improved wrapping and Ascension-focused stability updates.')
          new.write_text(text, encoding='utf-8')
          old.unlink()

          toc = Path('RetreatUI/RetreatUI.toc')
          text = toc.read_text(encoding='utf-8')
          text = text.replace('Core\\ReleaseChangelog113Beta2.lua', 'Core\\ReleaseChangelog113.lua')
          toc.write_text(text, encoding='utf-8')

          crash_test = Path('tests/test_crash_safety.py')
          text = crash_test.read_text(encoding='utf-8')
          text = text.replace('Core\\\\ReleaseChangelog113Beta2.lua', 'Core\\\\ReleaseChangelog113.lua')
          text = text.replace('beta.2 changelog is not loaded by the core TOC', 'v1.1.3 changelog is not loaded by the core TOC')
          text = text.replace('beta.2 changelog must load after the stable 1.1.2 changelog', 'v1.1.3 changelog must load after the stable 1.1.2 changelog')
          crash_test.write_text(text, encoding='utf-8')
          PY

      - name: Validate stable build
        shell: bash
        run: |
          set -euo pipefail
          find RetreatUI RetreatUI_Classes -type f -name '*.lua' -print0 | sort -z | xargs -0 -n1 luac5.1 -p
          lua5.1 tests/test_hud_policy.lua
          lua5.1 tests/test_main_bar_wrap.lua
          lua5.1 tests/test_bloodmage_eternal_classification.lua
          python3 tests/test_crash_safety.py
          python3 tests/test_knight_wrap.py
          grep -q '^## Version: 1.1.3$' RetreatUI/RetreatUI.toc
          grep -q '^## Version: 1.1.3$' RetreatUI_Classes/RetreatUI_Classes.toc
          test -f RetreatUI/Core/ReleaseChangelog113.lua
          test ! -e RetreatUI/Core/ReleaseChangelog113Beta2.lua
          ! grep -R -n '1.1.3-beta.2\|test build' RetreatUI RetreatUI_Classes
          python3 - <<'PY'
          from pathlib import Path
          for toc_path in (Path('RetreatUI/RetreatUI.toc'), Path('RetreatUI_Classes/RetreatUI_Classes.toc')):
              root = toc_path.parent
              missing = []
              for raw in toc_path.read_text(encoding='utf-8-sig').splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#'):
                      continue
                  candidate = root / line.replace('\\', '/')
                  if not candidate.is_file():
                      missing.append(str(candidate))
              if missing:
                  raise SystemExit(f'{toc_path}: missing referenced files: {missing}')
          PY

      - name: Commit stable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Retreat"
          git config user.email "gaarn94@gmail.com"
          git add RetreatUI RetreatUI_Classes tests/test_crash_safety.py
          git commit -m "Release RetreatUI v1.1.3"
          git push origin HEAD:feature/class-hud-cooldown-rows
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build and verify release archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="RetreatUI_v1.1.3.zip"
          zip -qr "$ZIP" RetreatUI RetreatUI_Classes
          python3 - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path

          archive = Path('RetreatUI_v1.1.3.zip')
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
          roots = {name.split('/', 1)[0] for name in names if '/' in name}
          if roots != {'RetreatUI', 'RetreatUI_Classes'}:
              raise SystemExit(f'Unexpected package roots: {sorted(roots)}')
          if any('beta.2' in name for name in names):
              raise SystemExit('Beta-labelled file remains in stable package')
          print('SHA256=' + hashlib.sha256(archive.read_bytes()).hexdigest())
          PY

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v1.1.3" "RetreatUI_v1.1.3.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "RetreatUI 1.1.3" \
            --latest \
            --notes "RetreatUI 1.1.3 reorganizes class HUDs so learned offensive and rotational abilities stay on Main, while defensive and utility abilities stay on Utility. Main now wraps after nine icons, including the custom Knight of Xoroth HUD. The release also includes the verified Eternal Bloodmage classifications, additional class cooldown coverage, and Ascension-focused stability improvements."
