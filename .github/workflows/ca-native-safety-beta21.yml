name: Hotfix native Character Advancement crash in beta.21

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ca-native-safety-beta21.yml'

permissions:
  contents: write

concurrency:
  group: retreatui-beta21-ca-native-safety
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unsafe native CA queries and bump beta.21
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          spell_path = root / 'RetreatUI/Data/SpellDatabase.lua'
          text = spell_path.read_text(encoding='utf-8')

          active_pattern = re.compile(
              r'function RUI:GetActiveAdvancementSlot\(\)\n.*?\nend\n\nfunction RUI:IsAdvancementEntryLearned',
              re.S,
          )
          active_replacement = '''function RUI:GetActiveAdvancementSlot()
  -- Avoid the native Character Advancement object here. Ascension can keep
  -- stale build pointers while rebuilding a character, and querying that
  -- object can terminate the client before Lua error handling can run.
  if type(GetActiveTalentGroup) == "function" then
    local ok, slot = pcall(GetActiveTalentGroup)
    if ok and tonumber(slot) then return tonumber(slot) end
  end
  return 1
end

function RUI:IsAdvancementEntryLearned'''
          text, count = active_pattern.subn(active_replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f'GetActiveAdvancementSlot replacement count: {count}')

          learned_pattern = re.compile(
              r'function RUI:IsAdvancementEntryLearned\(entryID\)\n.*?\nend\n\nfunction RUI:IsSpellRecordLearned',
              re.S,
          )
          learned_replacement = '''function RUI:IsAdvancementEntryLearned(entryID)
  -- Direct native advancement-entry lookups are intentionally disabled.
  -- Missing collector entries can assert inside the Ascension client. Returning
  -- nil tells the shared record logic to use the live spellbook instead.
  return nil
end

RUI._characterAdvancementDirectQueriesDisabled = true

function RUI:IsSpellRecordLearned'''
          text, count = learned_pattern.subn(learned_replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f'IsAdvancementEntryLearned replacement count: {count}')

          spell_path.write_text(text, encoding='utf-8', newline='\n')

          versions = {
              root / 'RetreatUI/RetreatUI.toc': ('1.1.2-beta.20', '1.1.2-beta.21'),
              root / 'RetreatUI_Classes/RetreatUI_Classes.toc': ('1.1.2-beta.20', '1.1.2-beta.21'),
          }
          for path, (old, new) in versions.items():
              value = path.read_text(encoding='utf-8')
              if old not in value:
                  raise RuntimeError(f'{old} missing from {path}')
              path.write_text(value.replace(old, new, 1), encoding='utf-8', newline='\n')

          changelog = '''local RUI = RetreatUI
if not RUI then return end

RUI.changelog = {
  version = RUI.version,
  title = "RetreatUI v1.1.2-beta.21",
  summary = "Native Character Advancement safety hotfix.",
  changes = {
    "Removed all direct runtime calls to C_CharacterAdvancement, UnitTalentRankByID and UnitKnownID.",
    "Learned talent and ability visibility now falls back to the live spellbook instead of querying collector entry IDs.",
    "Prevents missing or stale Ascension CA entries from triggering an unrecoverable CharacterAdvancementBuildEntry::UpdatePointers assertion through RetreatUI.",
    "Buff Manager beta.20 raid-buff data remains included.",
    "Party utility and interrupt tracking remain fully removed.",
  },
}
'''
          (root / 'RetreatUI/Core/ReleaseChangelog112.lua').write_text(changelog, encoding='utf-8', newline='\n')
          PY

      - name: Validate native CA safety
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '## Version: 1.1.2-beta.21' RetreatUI/RetreatUI.toc
          grep -Fq '## Version: 1.1.2-beta.21' RetreatUI_Classes/RetreatUI_Classes.toc
          grep -Fq 'RUI._characterAdvancementDirectQueriesDisabled = true' RetreatUI/Data/SpellDatabase.lua
          ! grep -RInE 'C_CharacterAdvancement|UnitTalentRankByID|UnitKnownID' RetreatUI RetreatUI_Classes --include='*.lua' | grep -v 'ReleaseChangelog112.lua'
          ! grep -Fq 'Core\\PartyUtility.lua' RetreatUI/RetreatUI.toc
          ! grep -Fq 'Core\\PartyUtilityV4.lua' RetreatUI/RetreatUI.toc
          ! grep -Fq 'Core\\RetreatCD.lua' RetreatUI/RetreatUI.toc

      - name: Validate Lua 5.1 syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find RetreatUI RetreatUI_Classes -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Package beta.21
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          zip -qr build/RetreatUI_v1.1.2-beta.21.zip RetreatUI RetreatUI_Classes
          python - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path('build/RetreatUI_v1.1.2-beta.21.zip')
          with zipfile.ZipFile(archive) as z:
              roots = sorted({name.split('/', 1)[0] for name in z.namelist() if name})
              assert roots == ['RetreatUI', 'RetreatUI_Classes'], roots
              spell = z.read('RetreatUI/Data/SpellDatabase.lua').decode('utf-8')
              core = z.read('RetreatUI/RetreatUI.toc').decode('utf-8')
              classes = z.read('RetreatUI_Classes/RetreatUI_Classes.toc').decode('utf-8')
              assert '## Version: 1.1.2-beta.21' in core
              assert '## Version: 1.1.2-beta.21' in classes
              assert 'RUI._characterAdvancementDirectQueriesDisabled = true' in spell
              assert 'C_CharacterAdvancement' not in spell
              assert 'UnitTalentRankByID' not in spell
              assert 'UnitKnownID' not in spell
          print('PASS: beta.21 native CA safety package')
          PY

      - name: Commit clean beta.21 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RetreatUI/Data/SpellDatabase.lua \
                  RetreatUI/Core/ReleaseChangelog112.lua \
                  RetreatUI/RetreatUI.toc \
                  RetreatUI_Classes/RetreatUI_Classes.toc
          git rm -f CA_API_AUDIT.txt \
                    .github/workflows/ca-api-audit.yml \
                    .github/workflows/ca-native-safety-beta21.yml
          git commit -m 'Disable unsafe native Character Advancement queries in beta.21'
          git push origin HEAD:main

      - name: Publish beta.21 pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.2-beta.21'
          TARGET=$(git rev-parse HEAD)
          ASSET='build/RetreatUI_v1.1.2-beta.21.zip'
          NOTES=$(cat <<'EOF'
          - Removed all direct RetreatUI calls to Ascension's native Character Advancement lookup API.
          - Learned talent and ability visibility now uses the live spellbook fallback.
          - Prevents missing or stale CA collector entries from causing an unrecoverable UpdatePointers assertion through RetreatUI.
          - Includes the beta.20 Buff Manager raid-buff database update.
          - Party utility and interrupt tracking remain fully removed.
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title 'RetreatUI v1.1.2-beta.21' \
            --notes "$NOTES" \
            --prerelease
