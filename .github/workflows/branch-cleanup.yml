name: One-shot stale branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/branch-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          branches=(
            "feature/beta17-hud-editor-runemaster"
            "feature/beta20-ranger-wa-audit"
            "feature/beta21-modular-installer-tinker-trackers"
            "feature/elvui-2.0-compatibility-block"
            "feature/v1.1.2-beta.1-guardian"
            "feature/v1.1.2-beta.2-pyro-chat-stance"
            "feature/v1.1.2-beta.3-guardian-reprisal"
            "feature/v1.1.2-beta.4-guardian-banners-chat"
            "feature/v1.1.2-beta.5-banner-tooltip-fix"
            "feature/v1.1.2-beta.6-formation-macros-flicker-hotfix"
            "hotfix/beta18-runemaster"
            "hotfix/beta19-rune-label"
            "hotfix/beta22-trinket-engine"
            "hotfix/elvui-2.0-false-positive"
            "hotfix/v1.1.0-beta.13-elvui-installer"
            "hotfix/v1.1.0-beta.13-trigger"
            "hotfix/v1.1.0-beta.14-trigger"
            "hotfix/v1.1.1-raidframes"
            "hotfix/v1.1.2-baseline-pyromancer"
            "temp/release-download-counts"
          )

          for branch in "${branches[@]}"; do
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" \
              || echo "Branch ${branch} was already absent or could not be deleted."
          done
