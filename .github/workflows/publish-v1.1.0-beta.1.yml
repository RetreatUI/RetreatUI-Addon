name: Publish RetreatUI v1.1.0-beta.1

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'release/v1.1.0-beta.1'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.1.0-beta.1
      ZIP_NAME: RetreatUI_v1.1.0-beta.1.zip
      MANIFEST_NAME: RetreatUI_manifest.json
      PATCH_SHA256: 93a896fcfa46215cd20fb1c141ddb3d6da7b4e0fead7d523f6c693c74e47436e

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 unzip zip patch

      - name: Download official v1.0.11 base
        run: |
          mkdir -p base work
          gh release download v1.0.11 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11.zip' \
            --dir base
          test -f base/RetreatUI_v1.0.11.zip
          unzip -q base/RetreatUI_v1.0.11.zip -d work

      - name: Decode and apply v1.1 beta patch
        run: |
          base64 -d .release-v1.1.0-beta.1/payload.patch.gz.b64 | gzip -d > /tmp/v1.1.0-beta.1.patch
          echo "$PATCH_SHA256  /tmp/v1.1.0-beta.1.patch" | sha256sum -c -
          patch --batch --forward -p1 -d work < /tmp/v1.1.0-beta.1.patch

      - name: Validate v1.1 systems foundation
        run: |
          grep -Fq '## Version: 1.1.0-beta.1' work/RetreatUI/RetreatUI.toc
          grep -Fq '## Version: 1.1.0-beta.1' work/RetreatUI_Classes/RetreatUI_Classes.toc
          test -f work/RetreatUI/Core/BuildProfiles.lua
          test -f work/RetreatUI/Core/HUDEditor.lua
          grep -Fq 'local CURRENT_SCHEMA = 5' work/RetreatUI/Core/Init.lua
          grep -Fq 'function RUI:GetBuildFingerprint' work/RetreatUI/Core/BuildProfiles.lua
          grep -Fq 'function RUI:ToggleHUDEditor' work/RetreatUI/Core/HUDEditor.lua
          grep -Fq 'elseif cmd == "hud"' work/RetreatUI/Loader.lua
          grep -Fq 'elseif cmd == "build"' work/RetreatUI/Loader.lua
          grep -Fq 'function module:refreshLayout' work/RetreatUI_Classes/Shared/AdvancedHUD.lua
          grep -Fq 'function module:refreshLayout' work/RetreatUI_Classes/Bloodmage/HUD.lua
          grep -Fq 'function module:refreshLayout' work/RetreatUI_Classes/Necromancer/HUD.lua
          grep -Fq 'function module:refreshLayout' work/RetreatUI_Classes/KnightOfXoroth/HUD.lua
          grep -Fq 'partyUtility' work/RetreatUI/Core/Init.lua
          grep -Fq 'dangerousAbilities' work/RetreatUI/Core/Init.lua
          grep -Fq 'buffManager2' work/RetreatUI/Core/Init.lua

      - name: Validate Lua 5.1 syntax
        run: |
          find work/RetreatUI work/RetreatUI_Classes -type f -name '*.lua' -print0 \
            | xargs -0 -n1 luac5.1 -p

      - name: Runtime-test build profiles
        run: |
          lua5.1 - <<'LUA'
          _G.RetreatUIDB = {}
          local frameMethods = {
            Hide = function() end,
            Show = function() end,
            SetScript = function() end,
            RegisterEvent = function() end,
          }
          function CreateFrame()
            return setmetatable({}, { __index = frameMethods })
          end
          DEFAULT_CHAT_FRAME = { AddMessage = function() end }
          UIParent = {}
          function date() return "test" end
          function time() return 1 end
          RetreatUI = {}

          assert(loadfile('work/RetreatUI/Core/Init.lua'))()
          assert(loadfile('work/RetreatUI/Core/Layout.lua'))()

          RetreatUI.NormalizeClassName = function(_, value) return value end
          RetreatUI.GetDetectedClass = function() return 'Witch Doctor' end
          RetreatUI.IsSupportedCharacter = function() return true end
          RetreatUI.ScanSpellbook = function() return {}, false end
          RetreatUI.GetActiveAdvancementSlot = function() return 1 end
          local records = {
            { name='Bad Juju', id=501177, hudRow='core', talent=true },
            { name='Big Bad Voodoo', id=802719, hudRow='core', talent=true },
          }
          RetreatUI.GetClassSpellRecords = function() return records end
          RetreatUI.IsSpellRecordLearned = function(_, record) return record.id == 501177 end
          RetreatUI.GetSpellRecordRuntimeID = function(_, record) return record.id end
          RetreatUI.ApplyHUDLayout = function() return true end

          assert(loadfile('work/RetreatUI/Core/BuildProfiles.lua'))()
          local fingerprint = RetreatUI:GetBuildFingerprint('Witch Doctor')
          assert(type(fingerprint) == 'string' and fingerprint:match('^b%x%x%x%x%x%x%x%x$'))
          local changed, key = RetreatUI:RefreshBuildProfile('test', true)
          assert(key == fingerprint)
          local profile, profileKey = RetreatUI:GetActiveHUDProfile('Witch Doctor', true)
          assert(type(profile) == 'table' and type(profile.core) == 'table')
          assert(profileKey == fingerprint)
          assert(RetreatUIDB.hudProfiles['Witch Doctor'].builds[fingerprint])
          print('Build profile runtime test passed:', changed, fingerprint)
          LUA

      - name: Package addon
        run: |
          cd work
          zip -qr "../$ZIP_NAME" RetreatUI RetreatUI_Classes
          cd ..
          test -f "$ZIP_NAME"

      - name: Validate ZIP structure
        run: |
          python3 - <<'PY'
          import zipfile
          name = 'RetreatUI_v1.1.0-beta.1.zip'
          with zipfile.ZipFile(name) as archive:
              roots = sorted({entry.split('/', 1)[0] for entry in archive.namelist() if entry})
              if roots != ['RetreatUI', 'RetreatUI_Classes']:
                  raise SystemExit(f'Unexpected ZIP roots: {roots}')
              core = archive.read('RetreatUI/RetreatUI.toc').decode('utf-8')
              classes = archive.read('RetreatUI_Classes/RetreatUI_Classes.toc').decode('utf-8')
              build_profiles = archive.read('RetreatUI/Core/BuildProfiles.lua').decode('utf-8')
              hud_editor = archive.read('RetreatUI/Core/HUDEditor.lua').decode('utf-8')
              assert '## Version: 1.1.0-beta.1' in core
              assert '## Version: 1.1.0-beta.1' in classes
              assert 'function RUI:GetBuildFingerprint' in build_profiles
              assert 'function RUI:ToggleHUDEditor' in hud_editor
          PY
          sha256sum "$ZIP_NAME"

      - name: Create launcher release manifest
        run: |
          RELEASE_SHA=$(sha256sum base/RetreatUI_v1.0.11.zip | awk '{print $1}')
          BETA_SHA=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          export RELEASE_SHA BETA_SHA
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          manifest = {
              'schema': 1,
              'repository': 'RetreatUI/RetreatUI-Addon',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'channels': {
                  'release': {
                      'version': '1.0.11',
                      'tag': 'v1.0.11',
                      'asset': 'RetreatUI_v1.0.11.zip',
                      'sha256': os.environ['RELEASE_SHA'],
                      'prerelease': False,
                  },
                  'beta': {
                      'version': '1.1.0-beta.1',
                      'tag': 'v1.1.0-beta.1',
                      'asset': 'RetreatUI_v1.1.0-beta.1.zip',
                      'sha256': os.environ['BETA_SHA'],
                      'prerelease': True,
                  },
              },
          }
          with open('RetreatUI_manifest.json', 'w', encoding='utf-8') as handle:
              json.dump(manifest, handle, indent=2)
              handle.write('\n')
          PY
          python3 -m json.tool "$MANIFEST_NAME" >/dev/null
          cat "$MANIFEST_NAME"

      - name: Publish GitHub pre-release
        run: |
          NOTES=$'RetreatUI v1.1 systems foundation.\n\n- Adds /rui hud with a live editor for independent HUD anchors.\n- Adds automatic per-class, per-build HUD profiles using learned-spell and Character Advancement fingerprints.\n- New builds safely inherit the class default and switch without a reset command.\n- Adds the versioned settings and launcher-manifest foundation for Party Utility, dangerous-ability tracking and Buff Manager 2.0.\n\nThis is the first v1.1 testing build and is intended for beta-channel users.'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" "$MANIFEST_NAME" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title 'RetreatUI v1.1.0-beta.1' --prerelease --notes "$NOTES"
          else
            gh release create "$TAG" "$ZIP_NAME" "$MANIFEST_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'RetreatUI v1.1.0-beta.1' \
              --prerelease \
              --notes "$NOTES"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.1.0-beta.1-artifact
          path: |
            RetreatUI_v1.1.0-beta.1.zip
            RetreatUI_manifest.json
          if-no-files-found: error
