name: One-shot Buff Manager beta.20

on:
  push:
    paths:
      - .github/workflows/buff-manager-beta20.yml

permissions:
  contents: write

jobs:
  update-buff-manager:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply authoritative CoA raid-buff data
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          buff_path = root / 'RetreatUI/Core/BuffManager.lua'
          text = buff_path.read_text(encoding='utf-8')

          equivalent = r'''local EQUIVALENT_BUFFS = {
