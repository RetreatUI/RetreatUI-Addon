name: Publish real RetreatUI v1.1.5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.1.5-real.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stop when release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.1.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate addon versions
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          core="$(sed -n 's/^## Version:[[:space:]]*//p' RetreatUI/RetreatUI.toc | head -n1 | tr -d '\r')"
          classes="$(sed -n 's/^## Version:[[:space:]]*//p' RetreatUI_Classes/RetreatUI_Classes.toc | head -n1 | tr -d '\r')"
          test "$core" = "1.1.5"
          test "$classes" = "1.1.5"

      - name: Package verified addon
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/package
          cp -a RetreatUI dist/package/RetreatUI
          cp -a RetreatUI_Classes dist/package/RetreatUI_Classes
          cd dist/package
          zip -r ../RetreatUI_v1.1.5.zip RetreatUI RetreatUI_Classes
          cd ../..
          test -s dist/RetreatUI_v1.1.5.zip
          zipinfo -1 dist/RetreatUI_v1.1.5.zip | grep -q '^RetreatUI/RetreatUI\.toc$'
          zipinfo -1 dist/RetreatUI_v1.1.5.zip | grep -q '^RetreatUI_Classes/RetreatUI_Classes\.toc$'
          sha256sum dist/RetreatUI_v1.1.5.zip > dist/RetreatUI_v1.1.5.zip.sha256

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ## RetreatUI 1.1.5

          - Moves the Guardian Formation tracker, including Assault Formation, 10 pixels upward so it clears the resource bar.
          - Keeps the Guardian offset class-specific; other class stance/form trackers are unchanged.
          - Includes the TurboPlates no-aggro color, global HUD duplicate guard and party-frame text fixes prepared after 1.1.3.
          NOTES
          gh release create v1.1.5 \
            dist/RetreatUI_v1.1.5.zip \
            dist/RetreatUI_v1.1.5.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RetreatUI 1.1.5" \
            --notes-file release-notes.md \
            --latest

      - name: Remove temporary publisher after success
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v1.1.5-real.yml
          git commit -m "Remove temporary v1.1.5 publisher"
          git push
