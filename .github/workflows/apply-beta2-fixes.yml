name: Apply RetreatUI beta.2 fixes

on:
  push:
    branches:
      - feature/class-hud-cooldown-rows
    paths:
      - ".github/workflows/apply-beta2-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/class-hud-cooldown-rows
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - run: python3 tools/apply_beta2_fixes.py
      - run: |
          set -euo pipefail
          find RetreatUI RetreatUI_Classes -type f -name '*.lua' -print0 | sort -z | xargs -0 -n1 luac5.1 -p
          lua5.1 tests/test_hud_policy.lua
          lua5.1 tests/test_main_bar_wrap.lua
          lua5.1 tests/test_bloodmage_eternal_classification.lua
          python3 tests/test_crash_safety.py
          python3 tests/test_knight_wrap.py
      - run: |
          git config user.name "Retreat"
          git config user.email "gaarn94@gmail.com"
          git add -A
          git commit -m "RetreatUI v1.1.3-beta.2 safety and HUD fixes"
          git push origin HEAD:feature/class-hud-cooldown-rows
