name: Apply isolated beta.21 CA native safety hotfix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ca-native-safety-beta21-v2.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch unsafe CA lookups
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          spell_path = Path('RetreatUI/Data/SpellDatabase.lua')
          text = spell_path.read_text(encoding='utf-8')
          start_marker = 'function RUI:GetActiveAdvancementSlot()'
          end_marker = 'function RUI:IsSpellRecordLearned(record)'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''function RUI:GetActiveAdvancementSlot()
  -- Avoid direct native Character Advancement queries. Ascension may hold
  -- stale build pointers while rebuilding a character.
  if type(GetActiveTalentGroup) == "function" then
    local ok, slot = pcall(GetActiveTalentGroup)
    if ok and tonumber(slot) then return tonumber(slot) end
  end
  return 1
end

function RUI:IsAdvancementEntryLearned(entryID)
  -- Missing collector entries can assert in the native client. Returning nil
  -- makes RetreatUI use the actual live spellbook as the safe source of truth.
  return nil
end

RUI._characterAdvancementDirectQueriesDisabled = true

'''
          text = text[:start] + replacement + text[end:]
          if 'local advancement = _G.C_CharacterAdvancement' in text:
              raise RuntimeError('native advancement object still present')
          spell_path.write_text(text, encoding='utf-8', newline='\n')

          for path in (Path('RetreatUI/RetreatUI.toc'), Path('RetreatUI_Classes/RetreatUI_Classes.toc')):
              value = path.read_text(encoding='utf-8')
              if '1.1.2-beta.20' not in value:
                  raise RuntimeError(f'beta.20 version missing from {path}')
              path.write_text(value.replace('1.1.2-beta.20', '1.1.2-beta.21', 1), encoding='utf-8', newline='\n')

          Path('RetreatUI/Core/ReleaseChangelog112.lua').write_text('''local RUI = RetreatUI
if not RUI then return end

RUI.changelog = {
  version = RUI.version,
  title = "RetreatUI v1.1.2-beta.21",
  summary = "Native Character Advancement safety hotfix.",
  changes = {
    "Removed direct runtime queries against Ascension's native Character Advancement entry API.",
    "Talent and ability visibility now falls back to the live spellbook instead of collector entry lookups.",
    "This prevents missing or stale CA entries from triggering an unrecoverable UpdatePointers assertion through RetreatUI.",
    "The beta.20 Buff Manager data remains included.",
    "Party utility and interrupt tracking remain fully removed.",
  },
}
''', encoding='utf-8', newline='\n')

          Path('BETA21_CA_HOTFIX_VERIFIED.txt').write_text(
              'version=1.1.2-beta.21\n'
              'direct_ca_queries=disabled\n'
              'fallback=live_spellbook\n',
              encoding='utf-8'
          )
          PY

      - name: Commit beta.21
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RetreatUI/Data/SpellDatabase.lua \
                  RetreatUI/Core/ReleaseChangelog112.lua \
                  RetreatUI/RetreatUI.toc \
                  RetreatUI_Classes/RetreatUI_Classes.toc \
                  BETA21_CA_HOTFIX_VERIFIED.txt
          git rm -f CA_API_AUDIT.txt \
                    .github/workflows/ca-api-audit.yml \
                    .github/workflows/ca-native-safety-beta21.yml \
                    .github/workflows/ca-native-safety-beta21-v2.yml
          git commit -m 'Disable unsafe native Character Advancement lookups in beta.21'
          git push origin HEAD:main

      - name: Package and publish beta.21
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build
          zip -qr build/RetreatUI_v1.1.2-beta.21.zip RetreatUI RetreatUI_Classes
          TAG='v1.1.2-beta.21'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$TAG" build/RetreatUI_v1.1.2-beta.21.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title 'RetreatUI v1.1.2-beta.21' \
            --notes 'Native Character Advancement safety hotfix. Direct CA entry lookups are disabled and RetreatUI now uses the live spellbook fallback. Includes the beta.20 Buff Manager data. Party utility and interrupt tracking remain removed.' \
            --prerelease
