name: Publish RetreatUI beta.2 prerelease

on:
  push:
    branches:
      - feature/class-hud-cooldown-rows
    paths:
      - ".github/workflows/publish-beta2-prerelease.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta.2 source
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zip

      - name: Validate beta.2
        shell: bash
        run: |
          set -euo pipefail
          find RetreatUI RetreatUI_Classes -type f -name '*.lua' -print0 | sort -z | xargs -0 -n1 luac5.1 -p
          lua5.1 tests/test_hud_policy.lua
          lua5.1 tests/test_main_bar_wrap.lua
          lua5.1 tests/test_bloodmage_eternal_classification.lua
          python3 tests/test_crash_safety.py
          python3 tests/test_knight_wrap.py
          grep -q '^## Version: 1.1.3-beta.2$' RetreatUI/RetreatUI.toc
          grep -q '^## Version: 1.1.3-beta.2$' RetreatUI_Classes/RetreatUI_Classes.toc

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="RetreatUI_v1.1.3-beta.2.zip"
          zip -qr "$ZIP" RetreatUI RetreatUI_Classes
          python3 - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path

          archive = Path('RetreatUI_v1.1.3-beta.2.zip')
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
          roots = {name.split('/', 1)[0] for name in names if '/' in name}
          if roots != {'RetreatUI', 'RetreatUI_Classes'}:
              raise SystemExit(f'Unexpected package roots: {sorted(roots)}')
          retired = [name for name in names if name.endswith('PartyInterruptCuration.lua') or name.endswith('PartyUtilityCombatLogHotfix.lua')]
          if retired:
              raise SystemExit(f'Retired tracker files are still packaged: {retired}')
          print('SHA256=' + hashlib.sha256(archive.read_bytes()).hexdigest())
          PY

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v1.1.3-beta.2" "RetreatUI_v1.1.3-beta.2.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RetreatUI 1.1.3-beta.2" \
            --prerelease \
            --notes "Safety follow-up to beta.1. Removes active inspect, talent and unsafe learned-state fallbacks; adds 9-plus-rest wrapping to the custom Knight of Xoroth HUD; keeps offensive abilities on Main and defensive/utility abilities on Utility; preserves the verified Eternal Bloodmage corrections; removes retired party tracker source files; fixes the Buff Manager texture path; and updates the in-game beta.2 changelog."
