name: Publish RetreatUI v1.1.0-beta.5

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'release/v1.1.0-beta.5'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.1.0-beta.5
      ZIP_NAME: RetreatUI_v1.1.0-beta.5.zip
      MANIFEST_NAME: RetreatUI_manifest.json
      PATCH_SHA256: 537c944950fbbc4da33e0ba92e239e029d23afa97827f3232edff659c7ac14cc
      TREE_SHA256: 4df184547c3e0da77097f6ac1dc0ae996f54bd62542265b6c5d1ee352f625b26

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 unzip zip patch

      - name: Download beta.4 base and official release
        run: |
          mkdir -p base work official
          gh release download v1.1.0-beta.4 --repo "$GITHUB_REPOSITORY" --pattern 'RetreatUI_v1.1.0-beta.4.zip' --dir base
          gh release download v1.0.11 --repo "$GITHUB_REPOSITORY" --pattern 'RetreatUI_v1.0.11.zip' --dir official
          test -f base/RetreatUI_v1.1.0-beta.4.zip
          test -f official/RetreatUI_v1.0.11.zip
          unzip -q base/RetreatUI_v1.1.0-beta.4.zip -d work

      - name: Decode and apply beta.5 patch
        run: |
          cat .release-v1.1.0-beta.5/payload.part* | tr -d '\r\n ' | base64 -d | gzip -d > /tmp/v1.1.0-beta.5.patch
          echo "$PATCH_SHA256  /tmp/v1.1.0-beta.5.patch" | sha256sum -c -
          patch --batch --forward -p1 -d work < /tmp/v1.1.0-beta.5.patch

      - name: Validate beta.5 content
        run: |
          grep -Fq '## Version: 1.1.0-beta.5' work/RetreatUI/RetreatUI.toc
          grep -Fq '## Version: 1.1.0-beta.5' work/RetreatUI_Classes/RetreatUI_Classes.toc
          grep -Fq 'RUI.version = (GetAddOnMetadata and GetAddOnMetadata("RetreatUI", "Version")) or "1.1.0-beta.5"' work/RetreatUI/Loader.lua
          grep -Fq 'title = "RetreatUI v1.1.0-beta.5"' work/RetreatUI/Core/Version.lua
          grep -Fq '"ElvUI_BarTotem"' work/RetreatUI/Core/TotemBarMover.lua
          grep -Fq 'Never choose the Blizzard child when its ElvUI owner can be recovered.' work/RetreatUI/Core/TotemBarMover.lua
          grep -Fq 'Repair the detached state left by beta.4' work/RetreatUI/Core/TotemBarMover.lua
          grep -Fq 'The visible Totem Bar, its ElvUI mover and RetreatUI drag grip now remain attached' work/RetreatUI/CHANGELOG.txt
          ACTUAL_TREE_SHA=$(cd work && find RetreatUI RetreatUI_Classes -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          test "$ACTUAL_TREE_SHA" = "$TREE_SHA256"

      - name: Validate Lua 5.1 syntax
        run: |
          find work/RetreatUI work/RetreatUI_Classes -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Package addon
        run: |
          rm -f "$ZIP_NAME"
          (cd work && zip -qr "../$ZIP_NAME" RetreatUI RetreatUI_Classes)
          unzip -tq "$ZIP_NAME"
          python3 - <<'PY'
          import zipfile
          path = 'RetreatUI_v1.1.0-beta.5.zip'
          with zipfile.ZipFile(path) as archive:
              roots = {
                  name.split('/', 1)[0]
                  for name in archive.namelist()
                  if name and not name.startswith('__MACOSX/')
              }
              assert roots == {'RetreatUI', 'RetreatUI_Classes'}, roots
              assert all('/.git/' not in name and not name.endswith('.pyc') for name in archive.namelist())
          PY

      - name: Create launcher release manifest
        run: |
          BETA_SHA=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          RELEASE_SHA=$(sha256sum official/RetreatUI_v1.0.11.zip | awk '{print $1}')
          cat > "$MANIFEST_NAME" <<JSON
          {
            "schema": 1,
            "generated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "channels": {
              "release": {"version":"1.0.11","tag":"v1.0.11","asset":"RetreatUI_v1.0.11.zip","sha256":"$RELEASE_SHA","prerelease":false},
              "beta": {"version":"1.1.0-beta.5","tag":"v1.1.0-beta.5","asset":"RetreatUI_v1.1.0-beta.5.zip","sha256":"$BETA_SHA","prerelease":true}
            }
          }
          JSON
          python3 -m json.tool "$MANIFEST_NAME" >/dev/null

      - name: Publish GitHub pre-release
        run: |
          cat > /tmp/release-notes.md <<'MD'
          ## RetreatUI v1.1.0-beta.5

          ### Totem Bar movement fix
          - Fixed Witch Doctor Totem Bar movement by targeting Ascension ElvUI's real `ElvUI_BarTotem` owner instead of the child `MultiCastActionBarFrame`.
          - The visible Totem Bar, ElvUI mover and RetreatUI drag grip now remain attached and move together.
          - Automatically repairs the detached child-anchor state left by beta.4 while preserving the saved Totem Bar position.

          ### Preserved beta.4 changes
          - Keeps the complete Buff Manager keybind system, installer overhaul and profile migrations from beta.4.
          - Existing profiles, Buff Manager assignments and HUD layouts are not reset.

          ### Installation
          Replace both `RetreatUI` and `RetreatUI_Classes` with the folders included in the archive.
          MD
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" "$MANIFEST_NAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title 'RetreatUI v1.1.0-beta.5' --notes-file /tmp/release-notes.md --prerelease
          else
            gh release create "$TAG" "$ZIP_NAME" "$MANIFEST_NAME" --repo "$GITHUB_REPOSITORY" --title 'RetreatUI v1.1.0-beta.5' --notes-file /tmp/release-notes.md --prerelease
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.1.0-beta.5
          path: |
            RetreatUI_v1.1.0-beta.5.zip
            RetreatUI_manifest.json
          if-no-files-found: error
