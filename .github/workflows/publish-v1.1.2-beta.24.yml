name: Publish RetreatUI v1.1.2-beta.24

on:
  push:
    branches:
      - main
    paths:
      - '.github/beta24-publish-trigger'

permissions:
  contents: write

concurrency:
  group: publish-retreatui-v1.1.2-beta.24
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate beta.24 source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '## Version: 1.1.2-beta.24' RetreatUI/RetreatUI.toc
          grep -Fq '## Version: 1.1.2-beta.24' RetreatUI_Classes/RetreatUI_Classes.toc
          grep -Fq 'Integrations\WeakAurasCompanion.lua' RetreatUI/RetreatUI.toc
          grep -Fq 'CoAMultiCastActionBarFrame' RetreatUI/Integrations/Cleanup.lua
          grep -Fq 'CoAResourceOrb' RetreatUI/Integrations/Cleanup.lua
          grep -Fq 'Aspect of the Moonwell' RetreatUI_Classes/Starcaller/Data.lua
          grep -Fq 'Lunar Phase' RetreatUI_Classes/Starcaller/Data.lua
          grep -Fq 'Demonfire Pact' RetreatUI_Classes/StateTracker.lua
          grep -Fq 'Blood of Mannoroth' RetreatUI_Classes/Felsworn/Data.lua
          grep -Fq 'local ENCODED = [=[!WA:2!' RetreatUI/Integrations/WeakAurasCompanion.lua
          ! grep -Fq 'Core\PartyUtility.lua' RetreatUI/RetreatUI.toc
          ! grep -Fq 'Core\PartyUtilityV4.lua' RetreatUI/RetreatUI.toc
          ! grep -Fq 'Core\RetreatCD.lua' RetreatUI/RetreatUI.toc
          ! grep -Fq 'bar.Show = function() end' RetreatUI/Integrations/Cleanup.lua

      - name: Validate Lua 5.1 syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find RetreatUI RetreatUI_Classes -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Validate WeakAuras bridge
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mock-wa.lua <<'LUA'
          RetreatUI = {prints={}}
          function RetreatUI:Print(message) self.prints[#self.prints+1] = message end
          WeakAuras = {
            companionCalls=0,
            importCalls=0,
            AddCompanionData=function(data)
              assert(type(data) == 'table' and type(data.slugs.PUjOUxmPt) == 'table')
              assert(string.sub(data.slugs.PUjOUxmPt.encoded, 1, 6) == '!WA:2!')
              WeakAuras.companionCalls = WeakAuras.companionCalls + 1
            end,
            GetData=function() return nil end,
            Import=function(encoded)
              assert(string.sub(encoded, 1, 6) == '!WA:2!')
              WeakAuras.importCalls = WeakAuras.importCalls + 1
              return true
            end,
          }
          SlashCmdList = {}
          function CreateFrame()
            return {RegisterEvent=function() end, SetScript=function() end}
          end
          assert(loadfile('RetreatUI/Integrations/WeakAurasCompanion.lua'))()
          assert(WeakAuras.companionCalls == 1)
          SlashCmdList.RETREATUIZG()
          assert(WeakAuras.importCalls == 1)
          print('PASS: WeakAuras bridge')
          LUA
          lua5.1 /tmp/mock-wa.lua

      - name: Package and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          zip -qr build/RetreatUI_v1.1.2-beta.24.zip RetreatUI RetreatUI_Classes
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path('build/RetreatUI_v1.1.2-beta.24.zip')
          with zipfile.ZipFile(archive) as z:
              roots = sorted({name.split('/', 1)[0] for name in z.namelist() if name})
              assert roots == ['RetreatUI', 'RetreatUI_Classes'], roots
              core = z.read('RetreatUI/RetreatUI.toc').decode('utf-8')
              classes = z.read('RetreatUI_Classes/RetreatUI_Classes.toc').decode('utf-8')
              bridge = z.read('RetreatUI/Integrations/WeakAurasCompanion.lua').decode('utf-8')
              assert '## Version: 1.1.2-beta.24' in core
              assert '## Version: 1.1.2-beta.24' in classes
              assert bridge.count('!WA:2!') >= 1
              assert 'PartyUtility' not in core and 'RetreatCD' not in core
              assert 'RetreatUI/THIRD_PARTY_NOTICES.md' in z.namelist()
          print('PASS: RetreatUI v1.1.2-beta.24 package')
          PY

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.2-beta.24'
          ASSET='build/RetreatUI_v1.1.2-beta.24.zip'
          TARGET=$(git rev-parse HEAD^)
          NOTES=$(cat <<'EOF'
          - Added missing Starcaller aspects, Lunar Phase, Celestial Aegis, Vigil of the Moon, Command, Stellar Drift, Huntress Saber and Tidal Rebirth from the audited Starcaller package.
          - Added Felsworn pact states, missing active procs, Betray, Blood of Mannoroth, Blur, Eye of Archimonde and Fel Bargain from the audited Felsworn package.
          - Added safe support for hiding CoAMultiCastActionBarFrame and CoAResourceOrb when RetreatUI has a complete native replacement.
          - Bundled the original Zul'Gurub raid pack through WeakAuras companion data. Use /ruizg to open the normal WeakAuras import review.
          - RetreatUI does not automatically delete, reposition, restyle or overwrite personal WeakAuras.
          - Party utility and interrupt tracking remain removed.
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title 'RetreatUI v1.1.2-beta.24' \
            --notes "$NOTES" \
            --prerelease

      - name: Verify published asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.1.2-beta.24 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets > /tmp/release.json
          python - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('/tmp/release.json').read_text(encoding='utf-8'))
          assert release['tagName'] == 'v1.1.2-beta.24'
          assert release['isPrerelease'] is True
          names = [asset['name'] for asset in release.get('assets', [])]
          assert 'RetreatUI_v1.1.2-beta.24.zip' in names, names
          Path('.beta24-release-verified').write_text('tag=v1.1.2-beta.24\nasset=RetreatUI_v1.1.2-beta.24.zip\n', encoding='utf-8')
          PY

      - name: Commit verification marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .beta24-release-verified
          git commit -m 'Confirm beta.24 release asset is published'
          git push origin HEAD:main
