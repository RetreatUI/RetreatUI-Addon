name: Publish RetreatUI v1.1.0-beta.7

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'release/v1.1.0-beta.7'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.1.0-beta.7
      ZIP_NAME: RetreatUI_v1.1.0-beta.7.zip
      MANIFEST_NAME: RetreatUI_manifest.json
      PATCH_SHA256: e036d57e6a90b708cbddd68b1e09b03c57f34ca7cd91a67b61a7ec409cba7cfe
      TREE_SHA256: 62b54085f2ecbdde94823b974e1c7b2731d0ae29a2ef2427c40005a8ab6e0f94

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 unzip zip patch

      - name: Download beta.6 base and official release
        run: |
          mkdir -p base work official
          gh release download v1.1.0-beta.6 --repo "$GITHUB_REPOSITORY" --pattern 'RetreatUI_v1.1.0-beta.6.zip' --dir base
          gh release download v1.0.11 --repo "$GITHUB_REPOSITORY" --pattern 'RetreatUI_v1.0.11.zip' --dir official
          test -f base/RetreatUI_v1.1.0-beta.6.zip
          test -f official/RetreatUI_v1.0.11.zip
          unzip -q base/RetreatUI_v1.1.0-beta.6.zip -d work

      - name: Apply beta.7 tooltip patch
        run: |
          patch_file="$GITHUB_WORKSPACE/.release-v1.1.0-beta.7/party-utility-tooltip.patch"
          echo "$PATCH_SHA256  $patch_file" | sha256sum -c -
          patch --batch --forward -p1 -d work < "$patch_file"

      - name: Validate beta.7 content
        run: |
          grep -Fq '## Version: 1.1.0-beta.7' work/RetreatUI/RetreatUI.toc
          grep -Fq '## Version: 1.1.0-beta.7' work/RetreatUI_Classes/RetreatUI_Classes.toc
          grep -Fq 'or "1.1.0-beta.7"' work/RetreatUI/Loader.lua
          grep -Fq 'title = "RetreatUI v1.1.0-beta.7"' work/RetreatUI/Core/Version.lua
          grep -Fq 'GameTooltip.SetSpellByID' work/RetreatUI/Core/PartyUtility.lua
          grep -Fq 'GameTooltip.SetHyperlink' work/RetreatUI/Core/PartyUtility.lua
          grep -Fq 'Cooldown remaining:' work/RetreatUI/Core/PartyUtility.lua
          grep -Fq 'GameTooltip:AddLine("Ready"' work/RetreatUI/Core/PartyUtility.lua
          ! grep -Fq 'GameTooltip:AddLine(tostring(CATEGORY_LABELS[entry.category]' work/RetreatUI/Core/PartyUtility.lua
          ACTUAL_TREE_SHA=$(cd work && find RetreatUI RetreatUI_Classes -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          test "$ACTUAL_TREE_SHA" = "$TREE_SHA256"

      - name: Validate Lua 5.1 syntax
        run: |
          find work/RetreatUI work/RetreatUI_Classes -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Package addon
        run: |
          rm -f "$ZIP_NAME"
          (cd work && zip -qr "../$ZIP_NAME" RetreatUI RetreatUI_Classes)
          unzip -tq "$ZIP_NAME"
          python3 - <<'PY'
          import zipfile
          path = 'RetreatUI_v1.1.0-beta.7.zip'
          with zipfile.ZipFile(path) as archive:
              roots = {
                  name.split('/', 1)[0]
                  for name in archive.namelist()
                  if name and not name.startswith('__MACOSX/')
              }
              assert roots == {'RetreatUI', 'RetreatUI_Classes'}, roots
              assert all('/.git/' not in name and not name.endswith('.pyc') for name in archive.namelist())
          PY

      - name: Create launcher release manifest
        run: |
          BETA_SHA=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          RELEASE_SHA=$(sha256sum official/RetreatUI_v1.0.11.zip | awk '{print $1}')
          cat > "$MANIFEST_NAME" <<JSON
          {
            "schema": 1,
            "generated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "channels": {
              "release": {"version":"1.0.11","tag":"v1.0.11","asset":"RetreatUI_v1.0.11.zip","sha256":"$RELEASE_SHA","prerelease":false},
              "beta": {"version":"1.1.0-beta.7","tag":"v1.1.0-beta.7","asset":"RetreatUI_v1.1.0-beta.7.zip","sha256":"$BETA_SHA","prerelease":true}
            }
          }
          JSON
          python3 -m json.tool "$MANIFEST_NAME" >/dev/null

      - name: Publish GitHub pre-release
        run: |
          cat > /tmp/release-notes.md <<'MD'
          ## RetreatUI v1.1.0-beta.7

          ### Party Utility ability tooltips
          - Party Utility icons now show the native ability tooltip when hovered instead of internal category labels such as `Group Defensive`.
          - Uses the tracked spell ID, so the tooltip includes the real spell name, description and normal game information.
          - Adds live `Cooldown remaining` or `Ready` status beneath the spell tooltip.
          - Includes a safe spell-link fallback for Project Ascension clients without direct `SetSpellByID` support.

          ### Preserved beta.6 changes
          - Keeps HUD scaling, automatic build/talent detection and all saved layouts from beta.6.
          MD
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" "$MANIFEST_NAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title 'RetreatUI v1.1.0-beta.7' --notes-file /tmp/release-notes.md --prerelease
          else
            gh release create "$TAG" "$ZIP_NAME" "$MANIFEST_NAME" --repo "$GITHUB_REPOSITORY" --title 'RetreatUI v1.1.0-beta.7' --notes-file /tmp/release-notes.md --prerelease
          fi

      - name: Verify published pre-release
        run: |
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = "true"
          mkdir -p verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ZIP_NAME" --pattern "$MANIFEST_NAME" --dir verify
          unzip -tq "verify/$ZIP_NAME"
          grep -Fq '"version":"1.1.0-beta.7"' "verify/$MANIFEST_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.1.0-beta.7
          path: |
            RetreatUI_v1.1.0-beta.7.zip
            RetreatUI_manifest.json
          if-no-files-found: error
