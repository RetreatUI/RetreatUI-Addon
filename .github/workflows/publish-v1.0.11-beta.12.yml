name: Publish RetreatUI v1.0.11-beta.12

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-v1.0.11-beta.12/trigger-pr"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-v1.0.11-beta.12
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download beta.11 package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/base build/source
          gh release download v1.0.11-beta.11 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.11.zip' \
            --dir build/base
          unzip -q build/base/RetreatUI_v1.0.11-beta.11.zip -d build/source
          test -f build/source/RetreatUI/Integrations/TurboPlates.lua

      - name: Apply beta.12 mana-nameplate patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release-v1.0.11-beta.12/beta12.patch.gz.b64 > beta12.patch.gz
          echo 'f3f9807151fba5f78160015b72ffdc633fe2300821ccec0d0a2b05dc5b385e88  beta12.patch.gz' | sha256sum -c -
          gzip -dc beta12.patch.gz > beta12.patch
          git apply --check --directory=build/source beta12.patch
          git apply --directory=build/source beta12.patch

      - name: Validate beta.12 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('build/source')
          expected = '1.0.11-beta.12'
          turbo = (root / 'RetreatUI/Integrations/TurboPlates.lua').read_text(encoding='utf-8')
          core_toc = (root / 'RetreatUI/RetreatUI.toc').read_text(encoding='utf-8')
          classes_toc = (root / 'RetreatUI_Classes/RetreatUI_Classes.toc').read_text(encoding='utf-8')
          checks = {
              'core version': f'## Version: {expected}' in core_toc,
              'classes version': f'## Version: {expected}' in classes_toc,
              'independent fill overlay': 'EnsureManaFillOverlay' in turbo and 'manaNPCIndependentFillOverlay = true' in turbo,
              'mana pool detection': 'UnitManaMax' in turbo and 'UnitPowerMax' in turbo,
              'friendly-only rejection': 'friendly == true' in turbo,
              'direct unit resolver': 'PaintUnitTurboPlate' in turbo and 'ResolveTurboPlate' in turbo,
              'nameplate added handling': 'NAME_PLATE_UNIT_ADDED' in turbo and 'PaintUnitTurboPlate(unit, seenObjects)' in turbo,
          }
          for name, passed in checks.items():
              print(('PASS' if passed else 'FAIL') + ': ' + name)
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise RuntimeError('Validation failed: ' + ', '.join(failed))
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find build/source/RetreatUI build/source/RetreatUI_Classes \
            -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Package and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('build/source')
          output = Path('RetreatUI_v1.0.11-beta.12.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for root_name in ('RetreatUI', 'RetreatUI_Classes'):
                  for path in sorted((root / root_name).rglob('*')):
                      if path.is_file():
                          archive.write(path, path.relative_to(root).as_posix())
          with zipfile.ZipFile(output) as archive:
              names = set(archive.namelist())
              roots = {name.split('/', 1)[0] for name in names if '/' in name}
              if roots != {'RetreatUI', 'RetreatUI_Classes'}:
                  raise RuntimeError(f'Unexpected ZIP roots: {sorted(roots)}')
              required = {
                  'RetreatUI/RetreatUI.toc',
                  'RetreatUI/Integrations/TurboPlates.lua',
                  'RetreatUI_Classes/RetreatUI_Classes.toc',
              }
              missing = required - names
              if missing:
                  raise RuntimeError(f'Missing ZIP entries: {sorted(missing)}')
          PY
          sha256sum RetreatUI_v1.0.11-beta.12.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.12
          path: RetreatUI_v1.0.11-beta.12.zip

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # RetreatUI v1.0.11-beta.12 — TurboPlates Mana Health Bar Fix

          ## Test focus

          - Hostile enemies with a mana pool should display a blue TurboPlates health fill
          - The blue fill is a separate overlay and should no longer be overwritten by threat or reaction colors
          - Mana detection now checks the actual mana pool before relying on UnitPowerType
          - Nameplate units are no longer rejected solely because Ascension temporarily reports UnitCanAttack=false
          - All beta.11 class tracking, Totem Bar and previous changes remain included
          EOF

          tag='v1.0.11-beta.12'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.12 — TurboPlates Mana Health Bar Fix' \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$tag" RetreatUI_v1.0.11-beta.12.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" RetreatUI_v1.0.11-beta.12.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.12 — TurboPlates Mana Health Bar Fix' \
              --notes-file release-notes.md \
              --prerelease
          fi
