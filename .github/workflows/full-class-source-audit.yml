name: Full class source audit

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/full-class-source-audit-trigger'
      - '.github/workflows/full-class-source-audit.yml'
      - 'Tools/audit_sources.cjs'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: temp/audit-packs-working3
          fetch-depth: 0

      - name: Install decoder and browser
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install node-weakauras-parser@3.2.11 playwright@1.54.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Audit all supplied packages and class data
        shell: bash
        run: |
          set -euo pipefail
          node Tools/audit_sources.cjs

      - name: Commit audit output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Research/Audit20260803
          git commit -m 'Audit class packs and all class data' || exit 0
          git push origin HEAD:temp/audit-packs-working3
