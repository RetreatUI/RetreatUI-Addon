name: Full class source audit

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/full-class-source-audit-trigger'
      - '.github/workflows/full-class-source-audit.yml'
      - 'Tools/audit_sources.cjs'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: temp/audit-packs-working3
          fetch-depth: 0

      - name: Install decoder and browser
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install node-weakauras-parser@3.2.11 playwright@1.54.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Audit all supplied packages and class data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Tools/audit_sources.cjs')
          text = path.read_text()
          text = text.replace(
              "await page.goto(target.url, { waitUntil: 'networkidle', timeout: 90000 });",
              "try { await page.goto(target.url, { waitUntil: 'domcontentloaded', timeout: 30000 }); } catch (_) {}"
          )
          text = text.replace(
              "    if (Array.isArray(node.d)) for (const child of node.d) visit(child, id || parent);\n    if (Array.isArray(node.children)) for (const child of node.children) visit(child, id || parent);",
              "    for (const [childKey, child] of Object.entries(node)) { if (childKey === 'parent' || childKey === 'raw') continue; if (Array.isArray(child)) { for (const item of child) if (item && typeof item === 'object') visit(item, id || parent); } else if (child && typeof child === 'object') { visit(child, id || parent); } }"
          )
          text = text.replace(
              "for (const target of SIDEKICK_TARGETS) await auditSidekick(target, browser);",
              "for (const target of SIDEKICK_TARGETS) { try { await auditSidekick(target, browser); } catch (error) { const dir = path.join(ROOT, 'Sidekick', target.id); fs.mkdirSync(dir, { recursive: true }); fs.writeFileSync(path.join(dir, 'summary.txt'), `source=${target.label}\\nclass=${target.className}\\naudit_error=${compact(String(error), 2000)}\\n`); } }"
          )
          path.write_text(text)
          PY
          node Tools/audit_sources.cjs

      - name: Commit audit output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d Research/Audit20260803 ]; then
            git add Research/Audit20260803
            git commit -m 'Audit class packs and all class data' || exit 0
            git push origin HEAD:temp/audit-packs-working3
          fi
