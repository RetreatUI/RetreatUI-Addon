name: Publish RetreatUI v1.0.11-beta.10 Retry

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-v1.0.11-beta.10/retry-pr"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-v1.0.11-beta.10-retry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download beta.9 package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/base build/source
          gh release download v1.0.11-beta.9 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.9.zip' \
            --dir build/base
          unzip -q build/base/RetreatUI_v1.0.11-beta.9.zip -d build/source

      - name: Reassemble and apply beta.10 patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .release-v1.0.11-beta.10/beta10.patch.gz.b64.part1 \
            .release-v1.0.11-beta.10/beta10.patch.gz.b64.part2 \
            .release-v1.0.11-beta.10/beta10.patch.gz.b64.part3 \
            .release-v1.0.11-beta.10/beta10.patch.gz.b64.part4 \
            > beta10.patch.gz.b64
          echo '80f358957b46b1210450983507722f6889a94c9db58efc7b84251db18ffa845b  beta10.patch.gz.b64' | sha256sum -c -
          base64 -d beta10.patch.gz.b64 > beta10.patch.gz
          echo '2e0107783fc3e842ec30eabf53daa34a849e31fe5d70d29a12fa3b3c65e56712  beta10.patch.gz' | sha256sum -c -
          gzip -dc beta10.patch.gz > beta10.patch
          cd build/source
          git apply --check -p4 ../../beta10.patch
          git apply -p4 ../../beta10.patch

      - name: Validate beta.10 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('build/source')
          expected = '1.0.11-beta.10'
          core_toc = (root / 'RetreatUI/RetreatUI.toc').read_text(encoding='utf-8')
          classes_toc = (root / 'RetreatUI_Classes/RetreatUI_Classes.toc').read_text(encoding='utf-8')
          totem = (root / 'RetreatUI/Core/TotemBarMover.lua').read_text(encoding='utf-8')
          profile = (root / 'RetreatUI/Profiles/ElvUI.lua').read_text(encoding='utf-8')
          integration = (root / 'RetreatUI/Integrations/ElvUI.lua').read_text(encoding='utf-8')
          turbo = (root / 'RetreatUI/Integrations/TurboPlates.lua').read_text(encoding='utf-8')

          checks = {
              'core version': f'## Version: {expected}' in core_toc,
              'classes version': f'## Version: {expected}' in classes_toc,
              'single Totem Bar mover': 'MOVER_DEFINITIONS' in totem and 'SuppressDuplicateMovers' in totem,
              'saved mover migration': 'saved.moverKey = moverKey' in totem and 'ClearInactiveMoverKeys' in totem,
              'duplicate static mover removed': '    TotemBarMover = "BOTTOM' not in profile,
              'profile selects one mover': 'profile.movers.ElvBar_Totem = nil' in integration and 'profile.movers.TotemBarMover = nil' in integration,
              'direct TurboPlates unit detection': 'nameplate._unit' in turbo and 'nameplate.myPlate' in turbo,
              'direct TurboPlates health painting': 'PaintTurboPlate' in turbo and 'myPlate.hp' in turbo,
              'mana integration flag': 'manaNPCDirectTurboPlateDetection = true' in turbo,
          }
          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(('PASS' if passed else 'FAIL') + ': ' + name)
          if failed:
              raise RuntimeError('Validation failed: ' + ', '.join(failed))
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find build/source/RetreatUI build/source/RetreatUI_Classes \
            -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Package beta.10
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('build/source')
          output = Path('RetreatUI_v1.0.11-beta.10.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for root_name in ('RetreatUI', 'RetreatUI_Classes'):
                  for path in sorted((root / root_name).rglob('*')):
                      if path.is_file():
                          archive.write(path, path.relative_to(root).as_posix())

          with zipfile.ZipFile(output) as archive:
              names = set(archive.namelist())
              roots = {name.split('/', 1)[0] for name in names if '/' in name}
              if roots != {'RetreatUI', 'RetreatUI_Classes'}:
                  raise RuntimeError(f'Unexpected ZIP roots: {sorted(roots)}')
          PY
          sha256sum RetreatUI_v1.0.11-beta.10.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.10
          path: RetreatUI_v1.0.11-beta.10.zip

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # RetreatUI v1.0.11-beta.10 — Totem Bar & Mana Nameplate Fixes

          ## Test focus

          - ElvUI Toggle Anchors should show only one Witch Doctor Totem Bar mover
          - The actual Totem Bar remains attached to the surviving mover
          - Existing Totem Bar placement is migrated automatically
          - TurboPlates reads each active plate directly through `nameplate._unit` and `nameplate.myPlate`
          - Attackable enemies with mana receive a blue health fill, blue background and blue border
          - All previous beta.9 changes remain included
          EOF

          tag='v1.0.11-beta.10'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.10 — Totem Bar & Mana Nameplate Fixes' \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$tag" RetreatUI_v1.0.11-beta.10.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" RetreatUI_v1.0.11-beta.10.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.10 — Totem Bar & Mana Nameplate Fixes' \
              --notes-file release-notes.md \
              --prerelease
          fi
