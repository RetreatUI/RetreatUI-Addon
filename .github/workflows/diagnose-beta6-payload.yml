name: Repair RetreatUI beta.6 payload

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'release/v1.1.0-beta.6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.0-beta.6

      - name: Repair mismatched part04 block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.release-v1.1.0-beta.6/payload.part04')
          data = path.read_text()
          expected = 'x1W+qYN1qR0eJbAky62FmvZWc30d/m0//o6T6WmhV89lq7n5dOHp/L3V3NqC8bSe4qhaalRf9HSWIHEylnxhYdU/k+T5V4sTSTV2ER9rWmpGdBO5NUTO+FRt4HSYjzJ2da9VcrUEDAgiUq7VTtnasCiPN1dlxmIhTsC85QmYwOAwrLXLWtJuGXA6qOBbdr8Ekkxt9UCu'
          current = data[39 * 200:40 * 200]
          if current != expected:
              path.write_text(data[:39 * 200] + expected + data[40 * 200:])
          PY

      - name: Commit repair when needed
        run: |
          if git diff --quiet -- .release-v1.1.0-beta.6/payload.part04; then
            echo 'Payload block already matches.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .release-v1.1.0-beta.6/payload.part04
          git commit -m 'Repair beta.6 payload part04'
          git push origin HEAD:release/v1.1.0-beta.6
