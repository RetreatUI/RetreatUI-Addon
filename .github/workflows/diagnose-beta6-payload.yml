name: Diagnose RetreatUI beta.6 payload

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'release/v1.1.0-beta.6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print mismatched part04 block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          data = Path('.release-v1.1.0-beta.6/payload.part04').read_text()
          print(data[39 * 200:40 * 200])
          PY
