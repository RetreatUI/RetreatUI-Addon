name: Diagnose RetreatUI beta.6 payload

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'release/v1.1.0-beta.6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash part04 blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          data = Path('.release-v1.1.0-beta.6/payload.part04').read_bytes()
          print('bytes', len(data))
          for offset in range(0, len(data), 200):
              print(offset // 200, hashlib.sha256(data[offset:offset + 200]).hexdigest())
          PY
