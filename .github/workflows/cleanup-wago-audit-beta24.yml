name: Clean beta.24 temporary infrastructure

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-wago-audit-beta24.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary audit and release files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .beta24-release-verified \
            .github/beta24-publish-trigger \
            .github/wago-audit-trigger \
            .github/workflows/fetch-wago-pux5f9apr-main.yml \
            .github/workflows/wago-audit-windows.yml \
            .github/workflows/wago-decode-windows.yml \
            .github/workflows/wago-gap-windows.yml \
            .github/workflows/wago-resolve-spells-windows.yml \
            .github/workflows/implement-wago-beta24.yml \
            .github/workflows/run-implement-wago-beta24.yml \
            .github/workflows/publish-v1.1.2-beta.24.yml \
            .github/workflows/cleanup-wago-audit-beta24.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary Wago audit and beta.24 build files'
          git push origin HEAD:main
