name: Fetch RetreatUI beta.5 base for beta.6

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fetch:
    if: github.event.pull_request.head.ref == 'release/v1.1.0-beta.6'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download beta.5 release asset
        run: |
          gh release download v1.1.0-beta.5 --repo "$GITHUB_REPOSITORY" --pattern 'RetreatUI_v1.1.0-beta.5.zip'
          test -f RetreatUI_v1.1.0-beta.5.zip
          unzip -tq RetreatUI_v1.1.0-beta.5.zip

      - name: Upload beta.5 base
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.1.0-beta.5-base
          path: RetreatUI_v1.1.0-beta.5.zip
          if-no-files-found: error
