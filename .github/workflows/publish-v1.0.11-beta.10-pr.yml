name: Publish RetreatUI v1.0.11-beta.10 PR

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-v1.0.11-beta.10/trigger-pr"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-v1.0.11-beta.10-pr
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download beta.9 source package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/base build/source
          gh release download v1.0.11-beta.9 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.9.zip' \
            --dir build/base
          unzip -q build/base/RetreatUI_v1.0.11-beta.9.zip -d build/source
          test -f build/source/RetreatUI/RetreatUI.toc
          test -f build/source/RetreatUI/Core/TotemBarMover.lua
          test -f build/source/RetreatUI/Integrations/TurboPlates.lua
          test -f build/source/RetreatUI_Classes/RetreatUI_Classes.toc

      - name: Decode and apply beta.10 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release-v1.0.11-beta.10/beta10.patch.gz.b64 | gzip -dc > beta10.patch
          git apply --check --directory=build/source beta10.patch
          git apply --directory=build/source beta10.patch

      - name: Validate beta source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('build/source')
          expected = '1.0.11-beta.10'
          core_toc = (root / 'RetreatUI/RetreatUI.toc').read_text(encoding='utf-8')
          classes_toc = (root / 'RetreatUI_Classes/RetreatUI_Classes.toc').read_text(encoding='utf-8')
          totem = (root / 'RetreatUI/Core/TotemBarMover.lua').read_text(encoding='utf-8')
          profile = (root / 'RetreatUI/Profiles/ElvUI.lua').read_text(encoding='utf-8')
          integration = (root / 'RetreatUI/Integrations/ElvUI.lua').read_text(encoding='utf-8')
          turbo = (root / 'RetreatUI/Integrations/TurboPlates.lua').read_text(encoding='utf-8')

          checks = {
              'core version': f'## Version: {expected}' in core_toc,
              'classes version': f'## Version: {expected}' in classes_toc,
              'single mover resolver': 'MOVER_DEFINITIONS' in totem and 'ResolveMover(bar)' in totem,
              'duplicate mover suppression': 'SuppressDuplicateMovers' in totem and '_ruiSuppressDuplicateTotemMover' in totem,
              'Toggle Anchors OnShow guard': 'HookScript("OnShow"' in totem,
              'saved mover migration': 'saved.moverKey = moverKey' in totem and 'ClearInactiveMoverKeys' in totem,
              'static profile has no normal duplicate mover': '    TotemBarMover = "BOTTOM' not in profile,
              'profile install selects one mover': 'profile.movers.ElvBar_Totem = nil' in integration and 'profile.movers.TotemBarMover = nil' in integration,
              'full-frame mana plates retained': 'manaNPCFullFrameBlue = true' in turbo and 'CollectPlateVisuals' in turbo,
          }
          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(('PASS' if passed else 'FAIL') + ': ' + name)
          if failed:
              raise RuntimeError('Validation failed: ' + ', '.join(failed))
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find build/source/RetreatUI build/source/RetreatUI_Classes \
            -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Package and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('build/source')
          output = Path('RetreatUI_v1.0.11-beta.10.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for root_name in ('RetreatUI', 'RetreatUI_Classes'):
                  for path in sorted((root / root_name).rglob('*')):
                      if path.is_file():
                          archive.write(path, path.relative_to(root).as_posix())

          with zipfile.ZipFile(output) as archive:
              names = set(archive.namelist())
              roots = {name.split('/', 1)[0] for name in names if '/' in name}
              if roots != {'RetreatUI', 'RetreatUI_Classes'}:
                  raise RuntimeError(f'Unexpected ZIP roots: {sorted(roots)}')
              required = {
                  'RetreatUI/RetreatUI.toc',
                  'RetreatUI/Core/TotemBarMover.lua',
                  'RetreatUI/Integrations/TurboPlates.lua',
                  'RetreatUI_Classes/RetreatUI_Classes.toc',
              }
              missing = required - names
              if missing:
                  raise RuntimeError(f'Missing ZIP entries: {sorted(missing)}')
          PY
          sha256sum RetreatUI_v1.0.11-beta.10.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.10
          path: RetreatUI_v1.0.11-beta.10.zip

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # RetreatUI v1.0.11-beta.10 — Single Totem Bar Mover

          ## Test focus

          - ElvUI Toggle Anchors should show only one Witch Doctor Totem Bar
          - The visible Totem Bar remains attached to the surviving RetreatUI-managed mover
          - The unused duplicate TotemBarMover is hidden if ElvUI tries to show it
          - Existing Totem Bar placement is migrated automatically
          - Full-frame blue mana-enemy nameplates and every beta.9 change remain included
          EOF

          tag='v1.0.11-beta.10'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.10 — Single Totem Bar Mover' \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$tag" RetreatUI_v1.0.11-beta.10.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" RetreatUI_v1.0.11-beta.10.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.10 — Single Totem Bar Mover' \
              --notes-file release-notes.md \
              --prerelease
          fi
