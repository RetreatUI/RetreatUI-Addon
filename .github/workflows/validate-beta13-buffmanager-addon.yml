name: Validate Buff Manager Addon

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/beta20-coa-layout]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Validate beta.20 Buff Manager
        run: |
          luac5.1 -p RetreatUI_BuffManager/BuffManager.lua
          python3 tools/validate_beta20_buffmanager.py
