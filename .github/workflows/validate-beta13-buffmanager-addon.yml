name: Validate Buff Manager Addon

on:
  pull_request:
    branches: [main]
    paths:
      - "RetreatUI/Core/WeakAuraBeta11Fixes.lua"
      - "RetreatUI/Core/WeakAuraBeta12Fixes.lua"
      - "RetreatUI/Core/WeakAuraBeta15StanceLane.lua"
      - "RetreatUI/Profiles/ElvUITargetDebuffs.lua"
      - "RetreatUI/Installer/TBCStyleInstaller.lua"
      - "RetreatUI/RetreatUI.toc"
      - "RetreatUI_Classes/RetreatUI_Classes.toc"
      - "RetreatUI_BuffManager/**"
      - ".github/workflows/publish-release.yml"
      - ".github/workflows/validate-beta13-buffmanager-addon.yml"
  push:
    branches: [main]
    paths:
      - "RetreatUI/Core/WeakAuraBeta11Fixes.lua"
      - "RetreatUI/Core/WeakAuraBeta12Fixes.lua"
      - "RetreatUI/Core/WeakAuraBeta15StanceLane.lua"
      - "RetreatUI/Profiles/ElvUITargetDebuffs.lua"
      - "RetreatUI/Installer/TBCStyleInstaller.lua"
      - "RetreatUI/RetreatUI.toc"
      - "RetreatUI_Classes/RetreatUI_Classes.toc"
      - "RetreatUI_BuffManager/**"
      - ".github/workflows/publish-release.yml"
      - ".github/workflows/validate-beta13-buffmanager-addon.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Validate standalone Buff Manager and final stance lane
        shell: bash
        run: |
          set -euo pipefail
          luac5.1 -p RetreatUI/Core/WeakAuraBeta11Fixes.lua
          luac5.1 -p RetreatUI/Core/WeakAuraBeta12Fixes.lua
          luac5.1 -p RetreatUI/Core/WeakAuraBeta15StanceLane.lua
          luac5.1 -p RetreatUI/Profiles/ElvUITargetDebuffs.lua
          luac5.1 -p RetreatUI/Installer/TBCStyleInstaller.lua
          luac5.1 -p RetreatUI_BuffManager/BuffManager.lua

          # Buff Manager is a real independent WoW addon with RetreatUI as its dependency.
          test -f RetreatUI_BuffManager/RetreatUI_BuffManager.toc
          grep -Fq '## Title: RetreatUI Buff Manager' RetreatUI_BuffManager/RetreatUI_BuffManager.toc
          grep -Fq '## Author: Retreat' RetreatUI_BuffManager/RetreatUI_BuffManager.toc
          grep -Fq '## Dependencies: RetreatUI' RetreatUI_BuffManager/RetreatUI_BuffManager.toc
          grep -Fq '## DefaultState: Disabled' RetreatUI_BuffManager/RetreatUI_BuffManager.toc
          grep -Fq 'BuffManager.lua' RetreatUI_BuffManager/RetreatUI_BuffManager.toc
          test ! -e RetreatUI/Core/BuffManager.lua
          ! grep -Fq 'BuffManager.lua' RetreatUI/RetreatUI.toc

          # beta.15 is the only final stance geometry authority.
          grep -Fq 'Core\WeakAuraBeta15StanceLane.lua' RetreatUI/RetreatUI.toc
          grep -Fq 'local LANE_FRAME = "RetreatUIWeakAuraTrinketLane"' RetreatUI/Core/WeakAuraBeta15StanceLane.lua
          grep -Fq 'local LANE_WIDTH = TRINKET_ICON * TRINKET_COUNT + TRINKET_SPACING * (TRINKET_COUNT - 1)' RetreatUI/Core/WeakAuraBeta15StanceLane.lua
          grep -Fq 'local LANE_X, LANE_Y = -17, 1' RetreatUI/Core/WeakAuraBeta15StanceLane.lua
          grep -Fq 'local STATE_ICON = 38' RetreatUI/Core/WeakAuraBeta15StanceLane.lua
          grep -Fq 'local STATE_GAP = 6' RetreatUI/Core/WeakAuraBeta15StanceLane.lua
          grep -Fq 'local STATE_ANCHOR_POINT = "BOTTOMRIGHT"' RetreatUI/Core/WeakAuraBeta15StanceLane.lua
          grep -Fq 'local STATE_SELF_POINT = "BOTTOMLEFT"' RetreatUI/Core/WeakAuraBeta15StanceLane.lua
          grep -Fq 'state.anchorFrameFrame = LANE_FRAME' RetreatUI/Core/WeakAuraBeta15StanceLane.lua
          grep -Fq 'state.xOffset = STATE_X' RetreatUI/Core/WeakAuraBeta15StanceLane.lua
          grep -Fq 'state.yOffset = STATE_Y' RetreatUI/Core/WeakAuraBeta15StanceLane.lua
          grep -Fq 'allClasses = true' RetreatUI/Core/WeakAuraBeta15StanceLane.lua
          grep -Fq 'allSpecs = true' RetreatUI/Core/WeakAuraBeta15StanceLane.lua
          grep -Fq 'Every State/Form icon must be 38x38 with no per-class offset' RetreatUI/Core/WeakAuraBeta15StanceLane.lua
          grep -Fq 'Deliberately do NOT call the older validation chain here' RetreatUI/Core/WeakAuraBeta15StanceLane.lua

          # Historical state leaves still remain locked to their invariant child geometry.
          grep -Fq 'local STATE_ICON_SIZE = 38' RetreatUI/Core/WeakAuraBeta11Fixes.lua
          grep -Fq 'local STATE_CHILD_X, STATE_CHILD_Y = 0, 0' RetreatUI/Core/WeakAuraBeta11Fixes.lua
          grep -Fq 'packageData.classGroups.target = nil' RetreatUI/Core/WeakAuraBeta12Fixes.lua
          grep -Fq 'local PRIORITY = "Blacklist,Personal"' RetreatUI/Profiles/ElvUITargetDebuffs.lua

          # Installer remains intentionally clean and does not own the optional Buff Manager.
          grep -Fq 'id="elvui", key="unitframes"' RetreatUI/Installer/TBCStyleInstaller.lua
          grep -Fq 'id="macros", custom="guardianMacros"' RetreatUI/Installer/TBCStyleInstaller.lua
          grep -Fq 'id="details", key="details"' RetreatUI/Installer/TBCStyleInstaller.lua
          grep -Fq 'id="turboplates", key="nameplates"' RetreatUI/Installer/TBCStyleInstaller.lua
          grep -Fq 'id="weakauras", key="classHUD"' RetreatUI/Installer/TBCStyleInstaller.lua
          ! grep -Fq 'key="buffManager"' RetreatUI/Installer/TBCStyleInstaller.lua

          # Release package must contain all three addon roots.
          grep -Fq 'cp -a RetreatUI_BuffManager dist/package/RetreatUI_BuffManager' .github/workflows/publish-release.yml
          grep -Fq 'zip -r "../$ASSET" RetreatUI RetreatUI_Classes RetreatUI_BuffManager' .github/workflows/publish-release.yml

          core_version="$(sed -n 's/^## Version:[[:space:]]*//p' RetreatUI/RetreatUI.toc | head -1 | tr -d '\r')"
          classes_version="$(sed -n 's/^## Version:[[:space:]]*//p' RetreatUI_Classes/RetreatUI_Classes.toc | head -1 | tr -d '\r')"
          buff_version="$(sed -n 's/^## Version:[[:space:]]*//p' RetreatUI_BuffManager/RetreatUI_BuffManager.toc | head -1 | tr -d '\r')"
          test "$core_version" = "1.1.7-beta.15"
          test "$core_version" = "$classes_version"
          test "$core_version" = "$buff_version"
