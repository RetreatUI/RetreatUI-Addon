name: Fetch RetreatUI Wago sources

on:
  push:
    branches:
      - main
    paths:
      - '.github/wago-audit-trigger'
      - '.github/workflows/fetch-wago-pux5f9apr-main.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout temporary research branch
        uses: actions/checkout@v4
        with:
          ref: temp/wago-fetch
          fetch-depth: 0

      - name: Download original Wago packages
        shell: bash
        run: |
          set -u
          ids=(PUx5f9aPr Y5UDib4zq TqH72U66p PUjOUxmPt)
          mkdir -p Research/Wago

          cat > /tmp/check.json <<'JSON'
          {"ids":["PUx5f9aPr","Y5UDib4zq","TqH72U66p","PUjOUxmPt"]}
          JSON

          status=$(curl -sSL --retry 5 --retry-delay 2 \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/check.json \
            -w '%{http_code}' \
            'https://data.wago.io/api/check/weakauras' \
            -o Research/Wago/metadata.json || printf 'curl_error')
          printf 'metadata_http=%s\n' "$status" > Research/Wago/fetch-status.txt

          for id in "${ids[@]}"; do
            mkdir -p "Research/Wago/$id"
            status=$(curl -sSL --retry 5 --retry-delay 2 \
              -w '%{http_code}' \
              "https://data.wago.io/api/raw/encoded?id=$id" \
              -o "Research/Wago/$id/export.txt" || printf 'curl_error')
            length=$(wc -c < "Research/Wago/$id/export.txt" 2>/dev/null || printf '0')
            prefix=$(head -c 12 "Research/Wago/$id/export.txt" 2>/dev/null || true)
            printf '%s_http=%s\n%s_length=%s\n%s_prefix=%q\n' "$id" "$status" "$id" "$length" "$id" "$prefix" >> Research/Wago/fetch-status.txt
          done

      - name: Commit fetched sources to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Research/Wago
          git commit -m 'Fetch RetreatUI Wago source exports' || exit 0
          git push origin HEAD:temp/wago-fetch
