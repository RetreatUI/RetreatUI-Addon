name: Fetch Wago PUx5f9aPr source

on:
  push:
    branches:
      - main
    paths:
      - '.github/wago-pux5f9apr-fetch-trigger'
      - '.github/workflows/fetch-wago-pux5f9apr-main.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary research branch
        uses: actions/checkout@v4
        with:
          ref: temp/wago-fetch
          fetch-depth: 0

      - name: Fetch Wago source and diagnostics
        shell: bash
        run: |
          set -u
          mkdir -p Research/Wago/PUx5f9aPr
          : > Research/Wago/PUx5f9aPr/http-status.txt

          fetch() {
            name="$1"
            url="$2"
            output="$3"
            code=$(curl -sSL --retry 3 --retry-delay 2 \
              -A 'Mozilla/5.0 RetreatUI integration audit' \
              -w '%{http_code}' \
              "$url" \
              -o "$output" || printf 'curl_error')
            printf '%s=%s\n' "$name" "$code" >> Research/Wago/PUx5f9aPr/http-status.txt
          }

          fetch raw_wago 'https://wago.io/api/raw/PUx5f9aPr' Research/Wago/PUx5f9aPr/export-wago.txt
          fetch raw_data 'https://data.wago.io/api/raw/PUx5f9aPr' Research/Wago/PUx5f9aPr/export-data.txt
          fetch check_api 'https://data.wago.io/api/check/weakauras?ids=PUx5f9aPr' Research/Wago/PUx5f9aPr/metadata.json
          fetch page 'https://wago.io/PUx5f9aPr' Research/Wago/PUx5f9aPr/page.html

          python - <<'PY'
          from pathlib import Path
          root = Path('Research/Wago/PUx5f9aPr')
          lines = [root.joinpath('http-status.txt').read_text(encoding='utf-8', errors='replace').strip()]
          for name in ('export-wago.txt', 'export-data.txt', 'metadata.json', 'page.html'):
              path = root / name
              data = path.read_text(encoding='utf-8', errors='replace') if path.exists() else ''
              lines.append(f'{name}: length={len(data)} prefix={data[:120]!r}')
          root.joinpath('summary.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit fetched diagnostics to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Research/Wago/PUx5f9aPr
          git commit -m 'Store Wago PUx5f9aPr fetch diagnostics' || exit 0
          git push origin HEAD:temp/wago-fetch
