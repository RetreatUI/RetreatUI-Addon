name: Fetch Wago PUx5f9aPr source

on:
  push:
    branches:
      - main
    paths:
      - '.github/wago-pux5f9apr-fetch-trigger'
      - '.github/workflows/fetch-wago-pux5f9apr-main.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary research branch
        uses: actions/checkout@v4
        with:
          ref: temp/wago-fetch
          fetch-depth: 0

      - name: Fetch Wago page and inspect client endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Research/Wago/PUx5f9aPr/js
          curl -sSL --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 RetreatUI integration audit' \
            'https://wago.io/PUx5f9aPr' \
            -o Research/Wago/PUx5f9aPr/page.html

          python - <<'PY'
          from pathlib import Path
          import re
          import urllib.request

          root = Path('Research/Wago/PUx5f9aPr')
          html = root.joinpath('page.html').read_text(encoding='utf-8', errors='replace')
          sources = re.findall(r'<script[^>]+src="([^"]+\.js)"', html)
          headers = {'User-Agent': 'Mozilla/5.0 RetreatUI integration audit'}
          snippets = []
          interesting = re.compile(r'(?i)(data\.wago\.io|/api/|weakaura|encoded|import|download|raw|slug|versions?)')
          endpoint = re.compile(r'(?i)(?:https://data\.wago\.io)?/[A-Za-z0-9_?&=./{}:$-]{3,160}')

          for index, src in enumerate(sources):
              url = src if src.startswith('http') else 'https://wago.io' + src
              req = urllib.request.Request(url, headers=headers)
              try:
                  data = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', errors='replace')
              except Exception as exc:
                  snippets.append(f'FETCH_ERROR {url}: {exc}')
                  continue
              name = f'{index:02d}-{Path(src).name}'
              root.joinpath('js', name).write_text(data, encoding='utf-8')
              seen = set()
              for match in interesting.finditer(data):
                  start = max(0, match.start() - 220)
                  end = min(len(data), match.end() + 320)
                  text = data[start:end].replace('\n', ' ')
                  if text not in seen:
                      seen.add(text)
                      snippets.append(f'### {name}\n{text}')
                      if len(seen) >= 80:
                          break

          root.joinpath('endpoint-snippets.txt').write_text('\n\n'.join(snippets), encoding='utf-8')
          root.joinpath('bundle-summary.txt').write_text(
              f'bundles={len(sources)}\nsnippets={len(snippets)}\n', encoding='utf-8'
          )
          PY

      - name: Commit client inspection to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Research/Wago/PUx5f9aPr
          git commit -m 'Inspect Wago client endpoints for PUx5f9aPr' || exit 0
          git push origin HEAD:temp/wago-fetch
