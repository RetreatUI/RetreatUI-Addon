name: Publish RetreatUI Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-manifest.json"
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retreatui-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, package and publish
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read and validate release manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=".github/release-manifest.json"
          [[ -f "$MANIFEST" ]] || { echo "Missing $MANIFEST"; exit 1; }
          PUBLISH="$(jq -r '.publish // false' "$MANIFEST")"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH" != "true" ]]; then exit 0; fi
          VERSION="$(jq -r '.version // empty' "$MANIFEST")"
          TITLE="$(jq -r '.title // empty' "$MANIFEST")"
          NOTES_FILE="$(jq -r '.notes_file // empty' "$MANIFEST")"
          PRERELEASE="$(jq -r '.prerelease // false' "$MANIFEST")"
          [[ -n "$VERSION" && -n "$TITLE" && -n "$NOTES_FILE" ]] || { echo "The manifest must contain version, title and notes_file."; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-((alpha|beta|rc)\.[0-9]+))?$ ]] || { echo "Unsupported version format: $VERSION"; exit 1; }
          [[ -f "$NOTES_FILE" ]] || { echo "Release notes file does not exist: $NOTES_FILE"; exit 1; }
          if [[ "$VERSION" == *-* && "$PRERELEASE" != "true" ]]; then exit 1; fi
          if [[ "$VERSION" != *-* && "$PRERELEASE" == "true" ]]; then exit 1; fi
          TAG="v$VERSION"
          ASSET="RetreatUI_v$VERSION.zip"
          CHECKSUM="$ASSET.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: No release requested
        if: steps.manifest.outputs.publish != 'true'
        run: echo "Manifest is configured with publish=false."

      - name: Validate addon versions
        if: steps.manifest.outputs.publish == 'true'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          read_toc_version() { sed -n 's/^## Version:[[:space:]]*//p' "$1" | head -n 1 | tr -d '\r'; }
          CORE_TOC="RetreatUI/RetreatUI.toc"
          CLASSES_TOC="RetreatUI_Classes/RetreatUI_Classes.toc"
          [[ -f "$CORE_TOC" && -f "$CLASSES_TOC" ]] || exit 1
          CORE_VERSION="$(read_toc_version "$CORE_TOC")"
          CLASSES_VERSION="$(read_toc_version "$CLASSES_TOC")"
          [[ "$CORE_VERSION" == "$CLASSES_VERSION" && "$CORE_VERSION" == "$EXPECTED_VERSION" ]] || exit 1

      - name: Inspect existing release
        if: steps.manifest.outputs.publish == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover existing release asset
        if: steps.manifest.outputs.publish == 'true' && steps.existing.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          ASSET: ${{ steps.manifest.outputs.asset }}
          CHECKSUM: ${{ steps.manifest.outputs.checksum }}
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir dist
          [[ -s "dist/$ASSET" ]] || exit 1
          (cd dist && sha256sum "$ASSET" > "$CHECKSUM")

      - name: Package new addon release
        if: steps.manifest.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          ASSET: ${{ steps.manifest.outputs.asset }}
          CHECKSUM: ${{ steps.manifest.outputs.checksum }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/package
          cp -a RetreatUI dist/package/RetreatUI
          cp -a RetreatUI_Classes dist/package/RetreatUI_Classes
          (cd dist/package && zip -r "../$ASSET" RetreatUI RetreatUI_Classes)
          [[ -s "dist/$ASSET" ]] || exit 1
          mapfile -t ROOTS < <(zipinfo -1 "dist/$ASSET" | awk -F/ 'NF { print $1 }' | sort -u)
          [[ "${#ROOTS[@]}" -eq 2 && "${ROOTS[0]}" == "RetreatUI" && "${ROOTS[1]}" == "RetreatUI_Classes" ]] || exit 1
          (cd dist && sha256sum "$ASSET" > "$CHECKSUM")

      - name: Upload workflow artifact
        if: steps.manifest.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.asset }}
          path: |
            dist/${{ steps.manifest.outputs.asset }}
            dist/${{ steps.manifest.outputs.checksum }}
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.manifest.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          TITLE: ${{ steps.manifest.outputs.title }}
          NOTES_FILE: ${{ steps.manifest.outputs.notes_file }}
          PRERELEASE: ${{ steps.manifest.outputs.prerelease }}
          ASSET: ${{ steps.manifest.outputs.asset }}
          CHECKSUM: ${{ steps.manifest.outputs.checksum }}
        run: |
          set -euo pipefail
          FLAGS=("$TAG" "dist/$ASSET" "dist/$CHECKSUM" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES_FILE")
          if [[ "$PRERELEASE" == "true" ]]; then FLAGS+=(--prerelease); else FLAGS+=(--latest); fi
          gh release create "${FLAGS[@]}"

      - name: Upload checksum to existing release
        if: steps.manifest.outputs.publish == 'true' && steps.existing.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          CHECKSUM: ${{ steps.manifest.outputs.checksum }}
        run: gh release upload "$TAG" "dist/$CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Write release summary
        if: steps.manifest.outputs.publish == 'true'
        run: |
          echo "## RetreatUI release verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.manifest.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Asset: ${{ steps.manifest.outputs.asset }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checksum: ${{ steps.manifest.outputs.checksum }}" >> "$GITHUB_STEP_SUMMARY"
