name: Publish RetreatUI Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-manifest.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retreatui-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read and validate release manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST=".github/release-manifest.json"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "Missing $MANIFEST"
            exit 1
          fi

          PUBLISH="$(jq -r '.publish // false' "$MANIFEST")"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          if [[ "$PUBLISH" != "true" ]]; then
            echo "Release publishing is disabled in the manifest. Nothing will be published."
            exit 0
          fi

          VERSION="$(jq -r '.version // empty' "$MANIFEST")"
          TITLE="$(jq -r '.title // empty' "$MANIFEST")"
          NOTES_FILE="$(jq -r '.notes_file // empty' "$MANIFEST")"
          PRERELEASE="$(jq -r '.prerelease // false' "$MANIFEST")"

          if [[ -z "$VERSION" || -z "$TITLE" || -z "$NOTES_FILE" ]]; then
            echo "The manifest must contain version, title and notes_file."
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-((alpha|beta|rc)\.[0-9]+))?$ ]]; then
            echo "Unsupported version format: $VERSION"
            echo "Examples: 1.0.11 or 1.0.12-beta.1"
            exit 1
          fi

          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Release notes file does not exist: $NOTES_FILE"
            exit 1
          fi

          if [[ "$VERSION" == *-* && "$PRERELEASE" != "true" ]]; then
            echo "A version with a prerelease suffix must use prerelease=true."
            exit 1
          fi

          if [[ "$VERSION" != *-* && "$PRERELEASE" == "true" ]]; then
            echo "A stable version must use prerelease=false."
            exit 1
          fi

          TAG="v$VERSION"
          ASSET="RetreatUI_v$VERSION.zip"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: No release requested
        if: steps.manifest.outputs.publish != 'true'
        run: echo "Manifest is configured with publish=false."

      - name: Validate addon versions
        if: steps.manifest.outputs.publish == 'true'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail

          read_toc_version() {
            sed -n 's/^## Version:[[:space:]]*//p' "$1" | head -n 1 | tr -d '\r'
          }

          CORE_TOC="RetreatUI/RetreatUI.toc"
          CLASSES_TOC="RetreatUI_Classes/RetreatUI_Classes.toc"

          [[ -f "$CORE_TOC" ]] || { echo "Missing $CORE_TOC"; exit 1; }
          [[ -f "$CLASSES_TOC" ]] || { echo "Missing $CLASSES_TOC"; exit 1; }

          CORE_VERSION="$(read_toc_version "$CORE_TOC")"
          CLASSES_VERSION="$(read_toc_version "$CLASSES_TOC")"

          if [[ "$CORE_VERSION" != "$CLASSES_VERSION" ]]; then
            echo "The addon folders use different versions: $CORE_VERSION and $CLASSES_VERSION"
            exit 1
          fi

          if [[ "$CORE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "The addon version is $CORE_VERSION, but the manifest requests $EXPECTED_VERSION"
            exit 1
          fi

      - name: Prevent duplicate tag or release
        if: steps.manifest.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 1
          fi

      - name: Package addon
        if: steps.manifest.outputs.publish == 'true'
        shell: bash
        env:
          ASSET: ${{ steps.manifest.outputs.asset }}
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist/package
          cp -a RetreatUI dist/package/RetreatUI
          cp -a RetreatUI_Classes dist/package/RetreatUI_Classes

          (
            cd dist/package
            zip -r "../$ASSET" RetreatUI RetreatUI_Classes
          )

          ASSET_PATH="dist/$ASSET"
          [[ -s "$ASSET_PATH" ]] || { echo "The release ZIP was not created."; exit 1; }

          mapfile -t ROOTS < <(zipinfo -1 "$ASSET_PATH" | awk -F/ 'NF { print $1 }' | sort -u)
          if [[ "${#ROOTS[@]}" -ne 2 || "${ROOTS[0]}" != "RetreatUI" || "${ROOTS[1]}" != "RetreatUI_Classes" ]]; then
            echo "The ZIP must contain exactly RetreatUI and RetreatUI_Classes at its root."
            printf 'Found root entries: %s\n' "${ROOTS[*]}"
            exit 1
          fi

          zipinfo -1 "$ASSET_PATH" | grep -q '^RetreatUI/RetreatUI\.toc$'
          zipinfo -1 "$ASSET_PATH" | grep -q '^RetreatUI_Classes/RetreatUI_Classes\.toc$'

      - name: Upload workflow artifact
        if: steps.manifest.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.asset }}
          path: dist/${{ steps.manifest.outputs.asset }}
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.manifest.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          TITLE: ${{ steps.manifest.outputs.title }}
          NOTES_FILE: ${{ steps.manifest.outputs.notes_file }}
          PRERELEASE: ${{ steps.manifest.outputs.prerelease }}
          ASSET: ${{ steps.manifest.outputs.asset }}
        run: |
          set -euo pipefail

          FLAGS=(
            "$TAG"
            "dist/$ASSET"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$TITLE"
            --notes-file "$NOTES_FILE"
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          else
            FLAGS+=(--latest)
          fi

          gh release create "${FLAGS[@]}"

      - name: Write release summary
        if: steps.manifest.outputs.publish == 'true'
        shell: bash
        run: |
          {
            echo "## RetreatUI release published"
            echo ""
            echo "- Version: ${{ steps.manifest.outputs.version }}"
            echo "- Tag: ${{ steps.manifest.outputs.tag }}"
            echo "- Asset: ${{ steps.manifest.outputs.asset }}"
            echo "- Pre-release: ${{ steps.manifest.outputs.prerelease }}"
          } >> "$GITHUB_STEP_SUMMARY"
