name: Publish RetreatUI Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-manifest.json"
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retreatui-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, package and publish
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read and validate release manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=".github/release-manifest.json"
          [[ -f "$MANIFEST" ]] || { echo "Missing $MANIFEST"; exit 1; }
          PUBLISH="$(jq -r '.publish // false' "$MANIFEST")"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH" != "true" ]]; then exit 0; fi
          VERSION="$(jq -r '.version // empty' "$MANIFEST")"
          TITLE="$(jq -r '.title // empty' "$MANIFEST")"
          NOTES_FILE="$(jq -r '.notes_file // empty' "$MANIFEST")"
          PRERELEASE="$(jq -r '.prerelease // false' "$MANIFEST")"
          [[ -n "$VERSION" && -n "$TITLE" && -n "$NOTES_FILE" ]] || { echo "The manifest must contain version, title and notes_file."; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-((alpha|beta|rc)\.[0-9]+))?$ ]] || { echo "Unsupported version format: $VERSION"; exit 1; }
          [[ -f "$NOTES_FILE" ]] || { echo "Release notes file does not exist: $NOTES_FILE"; exit 1; }
          if [[ "$VERSION" == *-* && "$PRERELEASE" != "true" ]]; then exit 1; fi
          if [[ "$VERSION" != *-* && "$PRERELEASE" == "true" ]]; then exit 1; fi
          TAG="v$VERSION"
          MAIN_ASSET="RetreatUI_v$VERSION.zip"
          MAIN_CHECKSUM="$MAIN_ASSET.sha256"
          BUFF_ASSET="RetreatUI_BuffManager_v$VERSION.zip"
          BUFF_CHECKSUM="$BUFF_ASSET.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "main_asset=$MAIN_ASSET" >> "$GITHUB_OUTPUT"
          echo "main_checksum=$MAIN_CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "buff_asset=$BUFF_ASSET" >> "$GITHUB_OUTPUT"
          echo "buff_checksum=$BUFF_CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: No release requested
        if: steps.manifest.outputs.publish != 'true'
        run: echo "Manifest is configured with publish=false."

      - name: Generate beta20 static WeakAuras payloads
        if: steps.manifest.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_beta20_weakauras_curated.py
          FILE="RetreatUI/Data/WeakAurasBeta20Payloads.lua"
          test -s "$FILE"
          test "$(grep -c '^RUI.NaowhCoAWeakAuras.classes\[' "$FILE")" -eq 21
          grep -Fq 'RUI.NaowhCoAWeakAuras.general = "!WA:2!' "$FILE"
          grep -Fq 'weakAurasVersion = "5.21.2"' "$FILE"
          grep -Fq 'generatedFor = "1.1.7-beta.20"' "$FILE"
          ! grep -Fq 'customGrow' "$FILE"
          ! grep -Fq 'custom_type' "$FILE"

      - name: Validate addon versions
        if: steps.manifest.outputs.publish == 'true'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          read_toc_version() { sed -n 's/^## Version:[[:space:]]*//p' "$1" | head -n 1 | tr -d '\r'; }
          CORE_TOC="RetreatUI/RetreatUI.toc"
          CLASSES_TOC="RetreatUI_Classes/RetreatUI_Classes.toc"
          BUFF_TOC="RetreatUI_BuffManager/RetreatUI_BuffManager.toc"
          [[ -f "$CORE_TOC" && -f "$CLASSES_TOC" && -f "$BUFF_TOC" ]] || exit 1
          CORE_VERSION="$(read_toc_version "$CORE_TOC")"
          CLASSES_VERSION="$(read_toc_version "$CLASSES_TOC")"
          BUFF_VERSION="$(read_toc_version "$BUFF_TOC")"
          [[ "$CORE_VERSION" == "$CLASSES_VERSION" && "$CORE_VERSION" == "$BUFF_VERSION" && "$CORE_VERSION" == "$EXPECTED_VERSION" ]] || exit 1

      - name: Inspect existing release
        if: steps.manifest.outputs.publish == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Recover existing release assets
        if: steps.manifest.outputs.publish == 'true' && steps.existing.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          MAIN_ASSET: ${{ steps.manifest.outputs.main_asset }}
          MAIN_CHECKSUM: ${{ steps.manifest.outputs.main_checksum }}
          BUFF_ASSET: ${{ steps.manifest.outputs.buff_asset }}
          BUFF_CHECKSUM: ${{ steps.manifest.outputs.buff_checksum }}
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$MAIN_ASSET" --dir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$BUFF_ASSET" --dir dist
          [[ -s "dist/$MAIN_ASSET" && -s "dist/$BUFF_ASSET" ]] || exit 1
          (cd dist && sha256sum "$MAIN_ASSET" > "$MAIN_CHECKSUM")
          (cd dist && sha256sum "$BUFF_ASSET" > "$BUFF_CHECKSUM")

      - name: Package new addon release
        if: steps.manifest.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          MAIN_ASSET: ${{ steps.manifest.outputs.main_asset }}
          MAIN_CHECKSUM: ${{ steps.manifest.outputs.main_checksum }}
          BUFF_ASSET: ${{ steps.manifest.outputs.buff_asset }}
          BUFF_CHECKSUM: ${{ steps.manifest.outputs.buff_checksum }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/main dist/buff
          cp -a RetreatUI dist/main/RetreatUI
          cp -a RetreatUI_Classes dist/main/RetreatUI_Classes
          (cd dist/main && zip -r "../$MAIN_ASSET" RetreatUI RetreatUI_Classes)
          cp -a RetreatUI_BuffManager dist/buff/RetreatUI_BuffManager
          (cd dist/buff && zip -r "../$BUFF_ASSET" RetreatUI_BuffManager)
          [[ -s "dist/$MAIN_ASSET" && -s "dist/$BUFF_ASSET" ]] || exit 1
          mapfile -t MAIN_ROOTS < <(zipinfo -1 "dist/$MAIN_ASSET" | awk -F/ 'NF { print $1 }' | sort -u)
          [[ "${#MAIN_ROOTS[@]}" -eq 2 && "${MAIN_ROOTS[0]}" == "RetreatUI" && "${MAIN_ROOTS[1]}" == "RetreatUI_Classes" ]] || exit 1
          mapfile -t BUFF_ROOTS < <(zipinfo -1 "dist/$BUFF_ASSET" | awk -F/ 'NF { print $1 }' | sort -u)
          [[ "${#BUFF_ROOTS[@]}" -eq 1 && "${BUFF_ROOTS[0]}" == "RetreatUI_BuffManager" ]] || exit 1
          (cd dist && sha256sum "$MAIN_ASSET" > "$MAIN_CHECKSUM")
          (cd dist && sha256sum "$BUFF_ASSET" > "$BUFF_CHECKSUM")

      - name: Upload workflow artifacts
        if: steps.manifest.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-${{ steps.manifest.outputs.version }}
          path: |
            dist/${{ steps.manifest.outputs.main_asset }}
            dist/${{ steps.manifest.outputs.main_checksum }}
            dist/${{ steps.manifest.outputs.buff_asset }}
            dist/${{ steps.manifest.outputs.buff_checksum }}
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.manifest.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          TITLE: ${{ steps.manifest.outputs.title }}
          NOTES_FILE: ${{ steps.manifest.outputs.notes_file }}
          PRERELEASE: ${{ steps.manifest.outputs.prerelease }}
          MAIN_ASSET: ${{ steps.manifest.outputs.main_asset }}
          MAIN_CHECKSUM: ${{ steps.manifest.outputs.main_checksum }}
          BUFF_ASSET: ${{ steps.manifest.outputs.buff_asset }}
          BUFF_CHECKSUM: ${{ steps.manifest.outputs.buff_checksum }}
        run: |
          set -euo pipefail
          FLAGS=("$TAG" "dist/$MAIN_ASSET" "dist/$MAIN_CHECKSUM" "dist/$BUFF_ASSET" "dist/$BUFF_CHECKSUM" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES_FILE")
          if [[ "$PRERELEASE" == "true" ]]; then FLAGS+=(--prerelease); else FLAGS+=(--latest); fi
          gh release create "${FLAGS[@]}"

      - name: Upload checksums to existing release
        if: steps.manifest.outputs.publish == 'true' && steps.existing.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          MAIN_CHECKSUM: ${{ steps.manifest.outputs.main_checksum }}
          BUFF_CHECKSUM: ${{ steps.manifest.outputs.buff_checksum }}
        run: gh release upload "$TAG" "dist/$MAIN_CHECKSUM" "dist/$BUFF_CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Write release summary
        if: steps.manifest.outputs.publish == 'true'
        run: |
          echo "## RetreatUI release verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.manifest.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Main CoA asset: ${{ steps.manifest.outputs.main_asset }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Optional Buff Manager asset: ${{ steps.manifest.outputs.buff_asset }}" >> "$GITHUB_STEP_SUMMARY"
