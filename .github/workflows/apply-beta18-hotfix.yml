name: Apply beta18 AdvancedHUD hotfix

on:
  push:
    branches:
      - agent/fix-chat-overlap-frame-spikes-beta18
    paths:
      - '.github/workflows/apply-beta18-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-chat-overlap-frame-spikes-beta18
          fetch-depth: 0

      - name: Patch high-frequency AdvancedHUD events
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('RetreatUI_Classes/AdvancedHUD.lua')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '      "SPELL_UPDATE_COOLDOWN", "ACTIONBAR_UPDATE_COOLDOWN", "UNIT_SPELLCAST_SUCCEEDED",',
                  '      "SPELL_UPDATE_COOLDOWN", "UNIT_SPELLCAST_SUCCEEDED",'
              ),
              (
                  '      "UNIT_POWER", "UNIT_POWER_FREQUENT", "UNIT_DISPLAYPOWER", "UNIT_POWER_BAR_SHOW", "UNIT_POWER_BAR_HIDE",',
                  '      "UNIT_POWER", "UNIT_DISPLAYPOWER", "UNIT_POWER_BAR_SHOW", "UNIT_POWER_BAR_HIDE",'
              ),
              (
                  '      if event == "UNIT_POWER" or event == "UNIT_POWER_FREQUENT" or event == "UNIT_DISPLAYPOWER"\n        or event == "UNIT_POWER_BAR_SHOW" or event == "UNIT_POWER_BAR_HIDE" then\n        if unit and unit ~= "player" then return end\n        if RUI.UpdatePrimaryPower then RUI:UpdatePrimaryPower(true) end\n        local playerAuras = ReadAura("player", false)\n        UpdateResource(playerAuras, false)\n        UpdateUsableGlowsOnly()\n        return\n      end',
                  '      if event == "UNIT_POWER" or event == "UNIT_DISPLAYPOWER"\n        or event == "UNIT_POWER_BAR_SHOW" or event == "UNIT_POWER_BAR_HIDE" then\n        if unit and unit ~= "player" then return end\n        if RUI.UpdatePrimaryPower then RUI:UpdatePrimaryPower(true) end\n        -- Do not scan all player auras on every power tick. Only classes with\n        -- a custom resource need an aura/resource read here; usable glows do\n        -- not require an aura scan.\n        if type(ResourceConfig()) == "table" then\n          UpdateResource(ReadAura("player", false), false)\n        end\n        UpdateUsableGlowsOnly()\n        return\n      end'
              ),
              (
                  '      if event == "SPELL_UPDATE_COOLDOWN" or event == "SPELL_UPDATE_CHARGES" or event == "ACTIONBAR_UPDATE_COOLDOWN" then\n        UpdateCooldownsOnly(); return\n      end',
                  '      if event == "SPELL_UPDATE_COOLDOWN" or event == "SPELL_UPDATE_CHARGES" then\n        -- Cooldown events must stay lightweight. Aura/proc state is owned by\n        -- UNIT_AURA; the 0.10s timer owns countdown text. This avoids full\n        -- aura scans and row refreshes on action-bar update storms.\n        UpdateCooldownTimersOnly()\n        UpdateUsableGlowsOnly()\n        return\n      end'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one AdvancedHUD match, found {count}: {old[:90]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/apply-beta18-hotfix.yml
          git config user.name "Retreat"
          git config user.email "actions@users.noreply.github.com"
          git add RetreatUI_Classes/AdvancedHUD.lua
          git commit -m "Throttle AdvancedHUD high-frequency events"
          git push origin HEAD:agent/fix-chat-overlap-frame-spikes-beta18
