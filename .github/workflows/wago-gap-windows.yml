name: Compare Wago HUD coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/wago-gap-windows-trigger'

permissions:
  contents: write

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout decoded research branch
        uses: actions/checkout@v4
        with:
          ref: temp/wago-fetch
          fetch-depth: 0

      - name: Build coverage reports
        shell: pwsh
        run: |
          @'
          const fs = require('fs');
          const path = require('path');

          const genericIds = new Set([5171, 8042, 193538, 121536, 158624, 121557, 800501]);
          const ignoreLabels = /missing|low|potion|pot_cd|mana$|energy$|dynamic|bars?$|core$|utility$|aspect$|pact$|felfury|second moon|sm \d+|ff \d+/i;

          function normalize(value) {
            return String(value || '')
              .replace(/[’`]/g, "'")
              .replace(/[_-]+/g, ' ')
              .replace(/\s+/g, ' ')
              .trim()
              .toLowerCase();
          }

          function currentCatalog(file) {
            const text = fs.readFileSync(file, 'utf8');
            const ids = new Set();
            for (const match of text.matchAll(/\b(?:id|spellID|auraID)\s*=\s*(\d+)/g)) ids.add(Number(match[1]));
            for (const match of text.matchAll(/\bspellIDs\s*=\s*\{([^}]*)\}/g)) {
              for (const number of match[1].match(/\d+/g) || []) ids.add(Number(number));
            }
            const names = new Set();
            for (const match of text.matchAll(/\b(?:name|buff)\s*=\s*"([^"]+)"/g)) names.add(normalize(match[1]));
            return { ids, names };
          }

          function allCandidateIds(display) {
            const result = new Set();
            for (const trigger of display.triggers || []) {
              const values = [trigger.spellId, trigger.spellName, trigger.name];
              for (const list of [trigger.spellIds, trigger.names, trigger.auranames]) {
                if (Array.isArray(list)) values.push(...list);
              }
              for (const value of values) {
                const number = Number(value);
                if (Number.isInteger(number) && number >= 1000 && !genericIds.has(number)) result.add(number);
              }
            }
            return [...result].sort((a, b) => a - b);
          }

          function report(slug, className, dataFile) {
            const displays = JSON.parse(fs.readFileSync(path.join('Research', 'Wago', slug, 'displays.json'), 'utf8'));
            const current = currentCatalog(dataFile);
            const rows = [];
            for (const display of displays) {
              if (!display.id || /group/.test(display.regionType || '')) continue;
              const ids = allCandidateIds(display);
              const missing = ids.filter(id => !current.ids.has(id));
              const nameKnown = current.names.has(normalize(display.id));
              if (!missing.length && (ids.length || nameKnown)) continue;
              if (!ids.length && (ignoreLabels.test(display.id) || nameKnown)) continue;
              rows.push({
                display: display.id,
                region: display.regionType,
                parent: display.parent,
                candidateIds: ids,
                missingIds: missing,
                nameKnown,
                triggers: (display.triggers || []).map(t => ({type:t.type,event:t.event,unit:t.unit,spellId:t.spellId,spellIds:t.spellIds,spellName:t.spellName,name:t.name,names:t.names,auranames:t.auranames})),
              });
            }
            fs.writeFileSync(path.join('Research', 'Wago', slug, 'gap-report.json'), JSON.stringify({className, currentIdCount:current.ids.size, currentNameCount:current.names.size, candidates:rows}, null, 2));
            fs.writeFileSync(path.join('Research', 'Wago', slug, 'gap-report.txt'), rows.map(row => `${row.display}\tids=${row.candidateIds.join(',')}\tmissing=${row.missingIds.join(',')}\tnameKnown=${row.nameKnown}\tparent=${row.parent}`).join('\n') + '\n');
          }

          report('Y5UDib4zq', 'Starcaller', 'RetreatUI_Classes/Starcaller/Data.lua');
          report('TqH72U66p', 'Felsworn', 'RetreatUI_Classes/Felsworn/Data.lua');

          const zg = JSON.parse(fs.readFileSync('Research/Wago/PUjOUxmPt/displays.json', 'utf8'));
          const categories = {personal:[], raid:[], timers:[], nameplates:[], circles:[], phase:[], other:[]};
          for (const display of zg) {
            if (!display.id || /group/.test(display.regionType || '')) continue;
            const triggers = display.triggers || [];
            const units = new Set(triggers.map(t => t.unit).filter(Boolean));
            let bucket = 'other';
            if (display.regionType === 'aurabar') bucket = 'timers';
            else if (units.has('raid')) bucket = 'raid';
            else if (units.has('player')) bucket = 'personal';
            else if (units.has('nameplate') || /mark|totem|spawn|bat rider/i.test(display.id)) bucket = 'nameplates';
            else if (display.regionType === 'progresstexture') bucket = 'circles';
            else if (/soon|phase|swap|disarm/i.test(display.id)) bucket = 'phase';
            categories[bucket].push({id:display.id, regionType:display.regionType, parent:display.parent, triggers});
          }
          fs.writeFileSync('Research/Wago/PUjOUxmPt/mechanics-summary.json', JSON.stringify(categories, null, 2));
          fs.writeFileSync('Research/Wago/PUjOUxmPt/mechanics-counts.txt', Object.entries(categories).map(([key,value]) => `${key}=${value.length}`).join('\n') + '\n');
          '@ | Set-Content -Encoding UTF8 compare-wago.cjs
          node compare-wago.cjs

      - name: Commit coverage reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Research/Wago
          git commit -m 'Compare Wago class and raid HUD coverage' || exit 0
          git push origin HEAD:temp/wago-fetch
