name: Publish RetreatUI beta.23

on:
  push:
    branches:
      - main
    paths:
      - '.github/beta23-publish-trigger'

permissions:
  contents: write

concurrency:
  group: publish-retreatui-beta23
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta.23
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate isolated recovery build
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '## Version: 1.1.2-beta.23' RetreatUI/RetreatUI.toc
          grep -Fq '## Version: 1.1.2-beta.23' RetreatUI_Classes/RetreatUI_Classes.toc
          grep -Fq 'Core\\RecoverySafety.lua' RetreatUI/RetreatUI.toc
          ! grep -Fq 'Core\\PartyUtility.lua' RetreatUI/RetreatUI.toc
          ! grep -Fq 'Core\\PartyUtilityV4.lua' RetreatUI/RetreatUI.toc
          test ! -e RetreatUI/Core/PartyUtility.lua
          test ! -e RetreatUI/Core/PartyUtilityV4.lua
          grep -Fq 'MP5 = {' RetreatUI/Core/BuffManager.lua
          grep -Fq 'RESOURCE_COST = {' RetreatUI/Core/BuffManager.lua
          grep -Fq 'Brutal Shout' RetreatUI/Core/BuffManager.lua
          grep -Fq 'Enduring Shout' RetreatUI/Core/BuffManager.lua
          grep -Fq 'Wild Blessing' RetreatUI/Core/BuffManager.lua

      - name: Validate Lua 5.1 syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find RetreatUI RetreatUI_Classes -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Package beta.23
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          zip -qr build/RetreatUI_v1.1.2-beta.23.zip RetreatUI RetreatUI_Classes
          python - <<'PY'
          import zipfile
          archive = 'build/RetreatUI_v1.1.2-beta.23.zip'
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              assert 'RetreatUI/Core/BuffManager.lua' in names
              assert 'RetreatUI/Core/RecoverySafety.lua' in names
              assert 'RetreatUI/Core/PartyUtility.lua' not in names
              assert 'RetreatUI/Core/PartyUtilityV4.lua' not in names
              buffs = z.read('RetreatUI/Core/BuffManager.lua').decode('utf-8')
              assert 'MP5 = {' in buffs
              assert 'RESOURCE_COST = {' in buffs
              assert all(name in buffs for name in ('Brutal Shout', 'Enduring Shout', 'Wild Blessing'))
          PY

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.2-beta.23'
          ASSET='build/RetreatUI_v1.1.2-beta.23.zip'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'RetreatUI v1.1.2-beta.23' \
            --notes $'- Restores only the verified Buff Manager catalog from beta.20 on the stable beta.22 recovery baseline.\n- Separates MP5 and resource-cost reduction.\n- Restores Brutal Shout, Enduring Shout, Wild Blessing and verified multi-effect raid buffs.\n- Party utility and interrupt tracking remain completely removed.' \
            --prerelease

      - name: Record verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.1.2-beta.23 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets > /tmp/release.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/release.json').read_text())
          assert data['tagName'] == 'v1.1.2-beta.23'
          assert data['isPrerelease'] is True
          names = [asset['name'] for asset in data.get('assets', [])]
          assert 'RetreatUI_v1.1.2-beta.23.zip' in names
          Path('BETA23_RELEASE_VERIFIED.txt').write_text(
              'tag=v1.1.2-beta.23\nprerelease=true\nasset=RetreatUI_v1.1.2-beta.23.zip\n',
              encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BETA23_RELEASE_VERIFIED.txt
          git commit -m 'Confirm beta.23 release asset'
          git push origin HEAD:main
