name: Publish RetreatUI v1.0.11

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'release/v1.0.11'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.11
      ZIP_NAME: RetreatUI_v1.0.11.zip
      PATCH_SHA256: 2fe8c7247fbe1143176ab8ac7d391ece435729ddb95a0116b1dd727afcae16dd

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 unzip zip patch

      - name: Download beta.22 base
        run: |
          mkdir -p base work
          gh release download v1.0.11-beta.22 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.22.zip' \
            --dir base
          test -f base/RetreatUI_v1.0.11-beta.22.zip
          unzip -q base/RetreatUI_v1.0.11-beta.22.zip -d work

      - name: Decode and apply official-release patch
        run: |
          base64 -d .release-v1.0.11/final.patch.gz.b64 | gzip -d > final.patch
          echo "$PATCH_SHA256  final.patch" | sha256sum -c -
          patch --batch --forward -p1 -d work < final.patch

      - name: Validate official release content
        run: |
          grep -Fq '## Version: 1.0.11' work/RetreatUI/RetreatUI.toc
          grep -Fq '## Version: 1.0.11' work/RetreatUI_Classes/RetreatUI_Classes.toc
          grep -Fq 'title = "RetreatUI v1.0.11"' work/RetreatUI/Core/Version.lua
          grep -Fq 'RETREATUI v1.0.11' work/RetreatUI/README.txt
          grep -Fq 'RETREATUI CLASSES v1.0.11' work/RetreatUI_Classes/README.txt
          grep -Fq 'command == "automation"' work/RetreatUI/Loader.lua
          grep -Fq 'function AutoRoleCheck:OpenOptions()' work/RetreatUI/Automation/AutoRoleCheck.lua
          grep -Fq 'name="Trail of Blood", id=804859' work/RetreatUI_Classes/Bloodmage/Data.lua
          grep -Fq 'name="Enraging Howl", id=504157' work/RetreatUI_Classes/Bloodmage/Data.lua
          grep -Fq 'auraNames = {"Scattered Stars", "Shattered Stars"}' work/RetreatUI_Classes/Starcaller/HUD.lua
          grep -Fq 'One generic effect-coverage planner is used for every class buff.' work/RetreatUI/Core/BuffManager.lua
          if grep -R -nE '1\.0\.11-beta|RetreatUI v1\.0\.11-beta|message == "debug"' \
              work/RetreatUI work/RetreatUI_Classes; then
            echo 'Beta or user-facing debug remnants remain in the official package.' >&2
            exit 1
          fi

      - name: Validate Lua 5.1 syntax
        run: |
          find work/RetreatUI work/RetreatUI_Classes -type f -name '*.lua' -print0 \
            | xargs -0 -n1 luac5.1 -p

      - name: Package addon
        run: |
          cd work
          zip -qr "../$ZIP_NAME" RetreatUI RetreatUI_Classes
          cd ..
          test -f "$ZIP_NAME"

      - name: Validate ZIP structure
        run: |
          python3 - <<'PY'
          import zipfile
          name = 'RetreatUI_v1.0.11.zip'
          with zipfile.ZipFile(name) as archive:
              roots = sorted({entry.split('/', 1)[0] for entry in archive.namelist() if entry})
              if roots != ['RetreatUI', 'RetreatUI_Classes']:
                  raise SystemExit(f'Unexpected ZIP roots: {roots}')
              core = archive.read('RetreatUI/RetreatUI.toc').decode('utf-8')
              classes = archive.read('RetreatUI_Classes/RetreatUI_Classes.toc').decode('utf-8')
              changelog = archive.read('RetreatUI/CHANGELOG.txt').decode('utf-8')
              loader = archive.read('RetreatUI/Loader.lua').decode('utf-8')
              assert '## Version: 1.0.11' in core
              assert '## Version: 1.0.11' in classes
              assert changelog.startswith('RetreatUI v1.0.11\n')
              assert 'command == "automation"' in loader
              assert not any(entry.startswith('.github/') or '.release-' in entry for entry in archive.namelist())
          PY
          sha256sum "$ZIP_NAME"

      - name: Prepare release notes
        run: |
          cat > release-notes.md <<'EOF'
          RetreatUI v1.0.11 is a major class HUD, Buff Manager and integration update for Conquest of Azeroth.

          ## Highlights
          - Expanded and refined learned-only HUD tracking across all 21 supported classes.
          - Rebuilt Buff Manager coverage around equivalent effects and exclusive buff families, with improved automatic assignments and migrations.
          - Added clearer class resources and active proc tracking, including Starcaller's target-bound Scattered Stars display and expanded Bloodmage support.
          - Improved TurboPlates mana-enemy coloring, movable class elements, layout safety and ElvUI profile preservation.
          - Added native Auto Accept Role Checks with a saved toggle and direct `/rui automation` access.

          ## Updating
          Delete the old `RetreatUI` and `RetreatUI_Classes` folders, then install both folders from this ZIP together. Existing RetreatUI profiles, assignments and managed positions migrate automatically; no reset command is required.
          EOF

      - name: Publish official GitHub release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'RetreatUI v1.0.11' \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG" "$ZIP_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'RetreatUI v1.0.11' \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-artifact
          path: RetreatUI_v1.0.11.zip
          if-no-files-found: error
