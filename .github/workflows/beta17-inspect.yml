name: Apply beta17 implementation

on:
  push:
    branches:
      - feature/beta17-hud-editor-runemaster
    paths:
      - ".github/beta17-patch/ready"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beta17-hud-editor-runemaster
          fetch-depth: 0
      - name: Apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/beta17-patch/part-* | tr -d '\n' | base64 -d > /tmp/beta17.patch
          git apply --check /tmp/beta17.patch
          git apply /tmp/beta17.patch
          rm -rf .github/beta17-patch
          rm -f .github/workflows/beta17-inspect.yml
          git config user.name "RetreatUI"
          git config user.email "retreatui@users.noreply.github.com"
          git add -A
          git commit -m "Build RetreatUI v1.1.0-beta.17"
          git push origin HEAD:feature/beta17-hud-editor-runemaster
