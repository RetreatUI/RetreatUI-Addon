name: Beta17 inspect

on:
  push:
    branches:
      - feature/beta17-hud-editor-runemaster
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print relevant tree
        shell: bash
        run: |
          echo '=== TREE ==='
          find RetreatUI RetreatUI_Classes -maxdepth 4 -type f | sort
          echo '=== CLASS REGISTRATION ==='
          grep -RniE 'RegisterClass|classModules|Register.*Module|supportedClasses|classDatabase' RetreatUI RetreatUI_Classes | head -n 300 || true
          echo '=== RUNES ==='
          grep -RniE 'rune|inscribed' RetreatUI RetreatUI_Classes | head -n 300 || true
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: beta17-source
          path: |
            RetreatUI
            RetreatUI_Classes
            .github/workflows/validate-and-publish.yml
          include-hidden-files: true
