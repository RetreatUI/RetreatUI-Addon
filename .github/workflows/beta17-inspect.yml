name: Diagnose beta17 patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beta17-hud-editor-runemaster
      - name: Inspect patch payload
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/beta17-patch/part-*; do
            printf '%s\t' "$file"
            wc -c < "$file"
          done
          cat .github/beta17-patch/part-* | tr -d '\n' > /tmp/beta17.b64
          echo "combined bytes: $(wc -c < /tmp/beta17.b64)"
          echo "combined modulo 4: $(( $(wc -c < /tmp/beta17.b64) % 4 ))"
          sha256sum /tmp/beta17.b64
          LC_ALL=C grep -n '[^A-Za-z0-9+/=]' /tmp/beta17.b64 | head -n 20 || true
          head -c 32 /tmp/beta17.b64; echo
          tail -c 32 /tmp/beta17.b64; echo
