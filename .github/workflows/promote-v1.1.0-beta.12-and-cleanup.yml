name: Promote RetreatUI v1.1.0-beta.12 and clean repository

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-v1.1.0-beta.12-and-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: retreatui-beta12-promotion-cleanup
  cancel-in-progress: false

jobs:
  promote-and-clean:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_VERSION: 1.1.0-beta.11
      BASE_TAG: v1.1.0-beta.11
      BASE_ZIP: RetreatUI_v1.1.0-beta.11.zip
      VERSION: 1.1.0-beta.12
      TAG: v1.1.0-beta.12
      ZIP_NAME: RetreatUI_v1.1.0-beta.12.zip
      MANIFEST_NAME: RetreatUI_manifest.json
      STABLE_TAG: v1.0.11
      ROLLBACK_TAG: v1.1.0-beta.10.2
      WORKFLOW_PATH: .github/workflows/promote-v1.1.0-beta.12-and-cleanup.yml

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the published beta.11 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/base build/source build/published
          gh release download "$BASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$BASE_ZIP" \
            --pattern "$MANIFEST_NAME" \
            --dir build/base
          unzip -q "build/base/$BASE_ZIP" -d build/source
          test -f build/source/RetreatUI/RetreatUI.toc
          test -f build/source/RetreatUI_Classes/RetreatUI_Classes.toc

      - name: Apply beta.12 fixes and version migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('build/source')
          old = '1.1.0-beta.11'
          new = '1.1.0-beta.12'

          trackers = list(root.rglob('TrinketTracker.lua'))
          if len(trackers) != 1:
              raise SystemExit(f'Expected exactly one TrinketTracker.lua, found: {trackers}')
          tracker = trackers[0]
          text = tracker.read_text(encoding='utf-8')
          matches = list(re.finditer(r'(?m)^(?P<indent>\s*)(?P<var>[A-Za-z_][A-Za-z0-9_\.]*)\:SetScript\("OnEnter"', text))
          if not matches:
              raise SystemExit('No OnEnter tooltip handler found in TrinketTracker.lua')
          inserted = 0
          offset = 0
          for match in matches:
              var = match.group('var')
              if f'{var}:EnableMouse(true)' in text:
                  continue
              pos = match.start() + offset
              line = f"{match.group('indent')}{var}:EnableMouse(true)\n"
              text = text[:pos] + line + text[pos:]
              offset += len(line)
              inserted += 1
          if inserted == 0 and 'EnableMouse(true)' not in text:
              raise SystemExit('Failed to enable mouse input for trinket tooltips')
          tracker.write_text(text, encoding='utf-8')

          profile = root / 'RetreatUI' / 'Profiles' / 'ElvUI.lua'
          profile_text = profile.read_text(encoding='utf-8')
          pattern = re.compile(r'(?m)^(?P<indent>\s*)ElvUF_TargetTargetMover\s*=\s*"[^"]*",\s*$')
          replacement = r'\g<indent>ElvUF_TargetTargetMover = "TOPLEFT,ElvUF_TargetMover,TOPRIGHT,8,0",'
          profile_text, count = pattern.subn(replacement, profile_text, count=1)
          if count != 1:
              raise SystemExit('Could not replace the target-of-target mover baseline')
          profile.write_text(profile_text, encoding='utf-8')

          version_hits = 0
          for folder in (root / 'RetreatUI', root / 'RetreatUI_Classes'):
              for path in folder.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.lua', '.toc', '.xml'}:
                      continue
                  data = path.read_text(encoding='utf-8')
                  if old in data:
                      hits = data.count(old)
                      path.write_text(data.replace(old, new), encoding='utf-8')
                      version_hits += hits
          if version_hits == 0:
              raise SystemExit('No beta.11 version strings were migrated')

          for toc in (
              root / 'RetreatUI' / 'RetreatUI.toc',
              root / 'RetreatUI_Classes' / 'RetreatUI_Classes.toc',
          ):
              data = toc.read_text(encoding='utf-8')
              match = re.search(r'(?m)^## Version:\s*(.+?)\s*$', data)
              if not match or match.group(1) != new:
                  raise SystemExit(f'Incorrect version in {toc}: {match.group(1) if match else "missing"}')

          if 'ElvUF_TargetTargetMover = "TOPLEFT,ElvUF_TargetMover,TOPRIGHT,8,0"' not in profile.read_text(encoding='utf-8'):
              raise SystemExit('Target-of-target is not target-relative after patching')
          if 'EnableMouse(true)' not in tracker.read_text(encoding='utf-8'):
              raise SystemExit('Trinket tooltip mouse fix is missing')

          print(f'Patched {tracker}')
          print(f'Migrated {version_hits} version strings')
          PY

      - name: Validate Lua and package structure
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find build/source/RetreatUI build/source/RetreatUI_Classes \
            -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          grep -q '^## Version: 1.1.0-beta.12$' build/source/RetreatUI/RetreatUI.toc
          grep -q '^## Version: 1.1.0-beta.12$' build/source/RetreatUI_Classes/RetreatUI_Classes.toc

      - name: Replace main with the current complete addon source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf RetreatUI RetreatUI_Classes
          cp -a build/source/RetreatUI ./RetreatUI
          cp -a build/source/RetreatUI_Classes ./RetreatUI_Classes

          find . -maxdepth 1 -type d \
            \( -name '.release-*' -o -name '.patch-*' -o -name '.inspect-*' -o -name '.analysis-*' \) \
            -print0 | xargs -0 -r rm -rf

          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
            ! -name 'publish-release.yml' \
            ! -name 'promote-v1.1.0-beta.12-and-cleanup.yml' \
            -delete

          python3 - <<'PY'
          from pathlib import Path
          import re

          readme = Path('README.md')
          if readme.exists():
              text = readme.read_text(encoding='utf-8')
              text = text.replace('RetreatUI v1.0.10 includes HUD support', 'RetreatUI v1.1.0 includes HUD support')
              replacement = '''## Current Release

**RetreatUI v1.1.0-beta.12**

This beta promotes the complete current addon source to `main`, fixes trinket tooltips, and anchors target-of-target relative to the target frame while preserving the supplied ElvUI profile as a one-time baseline.

---'''
              text, count = re.subn(r'## Current Release\n.*?\n---', replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit('Could not update the README Current Release section')
              readme.write_text(text, encoding='utf-8')

          manifest = Path('.github/release-manifest.json')
          manifest.write_text('''{
  "publish": false,
  "version": "1.1.0-beta.12",
  "title": "RetreatUI v1.1.0-beta.12",
  "notes_file": "RELEASE_NOTES.md",
  "prerelease": true
}
''', encoding='utf-8')
          PY

          git config user.name "RetreatUI"
          git config user.email "gaarn94@gmail.com"
          git add -A
          git commit -m "Promote RetreatUI v1.1.0-beta.12 source"
          git push origin HEAD:main
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build beta.12 release and launcher manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$ZIP_NAME" "$MANIFEST_NAME" release-notes.md
          zip -qr "$ZIP_NAME" RetreatUI RetreatUI_Classes
          unzip -t "$ZIP_NAME"
          mapfile -t ROOTS < <(zipinfo -1 "$ZIP_NAME" | awk -F/ 'NF {print $1}' | sort -u)
          if [[ "${#ROOTS[@]}" -ne 2 || "${ROOTS[0]}" != "RetreatUI" || "${ROOTS[1]}" != "RetreatUI_Classes" ]]; then
            printf 'Invalid ZIP roots: %s\n' "${ROOTS[*]}"
            exit 1
          fi

          ZIP_SHA256="$(sha256sum "$ZIP_NAME" | awk '{print $1}')"
          export ZIP_SHA256
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          base = Path('build/base') / os.environ['MANIFEST_NAME']
          data = json.loads(base.read_text(encoding='utf-8-sig'))
          version = os.environ['VERSION']
          tag = os.environ['TAG']
          asset = os.environ['ZIP_NAME']
          digest = os.environ['ZIP_SHA256']

          data['version'] = version
          data['tag'] = tag
          data['asset'] = asset
          data['sha256'] = digest
          if 'tag_name' in data: data['tag_name'] = tag
          if 'asset_name' in data: data['asset_name'] = asset
          if 'filename' in data: data['filename'] = asset
          if 'prerelease' in data: data['prerelease'] = True
          if 'channel' in data: data['channel'] = 'beta'

          channels = data.setdefault('channels', {})
          beta = channels.setdefault('beta', {})
          beta.update({'version': version, 'tag': tag, 'asset': asset, 'sha256': digest})
          release = channels.setdefault('release', {})
          release.setdefault('version', '1.0.11')
          release.setdefault('tag', 'v1.0.11')
          release.setdefault('asset', 'RetreatUI_v1.0.11.zip')

          Path(os.environ['MANIFEST_NAME']).write_text(
              json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python3 -m json.tool "$MANIFEST_NAME" >/dev/null

          cat > release-notes.md <<'MD'
          ## RetreatUI v1.1.0-beta.12

          ### Fixes
          - Enables mouse input on the Trinket Tracker icons, restoring the native item tooltips.
          - Anchors target-of-target directly to the target mover, so the supplied ElvUI baseline scales correctly across different logical screen widths.

          ### Source baseline
          - Promotes the complete current RetreatUI and RetreatUI_Classes source to the main branch.
          - Keeps the supplied ElvUI export as a one-time baseline without forcing personal ElvUI settings again on every login.
          - Preserves the beta.10.2 HUD rollback, Party Interrupt Tracker placement, trinket tracking, class HUDs and build profiles.
          MD

      - name: Publish and verify beta.12
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" "$MANIFEST_NAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "RetreatUI v$VERSION" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$TAG" "$ZIP_NAME" "$MANIFEST_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "RetreatUI v$VERSION" \
              --notes-file release-notes.md \
              --prerelease
          fi

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ZIP_NAME" \
            --pattern "$MANIFEST_NAME" \
            --dir build/published
          cmp "$ZIP_NAME" "build/published/$ZIP_NAME"
          cmp "$MANIFEST_NAME" "build/published/$MANIFEST_NAME"
          unzip -t "build/published/$ZIP_NAME"

      - name: Remove obsolete releases, tags, branches, artifacts and runs
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          current_run="$GITHUB_RUN_ID"

          gh api --paginate "repos/$repo/releases?per_page=100" | jq -s '[.[][]]' > /tmp/releases.json
          jq -r --arg stable "$STABLE_TAG" --arg rollback "$ROLLBACK_TAG" --arg current "$TAG" \
            '.[] | select(.tag_name != $stable and .tag_name != $rollback and .tag_name != $current) | .tag_name' \
            /tmp/releases.json > /tmp/releases-to-delete.txt
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            gh release delete "$tag" --repo "$repo" --yes --cleanup-tag || true
          done < /tmp/releases-to-delete.txt

          gh api --paginate "repos/$repo/git/matching-refs/tags/" --jq '.[].ref' \
            | sed 's#^refs/tags/##' > /tmp/tags.txt
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            case "$tag" in
              "$STABLE_TAG"|"$ROLLBACK_TAG"|"$TAG") continue ;;
            esac
            encoded="$(jq -rn --arg v "$tag" '$v|@uri')"
            gh api --silent -X DELETE "repos/$repo/git/refs/tags/$encoded" || true
          done < /tmp/tags.txt

          gh api --paginate "repos/$repo/pulls?state=open&per_page=100" --jq '.[].number' > /tmp/open-prs.txt
          while IFS= read -r number; do
            [[ -z "$number" ]] && continue
            gh api --silent -X PATCH "repos/$repo/pulls/$number" -f state=closed || true
          done < /tmp/open-prs.txt

          gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name' > /tmp/branches.txt
          while IFS= read -r branch; do
            [[ -z "$branch" || "$branch" == "main" ]] && continue
            encoded="$(jq -rn --arg v "$branch" '$v|@uri')"
            gh api --silent -X DELETE "repos/$repo/git/refs/heads/$encoded" || true
          done < /tmp/branches.txt

          gh api --paginate "repos/$repo/actions/artifacts?per_page=100" | jq -s -r '.[].artifacts[].id' > /tmp/artifacts.txt
          if [[ -s /tmp/artifacts.txt ]]; then
            xargs -r -n1 -P8 -I{} sh -c 'gh api --silent -X DELETE "repos/'"$repo"'/actions/artifacts/{}" || true' < /tmp/artifacts.txt
          fi

          gh api --paginate "repos/$repo/actions/runs?per_page=100" | jq -s -r --arg current "$current_run" \
            '.[].workflow_runs[] | select((.id|tostring) != $current) | .id' > /tmp/runs.txt
          if [[ -s /tmp/runs.txt ]]; then
            xargs -r -n1 -P6 -I{} sh -c 'gh api --silent -X DELETE "repos/'"$repo"'/actions/runs/{}" || true' < /tmp/runs.txt
          fi

          gh api --paginate "repos/$repo/actions/workflows?per_page=100" | jq -s '[.[].workflows[]]' > /tmp/workflows.json
          jq -r '.[] | select(.path != ".github/workflows/publish-release.yml" and .path != ".github/workflows/promote-v1.1.0-beta.12-and-cleanup.yml") | .id' \
            /tmp/workflows.json > /tmp/workflows-to-disable.txt
          while IFS= read -r workflow_id; do
            [[ -z "$workflow_id" ]] && continue
            gh api --silent -X PUT "repos/$repo/actions/workflows/$workflow_id/disable" || true
          done < /tmp/workflows-to-disable.txt

      - name: Remove this temporary workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm "$WORKFLOW_PATH"
          git commit -m "Remove completed beta.12 maintenance workflow"
          git push origin HEAD:main

          current_workflow_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
            | jq -r '.workflows[] | select(.path == ".github/workflows/promote-v1.1.0-beta.12-and-cleanup.yml") | .id' \
            | head -n1)"
          if [[ -n "$current_workflow_id" ]]; then
            gh api --silent -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$current_workflow_id/disable" || true
          fi

      - name: Write final summary
        shell: bash
        run: |
          {
            echo "## RetreatUI beta.12 promotion complete"
            echo ""
            echo "- Main source: $SOURCE_SHA"
            echo "- Current beta: $TAG"
            echo "- Stable retained: $STABLE_TAG"
            echo "- Rollback retained: $ROLLBACK_TAG"
            echo "- Old branches, prereleases, tags, artifacts and workflow runs removed"
          } >> "$GITHUB_STEP_SUMMARY"
