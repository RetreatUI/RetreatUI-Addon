name: Verify RetreatUI v1.1.2-beta.20 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-v1.1.2-beta.20.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify pre-release and ZIP asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.1.2-beta.20 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,assets > /tmp/release.json
          python - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path('/tmp/release.json').read_text(encoding='utf-8'))
          assert release['tagName'] == 'v1.1.2-beta.20', release
          assert release['isPrerelease'] is True, release
          names = sorted(asset['name'] for asset in release.get('assets', []))
          assert 'RetreatUI_v1.1.2-beta.20.zip' in names, names
          Path('.beta20-release-verified').write_text(
              'tag=v1.1.2-beta.20\nprerelease=true\nasset=RetreatUI_v1.1.2-beta.20.zip\n',
              encoding='utf-8'
          )
          PY

      - name: Commit verification marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .beta20-release-verified
          git commit -m 'Confirm beta.20 release asset is published'
          git push origin HEAD:main
