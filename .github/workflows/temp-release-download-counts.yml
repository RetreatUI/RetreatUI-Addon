name: Temporary release download counts

on:
  push:
    branches:
      - temp/release-download-counts
    paths:
      - ".github/workflows/temp-release-download-counts.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temp-release-download-counts.yml"

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch release asset download counts
        shell: bash
        run: |
          set -euo pipefail
          for tag in v1.1.0-beta.15 v1.1.0-beta.16; do
            echo "=== $tag ==="
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              | jq -r '.assets[] | [.name, .download_count] | @tsv'
          done
