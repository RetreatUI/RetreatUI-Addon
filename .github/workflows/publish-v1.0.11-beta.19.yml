name: Publish RetreatUI v1.0.11-beta.19

on:
  pull_request:
    branches: [main]
    paths: [".release-v1.0.11-beta.19/trigger-pr"]

permissions:
  contents: write

concurrency:
  group: publish-retreatui-v1.0.11-beta.19
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build beta.19 from beta.18
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/base build/source
          gh release download v1.0.11-beta.18 --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.18.zip' --dir build/base
          unzip -q build/base/RetreatUI_v1.0.11-beta.18.zip -d build/source
          cat .release-v1.0.11-beta.19/beta19.patch.gz.b64.part{1,2,3,4} | base64 -d > beta19.patch.gz
          echo '1b42ee104bcd065487b6175b6dd5d2557065e46a4432c6431e20eb90d9197d26  beta19.patch.gz' | sha256sum -c -
          gzip -dc beta19.patch.gz > beta19.patch
          git apply --check -p1 --directory=build/source beta19.patch
          git apply -p1 --directory=build/source beta19.patch

      - name: Validate Lua and Starcaller semantics
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find build/source/RetreatUI build/source/RetreatUI_Classes -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          python - <<'PY'
          from pathlib import Path
          root = Path('build/source')
          data = (root/'RetreatUI_Classes/Starcaller/Data.lua').read_text()
          hud = (root/'RetreatUI_Classes/Starcaller/HUD.lua').read_text()
          curated = (root/'RetreatUI_Classes/WagoCurated.lua').read_text()
          turbo = (root/'RetreatUI/Integrations/TurboPlates.lua').read_text()
          checks = {
            'versions': all('## Version: 1.0.11-beta.19' in (root/p).read_text() for p in ['RetreatUI/RetreatUI.toc','RetreatUI_Classes/RetreatUI_Classes.toc']),
            '8 segment target resource': 'targetResource = {title="SCATTERED STARS"' in data and 'maximum=8' in data,
            'three IDs': all(str(i) in data and str(i) in hud for i in (804378,254271,807301)),
            'old mixed resource removed': 'nativeResource = {title="LUNAR STATE"' not in data,
            'own target aura': 'UnitDebuff("target", index)' in hud and 'IsOwnCaster' in hud and 'PLAYER_TARGET_CHANGED' in hud,
            'safe layout': 'y = -118' in hud and 'labelY = -136' in hud and 'current >= 4' in hud,
            'curated resource records': curated.count('targetResource=true, maxStacks=8') == 3 and 'record.targetDebuff = nil' in curated,
            'Lunar Charge proc': '{name="Lunar Charge", id=680215}' in curated,
            'silent validated TurboPlates': 'ReportTargetManaDiagnostic' not in turbo and 'synthetic_100_pool' in turbo and 'non_mana_class' in turbo,
          }
          for name, ok in checks.items(): print(('PASS' if ok else 'FAIL') + ': ' + name)
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise RuntimeError(', '.join(failed))
          PY
          cat > /tmp/test_starcaller.lua <<'LUA'
          local databases = {}
          RetreatUI = {}
          function RetreatUI:GetClassSpellDatabase(name)
            databases[name] = databases[name] or {spells={}}
            return databases[name]
          end
          dofile('build/source/RetreatUI_Classes/WagoCurated.lua')
          local db = assert(databases['Starcaller'])
          local idsWanted = {[804378]=true,[254271]=true,[807301]=true}
          local resources, lunarCharge = 0, false
          for _, record in ipairs(db.spells or {}) do
            local id = tonumber(record.id)
            if record.targetResource then
              resources = resources + 1
              assert(idsWanted[id], 'unexpected target resource')
              assert(record.targetDebuff == nil, 'resource leaked into target debuffs')
              assert(tonumber(record.maxStacks) == 8, 'wrong maximum')
              idsWanted[id] = nil
            end
            if id and (id == 804378 or id == 254271 or id == 807301) then
              assert(record.targetDebuff == nil, 'Scattered/Shattered ID remains a target debuff')
            end
            if record.name == 'Lunar Charge' and record.auraTracker then lunarCharge = true end
          end
          assert(resources == 3 and next(idsWanted) == nil, 'missing target resource variant')
          assert(lunarCharge, 'Lunar Charge missing from Procs/Buffs')
          print('PASS: Starcaller curated semantics')
          LUA
          lua5.1 /tmp/test_starcaller.lua

      - name: Package and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd build/source
          zip -qr ../RetreatUI_v1.0.11-beta.19.zip RetreatUI RetreatUI_Classes
          cd ../..
          python - <<'PY'
          import zipfile
          p='build/RetreatUI_v1.0.11-beta.19.zip'
          with zipfile.ZipFile(p) as z:
            roots=sorted({n.split('/',1)[0] for n in z.namelist() if n})
            assert roots == ['RetreatUI','RetreatUI_Classes'], roots
            assert 'maximum=8' in z.read('RetreatUI_Classes/Starcaller/Data.lua').decode()
            assert 'UnitDebuff("target", index)' in z.read('RetreatUI_Classes/Starcaller/HUD.lua').decode()
          print('PASS: ZIP')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.19
          path: build/RetreatUI_v1.0.11-beta.19.zip
          if-no-files-found: error

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.0.11-beta.19'; ASSET='build/RetreatUI_v1.0.11-beta.19.zip'
          NOTES=$'- Added an 8-segment target-bound Scattered Stars tracker for Starcaller.\n- Reads the player-owned target aura and resets on target changes.\n- Removed all three Scattered/Shattered IDs from target-frame debuffs.\n- Lunar Phase and Lunar Charge remain in Procs/Buffs.\n- Preserved beta.18 TurboPlates and Buff Manager behavior.'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title 'RetreatUI v1.0.11-beta.19' --notes "$NOTES" --prerelease
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --title 'RetreatUI v1.0.11-beta.19' --notes "$NOTES" --prerelease
          fi
