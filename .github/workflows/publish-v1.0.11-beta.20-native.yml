name: Publish RetreatUI v1.0.11-beta.20

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-v1.0.11-beta.20-native/trigger-pr"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-v1.0.11-beta.20
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download beta.19 package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/base build/source
          gh release download v1.0.11-beta.19 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.19.zip' \
            --dir build/base
          unzip -q build/base/RetreatUI_v1.0.11-beta.19.zip -d build/source
          test -f build/source/RetreatUI/RetreatUI.toc
          test -f build/source/RetreatUI_Classes/RetreatUI_Classes.toc

      - name: Build beta.20 source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/build_beta20.py <<'PY'
          from pathlib import Path
          import re

          root = Path('build/source')
          core_toc = root / 'RetreatUI/RetreatUI.toc'
          classes_toc = root / 'RetreatUI_Classes/RetreatUI_Classes.toc'

          def set_version(path):
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(r'(?m)^## Version:\s*.*$', '## Version: 1.0.11-beta.20', text, count=1)
              if count != 1:
                  raise RuntimeError('Version header missing: ' + str(path))
              path.write_text(text, encoding='utf-8')

          set_version(core_toc)
          set_version(classes_toc)

          version_file = root / 'RetreatUI/Core/Version.lua'
          if version_file.exists():
              text = version_file.read_text(encoding='utf-8').replace('1.0.11-beta.19', '1.0.11-beta.20')
              version_file.write_text(text, encoding='utf-8')

          for changelog in (root / 'RetreatUI/CHANGELOG.txt', root / 'CHANGELOG.txt'):
              if changelog.exists():
                  old = changelog.read_text(encoding='utf-8')
                  entry = (
                      'RetreatUI v1.0.11-beta.20\n'
                      '- Added native Auto Accept Role Checks automation without WeakAuras, minimap buttons or chat output.\n'
                      "- Added Bloodmage Vanthir's Gift (1219817) to Procs/Buffs tracking.\n\n"
                  )
                  if not old.startswith('RetreatUI v1.0.11-beta.20'):
                      changelog.write_text(entry + old, encoding='utf-8')

          automation_dir = root / 'RetreatUI/Automation'
          automation_dir.mkdir(parents=True, exist_ok=True)
          auto_file = automation_dir / 'AutoRoleCheck.lua'
          auto_file.write_text(r'''-- RetreatUI native role-check automation.
          -- Replaces the AutoQueue WeakAura without chat output or an extra minimap button.

          local addonName = ...
          local RUI = _G.RetreatUI or {}
          _G.RetreatUI = RUI

          local AutoRoleCheck = RUI.AutoRoleCheck or {}
          RUI.AutoRoleCheck = AutoRoleCheck

          local STORAGE_NAME = "RetreatUIAutomationDB"
          local DEFAULT_ENABLED = true

          local function GetStorage()
              local storage = _G[STORAGE_NAME]
              if type(storage) ~= "table" then
                  storage = {}
                  _G[STORAGE_NAME] = storage
              end
              if storage.autoAcceptRoleChecks == nil then
                  storage.autoAcceptRoleChecks = DEFAULT_ENABLED
              end
              return storage
          end

          function AutoRoleCheck:IsEnabled()
              return GetStorage().autoAcceptRoleChecks ~= false
          end

          function AutoRoleCheck:SetEnabled(enabled)
              GetStorage().autoAcceptRoleChecks = enabled and true or false
              if self.checkbox then
                  self.checkbox:SetChecked(self:IsEnabled())
              end
          end

          function AutoRoleCheck:AcceptPendingRoleCheck()
              if not self:IsEnabled() then
                  return false
              end
              if type(CompleteLFGRoleCheck) ~= "function" then
                  return false
              end
              CompleteLFGRoleCheck(true)
              return true
          end

          local eventFrame = CreateFrame("Frame")
          eventFrame:RegisterEvent("ADDON_LOADED")
          eventFrame:RegisterEvent("LFG_ROLE_CHECK_SHOW")
          eventFrame:SetScript("OnEvent", function(_, event, loadedAddon)
              if event == "ADDON_LOADED" then
                  if loadedAddon == addonName or loadedAddon == "RetreatUI" then
                      GetStorage()
                  end
                  return
              end
              if event == "LFG_ROLE_CHECK_SHOW" then
                  AutoRoleCheck:AcceptPendingRoleCheck()
              end
          end)

          local function CreateOptionsPanel()
              if AutoRoleCheck.panel or type(CreateFrame) ~= "function" then
                  return
              end

              local panel = CreateFrame("Frame", "RetreatUIAutomationOptionsPanel")
              panel.name = "RetreatUI - Automation"

              local title = panel:CreateFontString(nil, "ARTWORK", "GameFontNormalLarge")
              title:SetPoint("TOPLEFT", 16, -16)
              title:SetText("RetreatUI Automation")

              local description = panel:CreateFontString(nil, "ARTWORK", "GameFontHighlightSmall")
              description:SetPoint("TOPLEFT", title, "BOTTOMLEFT", 0, -8)
              description:SetWidth(560)
              description:SetJustifyH("LEFT")
              description:SetText("Small quality-of-life automations managed directly by RetreatUI.")

              local checkbox = CreateFrame("CheckButton", "RetreatUIAutoAcceptRoleChecksCheckButton", panel, "UICheckButtonTemplate")
              checkbox:SetPoint("TOPLEFT", description, "BOTTOMLEFT", -4, -18)
              checkbox:SetSize(26, 26)
              checkbox:SetChecked(AutoRoleCheck:IsEnabled())

              local label = panel:CreateFontString(nil, "ARTWORK", "GameFontNormal")
              label:SetPoint("LEFT", checkbox, "RIGHT", 4, 0)
              label:SetText("Auto Accept Role Checks")

              local help = panel:CreateFontString(nil, "ARTWORK", "GameFontHighlightSmall")
              help:SetPoint("TOPLEFT", checkbox, "BOTTOMLEFT", 30, -2)
              help:SetWidth(520)
              help:SetJustifyH("LEFT")
              help:SetText("Automatically accepts the LFG role check when it appears. Dungeon queue confirmations and invitations are never accepted automatically.")

              checkbox:SetScript("OnClick", function(self)
                  AutoRoleCheck:SetEnabled(self:GetChecked())
              end)
              panel:SetScript("OnShow", function()
                  checkbox:SetChecked(AutoRoleCheck:IsEnabled())
              end)

              AutoRoleCheck.panel = panel
              AutoRoleCheck.checkbox = checkbox

              if _G.Settings and type(_G.Settings.RegisterCanvasLayoutCategory) == "function" then
                  local category = _G.Settings.RegisterCanvasLayoutCategory(panel, panel.name)
                  _G.Settings.RegisterAddOnCategory(category)
                  AutoRoleCheck.category = category
              elseif type(InterfaceOptions_AddCategory) == "function" then
                  InterfaceOptions_AddCategory(panel)
              end
          end

          CreateOptionsPanel()
          ''', encoding='utf-8')

          text = core_toc.read_text(encoding='utf-8')
          match = re.search(r'(?m)^(## SavedVariables:\s*)(.*)$', text)
          if match:
              names = [item.strip() for item in match.group(2).split(',') if item.strip()]
              if 'RetreatUIAutomationDB' not in names:
                  names.append('RetreatUIAutomationDB')
              text = text[:match.start()] + match.group(1) + ', '.join(names) + text[match.end():]
          else:
              first_newline = text.find('\n') + 1
              text = text[:first_newline] + '## SavedVariables: RetreatUIAutomationDB\n' + text[first_newline:]
          if 'Automation\\AutoRoleCheck.lua' not in text and 'Automation/AutoRoleCheck.lua' not in text:
              text = text.rstrip() + '\nAutomation\\AutoRoleCheck.lua\n'
          core_toc.write_text(text, encoding='utf-8')

          blood_file = root / 'RetreatUI_Classes/Bloodmage/VanthirsGift.lua'
          blood_file.parent.mkdir(parents=True, exist_ok=True)
          blood_file.write_text(r'''-- Bloodmage proc tracking: Vanthir's Gift.
          local RUI = _G.RetreatUI
          if not RUI or type(RUI.GetClassSpellDatabase) ~= "function" then
              return
          end

          local database = RUI:GetClassSpellDatabase("Bloodmage")
          database.spells = database.spells or {}

          local spellID = 1219817
          for _, record in ipairs(database.spells) do
              if tonumber(record.id) == spellID then
                  record.name = "Vanthir's Gift"
                  record.auraTracker = true
                  record.targetDebuff = nil
                  record.targetResource = nil
                  record.category = "Procs/Buffs"
                  return
              end
          end

          table.insert(database.spells, {
              name = "Vanthir's Gift",
              id = spellID,
              auraTracker = true,
              category = "Procs/Buffs",
          })
          ''', encoding='utf-8')

          classes_text = classes_toc.read_text(encoding='utf-8')
          if 'Bloodmage\\VanthirsGift.lua' not in classes_text and 'Bloodmage/VanthirsGift.lua' not in classes_text:
              lines = classes_text.splitlines()
              insert_at = len(lines)
              for index, line in enumerate(lines):
                  if 'WagoCurated.lua' in line.replace('\\', '/'):
                      insert_at = index + 1
                      break
              lines.insert(insert_at, 'Bloodmage\\VanthirsGift.lua')
              classes_text = '\n'.join(lines) + '\n'
          classes_toc.write_text(classes_text, encoding='utf-8')
          PY
          python /tmp/build_beta20.py

      - name: Validate source and behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('build/source')
          core_toc = (root / 'RetreatUI/RetreatUI.toc').read_text(encoding='utf-8')
          classes_toc = (root / 'RetreatUI_Classes/RetreatUI_Classes.toc').read_text(encoding='utf-8')
          auto = (root / 'RetreatUI/Automation/AutoRoleCheck.lua').read_text(encoding='utf-8')
          blood = (root / 'RetreatUI_Classes/Bloodmage/VanthirsGift.lua').read_text(encoding='utf-8')
          turbo = (root / 'RetreatUI/Integrations/TurboPlates.lua').read_text(encoding='utf-8')
          star_data = (root / 'RetreatUI_Classes/Starcaller/Data.lua').read_text(encoding='utf-8')
          star_hud = (root / 'RetreatUI_Classes/Starcaller/HUD.lua').read_text(encoding='utf-8')
          checks = {
              'core beta.20 version': '## Version: 1.0.11-beta.20' in core_toc,
              'classes beta.20 version': '## Version: 1.0.11-beta.20' in classes_toc,
              'saved automation setting': 'RetreatUIAutomationDB' in core_toc,
              'automation module loaded': 'Automation\\AutoRoleCheck.lua' in core_toc,
              'role-check event only': 'LFG_ROLE_CHECK_SHOW' in auto,
              'role-check acceptance': 'CompleteLFGRoleCheck(true)' in auto,
              'enabled by default': 'DEFAULT_ENABLED = true' in auto,
              'settings toggle': 'Auto Accept Role Checks' in auto,
              'no automation chat output': 'print(' not in auto and 'DEFAULT_CHAT_FRAME' not in auto,
              'Bloodmage module loaded': 'Bloodmage\\VanthirsGift.lua' in classes_toc,
              "Vanthir's Gift id": '1219817' in blood,
              "Vanthir's Gift proc tracker": 'auraTracker = true' in blood,
              "Vanthir's Gift not target data": 'targetDebuff = nil' in blood and 'targetResource = nil' in blood,
              'silent TurboPlates retained': 'ReportTargetManaDiagnostic' not in turbo and 'TurboPlates mana:' not in turbo,
              'validated mana filter retained': 'synthetic_100_pool' in turbo and 'non_mana_class' in turbo,
              'Starcaller eight stacks retained': 'maximum=8' in star_data and 'maximum = 8' in star_hud,
              'Starcaller target reset retained': 'PLAYER_TARGET_CHANGED' in star_hud,
          }
          for name, passed in checks.items():
              print(('PASS' if passed else 'FAIL') + ': ' + name)
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise RuntimeError('Validation failed: ' + ', '.join(failed))
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find build/source/RetreatUI build/source/RetreatUI_Classes \
            -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

          cat > /tmp/test_auto_role_check.lua <<'LUA'
          RetreatUI = {}
          RetreatUIAutomationDB = nil
          local calls = 0
          local eventHandler

          function CompleteLFGRoleCheck(accepted)
              assert(accepted == true, 'role check was not accepted with true')
              calls = calls + 1
          end

          local function NewObject(isEventFrame)
              local object = {_isEventFrame = isEventFrame}
              function object:RegisterEvent() end
              function object:SetScript(scriptName, callback)
                  if self._isEventFrame and scriptName == 'OnEvent' then
                      eventHandler = callback
                  end
              end
              function object:CreateFontString()
                  return NewObject(false)
              end
              function object:GetChecked()
                  return true
              end
              setmetatable(object, {
                  __index = function()
                      return function() end
                  end,
              })
              return object
          end

          local frameNumber = 0
          function CreateFrame()
              frameNumber = frameNumber + 1
              return NewObject(frameNumber == 1)
          end
          function InterfaceOptions_AddCategory() end

          dofile('build/source/RetreatUI/Automation/AutoRoleCheck.lua')
          assert(RetreatUI.AutoRoleCheck, 'module API missing')
          assert(RetreatUI.AutoRoleCheck:IsEnabled() == true, 'default should be enabled')
          assert(type(eventHandler) == 'function', 'event handler missing')

          eventHandler(nil, 'UNRELATED_EVENT')
          assert(calls == 0, 'unrelated event accepted a role check')
          eventHandler(nil, 'LFG_ROLE_CHECK_SHOW')
          assert(calls == 1, 'enabled role check was not accepted exactly once')

          RetreatUI.AutoRoleCheck:SetEnabled(false)
          eventHandler(nil, 'LFG_ROLE_CHECK_SHOW')
          assert(calls == 1, 'disabled module accepted a role check')
          assert(RetreatUIAutomationDB.autoAcceptRoleChecks == false, 'disabled setting was not saved')

          RetreatUI.AutoRoleCheck:SetEnabled(true)
          assert(RetreatUIAutomationDB.autoAcceptRoleChecks == true, 'enabled setting was not saved')
          print('PASS: native Auto Accept Role Checks behavior')
          LUA
          lua5.1 /tmp/test_auto_role_check.lua

          cat > /tmp/test_vanthirs_gift.lua <<'LUA'
          local databases = {}
          RetreatUI = {}
          function RetreatUI:GetClassSpellDatabase(className)
              databases[className] = databases[className] or {spells = {}}
              return databases[className]
          end
          dofile('build/source/RetreatUI_Classes/Bloodmage/VanthirsGift.lua')
          local db = assert(databases.Bloodmage, 'Bloodmage database missing')
          local found = 0
          for _, record in ipairs(db.spells) do
              if tonumber(record.id) == 1219817 then
                  found = found + 1
                  assert(record.name == "Vanthir's Gift", 'wrong proc name')
                  assert(record.auraTracker == true, 'proc is not an aura tracker')
                  assert(record.targetDebuff == nil, 'proc leaked into target debuffs')
                  assert(record.targetResource == nil, 'proc leaked into target resources')
                  assert(record.category == 'Procs/Buffs', 'wrong proc category')
              end
          end
          assert(found == 1, "Vanthir's Gift should exist exactly once")
          print("PASS: Bloodmage Vanthir's Gift proc tracking")
          LUA
          lua5.1 /tmp/test_vanthirs_gift.lua

      - name: Package and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd build/source
          zip -qr ../RetreatUI_v1.0.11-beta.20.zip RetreatUI RetreatUI_Classes
          cd ../..
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path('build/RetreatUI_v1.0.11-beta.20.zip')
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              roots = sorted({name.split('/', 1)[0] for name in names if name})
              assert roots == ['RetreatUI', 'RetreatUI_Classes'], roots
              core_toc = z.read('RetreatUI/RetreatUI.toc').decode('utf-8')
              classes_toc = z.read('RetreatUI_Classes/RetreatUI_Classes.toc').decode('utf-8')
              auto = z.read('RetreatUI/Automation/AutoRoleCheck.lua').decode('utf-8')
              blood = z.read('RetreatUI_Classes/Bloodmage/VanthirsGift.lua').decode('utf-8')
              assert '## Version: 1.0.11-beta.20' in core_toc
              assert '## Version: 1.0.11-beta.20' in classes_toc
              assert 'CompleteLFGRoleCheck(true)' in auto
              assert 'print(' not in auto
              assert '1219817' in blood and 'auraTracker = true' in blood
          print('PASS: beta.20 ZIP structure and content')
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.20
          path: build/RetreatUI_v1.0.11-beta.20.zip
          if-no-files-found: error

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.0.11-beta.20'
          ASSET='build/RetreatUI_v1.0.11-beta.20.zip'
          NOTES=$(cat <<'EOF'
          - Added native Auto Accept Role Checks, replacing the AutoQueue WeakAura behavior.
          - The feature is enabled by default, saved between sessions and can be disabled under RetreatUI - Automation.
          - It only accepts LFG role checks; queue confirmations and invitations remain manual.
          - Removed AutoQueue chat output and the extra minimap button.
          - Added Vanthir's Gift (1219817) to Bloodmage Procs/Buffs tracking.
          - Preserved beta.19 Starcaller Scattered Stars, TurboPlates and Buff Manager fixes.
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title 'RetreatUI v1.0.11-beta.20' --notes "$NOTES" --prerelease
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --title 'RetreatUI v1.0.11-beta.20' --notes "$NOTES" --prerelease
          fi

      - name: Remove temporary publication files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RetreatUI Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git checkout -B beta20-cleanup origin/main
          rm -rf .release-v1.0.11-beta.20 .release-v1.0.11-beta.20-native
          rm -f .github/workflows/publish-v1.0.11-beta.20.yml
          rm -f .github/workflows/publish-v1.0.11-beta.20-native.yml
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git add -A
            git commit -m 'Remove temporary beta.20 publication files'
            git push origin HEAD:main
          fi
