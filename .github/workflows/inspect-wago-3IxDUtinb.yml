name: Inspect Wago 3IxDUtinb

on:
  pull_request:
    branches:
      - main
    paths:
      - ".wago-inspect/3IxDUtinb-trigger"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Wago import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wago
          python - <<'PY'
          import pathlib, urllib.request
          url='https://data.wago.io/api/raw/encoded?id=3IxDUtinb'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 RetreatUI-inspector'})
          with urllib.request.urlopen(req, timeout=30) as response:
              data=response.read()
          pathlib.Path('/tmp/wago/encoded.txt').write_bytes(data)
          print('Fetched encoded import:', len(data), 'bytes')
          PY
      - name: Decode WeakAura
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/geexmmo/python-weakauras-tool.git /tmp/python-weakauras-tool
          python -m pip install --quiet lupa
          python - <<'PY'
          import json
          from pathlib import Path
          from lupa.luajit21 import LuaRuntime

          tool = Path('/tmp/python-weakauras-tool')
          encoded = Path('/tmp/wago/encoded.txt').read_text(encoding='utf-8').strip()
          lua = LuaRuntime(unpack_returned_tuples=True)
          decoder = lua.eval((tool / 'lua/decode.lua').read_text(encoding='utf-8'))
          decoded_text = decoder(encoded, str(tool))
          data = json.loads(decoded_text)
          Path('/tmp/wago/decoded.json').write_text(json.dumps(data, indent=2, ensure_ascii=False), encoding='utf-8')

          print('=== TOP LEVEL ===')
          print('type:', type(data).__name__)
          if isinstance(data, dict):
              print('keys:', sorted(data.keys()))

          def walk(value, path='root'):
              if isinstance(value, dict):
                  interesting = {}
                  for key in ('id','uid','regionType','authorMode','anchorFrameType','anchorFrameFrame','anchorPoint','selfPoint','xOffset','yOffset','width','height','icon','texture','text','displayText','url','desc','controlledChildren','load','triggers','conditions','actions','information','semver','version'):
                      if key in value:
                          interesting[key] = value[key]
                  if interesting:
                      print('\nNODE', path)
                      for key,val in interesting.items():
                          text=repr(val)
                          if len(text)>1200: text=text[:1200]+'...'
                          print(f'{key}: {text}')
                  for key,child in value.items():
                      if isinstance(child,(dict,list)):
                          walk(child, f'{path}.{key}')
              elif isinstance(value, list):
                  for index,child in enumerate(value):
                      if isinstance(child,(dict,list)):
                          walk(child, f'{path}[{index}]')
          walk(data)
          print('\nDecoded JSON bytes:', Path('/tmp/wago/decoded.json').stat().st_size)
          PY
      - name: Upload decoded definition
        uses: actions/upload-artifact@v4
        with:
          name: wago-3IxDUtinb-decoded
          path: /tmp/wago/decoded.json
          if-no-files-found: error
