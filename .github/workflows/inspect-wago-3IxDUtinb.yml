name: Inspect Wago 3IxDUtinb

on:
  pull_request:
    branches:
      - main
    paths:
      - ".wago-inspect/3IxDUtinb-trigger"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Wago metadata and raw data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wago
          python - <<'PY'
          import json, pathlib, urllib.request
          urls = {
              'check': 'https://data.wago.io/api/check/3IxDUtinb',
              'encoded': 'https://data.wago.io/api/raw/encoded?id=3IxDUtinb',
              'decoded': 'https://data.wago.io/api/raw/decoded?id=3IxDUtinb',
              'page_api': 'https://wago.io/api/raw/encoded?id=3IxDUtinb',
          }
          headers={'User-Agent':'Mozilla/5.0 RetreatUI-inspector'}
          root=pathlib.Path('/tmp/wago')
          for name,url in urls.items():
              try:
                  req=urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data=r.read()
                      (root/name).write_bytes(data)
                      print(f'=== {name} status={r.status} ctype={r.headers.get("content-type")} bytes={len(data)} ===')
                      text=data.decode('utf-8','replace')
                      print(text[:12000])
              except Exception as e:
                  print(f'=== {name} ERROR {type(e).__name__}: {e} ===')
          PY
      - name: Inspect fetched files
        shell: bash
        run: |
          set -euo pipefail
          for f in /tmp/wago/*; do
            echo "=== FILE $f ==="
            file "$f" || true
            wc -c "$f" || true
            head -c 500 "$f" || true
            echo
          done
