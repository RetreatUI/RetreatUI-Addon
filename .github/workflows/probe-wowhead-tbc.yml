name: Probe Wowhead TBC sources

on:
  push:
    branches:
      - feature/tbc-anniversary-feral-foundation
    paths:
      - "TBC/Tools/wowhead_probe.py"
      - ".github/workflows/probe-wowhead-tbc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Probe Wowhead
        run: python TBC/Tools/wowhead_probe.py
