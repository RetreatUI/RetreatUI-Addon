name: Publish Eternal Bloodmage prerelease

on:
  push:
    branches:
      - feature/class-hud-cooldown-rows
    paths:
      - ".github/workflows/publish-eternal-fix-prerelease.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Prepare prerelease version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.1.3-beta.1"
          sed -i "s/^## Version:.*/## Version: ${VERSION}/" RetreatUI/RetreatUI.toc
          sed -i "s/^## Version:.*/## Version: ${VERSION}/" RetreatUI_Classes/RetreatUI_Classes.toc
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1 zip
          find RetreatUI RetreatUI_Classes -type f -name '*.lua' -print0 | sort -z | xargs -0 -n1 luac5.1 -p
          ZIP="RetreatUI_v${VERSION}.zip"
          zip -qr "$ZIP" RetreatUI RetreatUI_Classes
          test -s "$ZIP"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          ZIP="RetreatUI_v${VERSION}.zip"
          gh release create "$TAG" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RetreatUI ${VERSION}" \
            --prerelease \
            --notes "Test prerelease from PR #90. Corrects Eternal Bloodmage classification: Wicked Howl is Defensive/Utility and Eternal Resolve is Offensive/Main. Main offensive abilities remain on Main with wrapping after nine icons; defensives and normal utility remain on Utility."
