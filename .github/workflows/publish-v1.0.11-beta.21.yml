name: Publish RetreatUI v1.0.11-beta.21

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'release/v1.0.11-beta.21'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.11-beta.21
      ZIP_NAME: RetreatUI_v1.0.11-beta.21.zip
      PATCH_SHA256: 2611ee82c3f0694e030113d3c73c9eb64593f352fe029f195107ece01bb0531e

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 unzip zip patch

      - name: Download beta.20 base
        run: |
          mkdir -p base work
          gh release download v1.0.11-beta.20 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.20.zip' \
            --dir base
          test -f base/RetreatUI_v1.0.11-beta.20.zip
          unzip -q base/RetreatUI_v1.0.11-beta.20.zip -d work

      - name: Verify and apply beta.21 patch
        run: |
          echo "$PATCH_SHA256  .release-v1.0.11-beta.21/beta21.patch" | sha256sum -c -
          patch --batch --forward -p1 -d work < .release-v1.0.11-beta.21/beta21.patch

      - name: Validate Enraging Howl tracking
        run: |
          grep -Fq '## Version: 1.0.11-beta.21' work/RetreatUI/RetreatUI.toc
          grep -Fq '## Version: 1.0.11-beta.21' work/RetreatUI_Classes/RetreatUI_Classes.toc
          grep -Fq 'name="Enraging Howl", id=504157' work/RetreatUI_Classes/Bloodmage/Data.lua
          grep -Fq 'auraNames={"Enraging Howl","Enraging Howls"}' work/RetreatUI_Classes/Bloodmage/Data.lua
          grep -Fq '["Enraging Howl"]=true' work/RetreatUI_Classes/Bloodmage/HUD.lua
          grep -Fq 'combatBuffs={"Saturating Sutures", "Blood Rush", "Enraging Howl", "Call of the Darkwing"}' work/RetreatUI_Classes/Bloodmage/Definition.lua
          if grep -Fq 'id=504551' work/RetreatUI_Classes/Bloodmage/Data.lua; then
            echo 'Obsolete Enraging Howls spell ID is still present.' >&2
            exit 1
          fi

      - name: Validate Lua 5.1 syntax
        run: |
          find work/RetreatUI work/RetreatUI_Classes -type f -name '*.lua' -print0 \
            | xargs -0 -n1 luac5.1 -p

      - name: Package addon
        run: |
          cd work
          zip -qr "../$ZIP_NAME" RetreatUI RetreatUI_Classes
          cd ..
          test -f "$ZIP_NAME"

      - name: Validate ZIP structure
        run: |
          python3 - <<'PY'
          import zipfile
          name = 'RetreatUI_v1.0.11-beta.21.zip'
          with zipfile.ZipFile(name) as archive:
              roots = sorted({entry.split('/', 1)[0] for entry in archive.namelist() if entry})
              if roots != ['RetreatUI', 'RetreatUI_Classes']:
                  raise SystemExit(f'Unexpected ZIP roots: {roots}')
              core = archive.read('RetreatUI/RetreatUI.toc').decode('utf-8')
              classes = archive.read('RetreatUI_Classes/RetreatUI_Classes.toc').decode('utf-8')
              data = archive.read('RetreatUI_Classes/Bloodmage/Data.lua').decode('utf-8')
              hud = archive.read('RetreatUI_Classes/Bloodmage/HUD.lua').decode('utf-8')
              assert '## Version: 1.0.11-beta.21' in core
              assert '## Version: 1.0.11-beta.21' in classes
              assert 'name="Enraging Howl", id=504157' in data
              assert '["Enraging Howl"]=true' in hud
              assert 'id=504551' not in data
          PY
          sha256sum "$ZIP_NAME"

      - name: Publish GitHub pre-release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its asset."
            gh release upload "$TAG" "$ZIP_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ZIP_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'RetreatUI v1.0.11-beta.21' \
              --prerelease \
              --notes $'Bloodmage proc-tracking fix.\n\n- Corrects Enraging Howl to the verified live spell ID 504157.\n- Tracks Enraging Howl in the Bloodmage Procs/Buffs row with duration.\n- Keeps the plural aura-name alias as a compatibility fallback without creating a duplicate tracker.\n- Preserves Auto Accept Role Checks, Vanthir\'s Gift, Starcaller resources, TurboPlates and Buff Manager behavior from beta.20.'
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.21-artifact
          path: RetreatUI_v1.0.11-beta.21.zip
          if-no-files-found: error
