name: Publish RetreatUI v1.0.11-beta.8 PR

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-v1.0.11-beta.8/trigger-pr"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-v1.0.11-beta.8-pr
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download beta.7 source package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/base build/source
          gh release download v1.0.11-beta.7 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.7.zip' \
            --dir build/base
          unzip -q build/base/RetreatUI_v1.0.11-beta.7.zip -d build/source
          test -f build/source/RetreatUI/RetreatUI.toc
          test -f build/source/RetreatUI_Classes/RetreatUI_Classes.toc

      - name: Decode and apply beta.8 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release-v1.0.11-beta.8/beta8.patch.gz.b64 | gzip -dc > beta8.patch
          git apply --check --directory=build/source beta8.patch
          git apply --directory=build/source beta8.patch

      - name: Validate beta source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('build/source')
          expected = '1.0.11-beta.8'
          core_toc = (root / 'RetreatUI/RetreatUI.toc').read_text(encoding='utf-8')
          classes_toc = (root / 'RetreatUI_Classes/RetreatUI_Classes.toc').read_text(encoding='utf-8')
          witchdoctor = (root / 'RetreatUI_Classes/WitchDoctor/Data.lua').read_text(encoding='utf-8')
          totem = (root / 'RetreatUI/Core/TotemBarMover.lua').read_text(encoding='utf-8')
          events = (root / 'RetreatUI/Core/Events.lua').read_text(encoding='utf-8')
          turbo = (root / 'RetreatUI/Integrations/TurboPlates.lua').read_text(encoding='utf-8')
          buff_manager = (root / 'RetreatUI/Core/BuffManager.lua').read_text(encoding='utf-8')
          elvui = (root / 'RetreatUI/Integrations/ElvUI.lua').read_text(encoding='utf-8')

          checks = {
              'core version': f'## Version: {expected}' in core_toc,
              'classes version': f'## Version: {expected}' in classes_toc,
              'Mana Jinx main rotation': 'name="Mana Jinx", id=801925, category="rotation", hudRow="core"' in witchdoctor,
              'Stasis Ward main rotation': 'name="Stasis Ward", id=801678, category="rotation", hudRow="core"' in witchdoctor,
              'Shadow Avatar main rotation': 'name="Shadow Avatar", id=705943, category="rotation", hudRow="core"' in witchdoctor,
              'Hexing Effigy utility': 'name="Hexing Effigy", id=506634, category="utility", hudRow="utility"' in witchdoctor,
              'Totem Bar drag grip': 'RetreatUITotemBarDragHandle' in totem and 'RegisterForDrag("LeftButton")' in totem,
              'Totem Bar persistence': 'GetTotemBarMoverPosition' in totem and 'preservedTotemMover' in elvui,
              'Totem Bar runtime init': 'InitializeTotemBarMover' in events,
              'mana NPC detection': 'UnitUsesMana' in turbo and 'UnitPowerType(unit)' in turbo,
              'mana-blue health bars': 'MANA_BLUE' in turbo and 'InitializeTurboManaColoring' in turbo,
              'single vertical Buff Manager': 'local COMPACT_COLUMNS = 1' in buff_manager,
              'class text color retained': 'ApplyManagedUnitTextColor' in elvui,
          }
          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(('PASS' if passed else 'FAIL') + ': ' + name)
          if failed:
              raise RuntimeError('Validation failed: ' + ', '.join(failed))
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find build/source/RetreatUI build/source/RetreatUI_Classes \
            -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Package and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('build/source')
          output = Path('RetreatUI_v1.0.11-beta.8.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for root_name in ('RetreatUI', 'RetreatUI_Classes'):
                  for path in sorted((root / root_name).rglob('*')):
                      if path.is_file():
                          archive.write(path, path.relative_to(root).as_posix())

          with zipfile.ZipFile(output) as archive:
              names = set(archive.namelist())
              roots = {name.split('/', 1)[0] for name in names if '/' in name}
              if roots != {'RetreatUI', 'RetreatUI_Classes'}:
                  raise RuntimeError(f'Unexpected ZIP roots: {sorted(roots)}')
              required = {
                  'RetreatUI/RetreatUI.toc',
                  'RetreatUI/Core/TotemBarMover.lua',
                  'RetreatUI/Integrations/TurboPlates.lua',
                  'RetreatUI_Classes/RetreatUI_Classes.toc',
                  'RetreatUI_Classes/WitchDoctor/Data.lua',
              }
              missing = required - names
              if missing:
                  raise RuntimeError(f'Missing ZIP entries: {sorted(missing)}')
          PY
          sha256sum RetreatUI_v1.0.11-beta.8.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.8
          path: RetreatUI_v1.0.11-beta.8.zip

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # RetreatUI v1.0.11-beta.8 — Witch Doctor & Mana Plates Test

          ## Test focus

          - Mana Jinx (801925), Stasis Ward (801678) and Shadow Avatar (705943) appear in Witch Doctor's main rotation row when learned
          - Hexing Effigy (506634) appears in Witch Doctor utility when learned
          - The Witch Doctor Totem Bar has a small drag grip and remembers its custom position
          - Reinstalling the RetreatUI ElvUI profile preserves the saved Totem Bar position
          - TurboPlates colors non-player NPC health bars blue when their active resource is mana
          - Non-mana NPCs keep TurboPlates' normal colors
          - The Buff Manager remains one vertical column on every class
          - Direct class-colored player and target text remains included
          EOF

          tag='v1.0.11-beta.8'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.8 — Witch Doctor & Mana Plates Test' \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$tag" RetreatUI_v1.0.11-beta.8.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" RetreatUI_v1.0.11-beta.8.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.8 — Witch Doctor & Mana Plates Test' \
              --notes-file release-notes.md \
              --prerelease
          fi
