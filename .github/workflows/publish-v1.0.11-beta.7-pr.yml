name: Publish RetreatUI v1.0.11-beta.7 PR

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-v1.0.11-beta.7/trigger-pr"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-v1.0.11-beta.7-pr
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download beta.6 source package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/base build/source
          gh release download v1.0.11-beta.6 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RetreatUI_v1.0.11-beta.6.zip' \
            --dir build/base
          unzip -q build/base/RetreatUI_v1.0.11-beta.6.zip -d build/source
          test -f build/source/RetreatUI/RetreatUI.toc
          test -f build/source/RetreatUI_Classes/RetreatUI_Classes.toc

      - name: Decode and apply beta.7 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release-v1.0.11-beta.7/beta7.patch.gz.b64 | gzip -dc > beta7.patch
          git apply --check --directory=build/source beta7.patch
          git apply --directory=build/source beta7.patch

      - name: Validate beta source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('build/source')
          expected = '1.0.11-beta.7'
          core_toc = (root / 'RetreatUI/RetreatUI.toc').read_text(encoding='utf-8')
          classes_toc = (root / 'RetreatUI_Classes/RetreatUI_Classes.toc').read_text(encoding='utf-8')
          elvui = (root / 'RetreatUI/Integrations/ElvUI.lua').read_text(encoding='utf-8')
          buff_manager = (root / 'RetreatUI/Core/BuffManager.lua').read_text(encoding='utf-8')
          witchdoctor = (root / 'RetreatUI_Classes/WitchDoctor/Data.lua').read_text(encoding='utf-8')
          sun_cleric = (root / 'RetreatUI_Classes/SunCleric/HUD.lua').read_text(encoding='utf-8')

          checks = {
              'core version': f'## Version: {expected}' in core_toc,
              'classes version': f'## Version: {expected}' in classes_toc,
              'direct class color tags': 'ApplyManagedUnitTextColor' in elvui,
              'player and target names managed': 'name = "[name:medium]"' in elvui,
              'player and target health managed': 'health = "[health:current]"' in elvui,
              'existing profile migration': 'HUD_POLISH_REVISION = 4' in elvui,
              'single vertical buff column': 'local COMPACT_COLUMNS = 1' in buff_manager,
              'Witch Doctor retained': 'Hex of Malice' in witchdoctor and 'Drakkari Barrier' in witchdoctor,
              'Sun Cleric spacing retained': 'anchor="player"' in sun_cleric,
          }
          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(('PASS' if passed else 'FAIL') + ': ' + name)
          if failed:
              raise RuntimeError('Validation failed: ' + ', '.join(failed))
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find build/source/RetreatUI build/source/RetreatUI_Classes \
            -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Package and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('build/source')
          output = Path('RetreatUI_v1.0.11-beta.7.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for root_name in ('RetreatUI', 'RetreatUI_Classes'):
                  for path in sorted((root / root_name).rglob('*')):
                      if path.is_file():
                          archive.write(path, path.relative_to(root).as_posix())

          with zipfile.ZipFile(output) as archive:
              names = set(archive.namelist())
              roots = {name.split('/', 1)[0] for name in names if '/' in name}
              if roots != {'RetreatUI', 'RetreatUI_Classes'}:
                  raise RuntimeError(f'Unexpected ZIP roots: {sorted(roots)}')
              required = {
                  'RetreatUI/RetreatUI.toc',
                  'RetreatUI/Core/BuffManager.lua',
                  'RetreatUI/Integrations/ElvUI.lua',
                  'RetreatUI_Classes/RetreatUI_Classes.toc',
              }
              missing = required - names
              if missing:
                  raise RuntimeError(f'Missing ZIP entries: {sorted(missing)}')
          PY
          sha256sum RetreatUI_v1.0.11-beta.7.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-v1.0.11-beta.7
          path: RetreatUI_v1.0.11-beta.7.zip

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # RetreatUI v1.0.11-beta.7 — Class Text Color & Vertical Buff Manager Test

          ## Test focus

          - Player and target names use the active RetreatUI class accent
          - Player and target health values use the same class accent
          - Existing RetreatUI ElvUI profiles are migrated, not only fresh installs
          - Custom unit-frame tag layouts remain preserved
          - The compact Buff Manager is one vertical column on every class
          - Buff icons never wrap horizontally into a second column
          - All installer, Cultist, Sun Cleric, right-chat and Witch Doctor changes remain included
          EOF

          tag='v1.0.11-beta.7'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.7 — Class Text Color & Vertical Buff Manager Test' \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$tag" RetreatUI_v1.0.11-beta.7.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" RetreatUI_v1.0.11-beta.7.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'RetreatUI v1.0.11-beta.7 — Class Text Color & Vertical Buff Manager Test' \
              --notes-file release-notes.md \
              --prerelease
          fi
